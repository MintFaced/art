<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MintFace</title>
<meta name="description" content="Paintings, photographs and tokenized work by MintFace.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MintFace">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mintface.css">
<style>
/* ---------- hero ---------- */
.hero{padding:4px 28px 0;text-align:center;min-height:40vh}
.hero a{display:block;text-decoration:none}
.hero .shot{display:inline-block;max-width:100%}
.hero img{max-height:84vh;width:auto;margin:0 auto;opacity:0;transition:opacity .8s ease}
.hero img.in{opacity:1}
.hero .cap{
  display:flex;gap:16px;justify-content:center;align-items:baseline;flex-wrap:wrap;
  margin-top:20px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.hero .title{font-family:var(--serif);font-size:23px;letter-spacing:0;text-transform:none;color:var(--ink)}
.hero a:hover .title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.hero .price{font-family:var(--serif);font-size:19px;letter-spacing:0;text-transform:none;color:var(--ink)}

.wordmark-big{
  max-width:1500px;margin:0 auto;padding:66px 28px 0;
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
}
.wordmark-big h1{font-family:var(--serif);font-weight:300;font-size:clamp(46px,9vw,110px);line-height:.9;margin:0;letter-spacing:-.025em}
.wordmark-big .sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);max-width:330px;line-height:2}

/* ---------- collections ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:44px 28px 40px}
.group{margin:0 0 62px}
.group > h2{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:400;margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
}
.group > h2 a{text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
.group > h2 a:hover{color:var(--ink);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:34px}
.card{text-decoration:none;display:block}
.card .shot{background:#f2efe9;aspect-ratio:1/1;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.card img.in{opacity:1}
.card .t{font-family:var(--serif);font-size:24px;line-height:1.2;margin-top:12px}
.card .m{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.card .s{font-family:var(--serif);font-size:17px;color:#514c44;margin-top:8px;line-height:1.4}
.card:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.badge{border:1px solid var(--rule);padding:3px 8px}
.annex .cards{grid-template-columns:repeat(6,1fr);gap:24px}
.annex .card .t{font-size:19px}
.annex .card .s{display:none}

@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.annex .cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr);gap:22px}.annex .cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){
  .hero{padding:0}
  .hero img{max-height:none;width:100%}
  .hero .cap{padding:0 20px}
  .wordmark-big{padding:44px 20px 0}
  .wrap{padding:32px 20px 30px}
  .cards,.annex .cards{grid-template-columns:repeat(2,1fr);gap:18px}
}
</style>
</head>
<body>

<header class="bar">
  <a class="wordmark" href="/">MintFace</a>
  <a class="smallcaps" href="/collections">Collections</a>
</header>

<main id="main">
  <div class="hero" id="hero"></div>
</main>

<footer class="foot">
  <a class="smallcaps" href="/exhibitions">Exhibitions</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="/vault">The Vault</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
</footer>

<script src="/mintface.js"></script>
<script>
const e = MF.escape;

// one work per visit, from the curated list when there is one
function pickHero(ids) {
  return ids.length ? ids[Math.floor(Math.random() * ids.length)] : null;
}

function heroMarkup(work, collection) {
  const title = /^#?\d+$/.test((work.title || '').trim())
    ? `${collection.title} ${work.title.startsWith('#') ? work.title : '#' + work.title}`
    : (work.title || 'Untitled');
  const st = MF.STATUS[work.status] || { label: work.status, dot: '' };
  const p = work.pricing_nzd && work.pricing_nzd.digital != null ? work.pricing_nzd.digital : null;
  return `<a href="/w/${encodeURIComponent(work.id)}">
    <div class="shot">${MF.img(work, 1600, { eager: true, alt: title })}</div>
    <div class="cap">
      <span class="title">${e(title)}</span>
      <span>${e(collection.title)}</span>
      <span><span class="dot ${st.dot}"></span> ${e(st.label)}</span>
      ${p != null ? `<span class="price">$${Math.round(p).toLocaleString('en-NZ')}</span>` : ''}
    </div>
  </a>`;
}

async function hero(home, idx) {
  const el = document.getElementById('hero');

  let id = pickHero(home.hero || []);
  if (id) {
    const hit = await MF.work(id);
    if (hit) { el.innerHTML = heroMarkup(hit.work, hit.collection); return; }
  }

  // no curated list yet: fall back to a collection cover, clearly provisional
  const pool = idx.collections.filter((c) => c.cover && c.cover.image && c.counts.available && c.group !== 'archive');
  if (!pool.length) { el.remove(); return; }
  const c = pool[Math.floor(Math.random() * pool.length)];
  const hit = await MF.work(c.cover.id);
  if (hit) el.innerHTML = heroMarkup(hit.work, hit.collection);
  else el.remove();
}

(async function () {
  try {
    const [home, idx] = await Promise.all([
      fetch('/data/f/home.json').then((r) => r.json()).catch(() => ({ hero: [] })),
      MF.index(),
    ]);

    const groups = MF.groupsWithCollections(idx);
    const works = idx.collections.reduce((n, c) => n + (c.counts.works || 0), 0);

    document.getElementById('main').insertAdjacentHTML('beforeend', `
      <div class="wordmark-big">
        <h1>MintFace</h1>
        <div class="sub">
          ${works.toLocaleString('en-NZ')} works on record<br>
          Painting, photography, AI and code<br>
          New Zealand
        </div>
      </div>
      <div class="wrap">
        ${groups.map((g) => {
          const annex = g.id === 'geodetic-studies' || g.id === 'archive';
          const setLink = g.id === 'geodetic' ? '<a class="smallcaps" href="/geodetic">The set as one page</a>' : '';
          return `<section class="group ${annex ? 'annex' : ''}">
            <h2>${e(g.title)}${setLink}</h2>
            <div class="cards">${g.collections.map((c) => MF.collectionCard(c)).join('')}</div>
          </section>`;
        }).join('')}
      </div>`);

    await hero(home, idx);
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="loading">Could not load</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
