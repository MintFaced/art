[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
gas_limit = 1000000000
fs_permissions = [{ access = "read", path = "./build" }, { access = "read", path = "./test/fixtures" }, { access = "write", path = "./build/out" }]

[fuzz]
runs = 512

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[profile.fork]
match_path = "test/fork/*"
