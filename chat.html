<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio ... MintFace</title>
<meta name="description" content="chillin' in the studio talking art with each other. TAO gets you in. All can read. Own 1x MintFace artwork, chat in Studio.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MintFace">
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mintface.css">
<style>
.mast{max-width:720px;margin:0 auto;padding:60px 28px 0}
h1{font-family:var(--font-sans);font-weight:400;font-size:clamp(40px,8vw,84px);line-height:.96;margin:0;letter-spacing:-.035em}
.sub{font-size:13px;color:var(--muted);margin-top:20px;max-width:44em;line-height:1.7}
.room{max-width:720px;margin:0 auto;padding:24px 28px 40px}

.earlier{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);background:none;border:0;padding:14px 0;cursor:pointer;display:block;width:100%;text-align:left;
  border-bottom:1px solid var(--rule)}
.earlier:hover{color:var(--ink)}

.m{padding:16px 0;border-bottom:1px solid var(--rule)}
.m:last-child{border-bottom:0}
.m .who{font-family:var(--font-mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.m .who .tao{color:var(--faint);font-variant-numeric:tabular-nums}
.m .who .at{color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
/* A name goes to the page that holds it. No rule at rest: forty messages with
   a hairline under every name reads as a form rather than as a conversation.
   The rule arrives under the pointer, which is the house link worn quietly. */
.m .who a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.m .who a:hover{border-color:var(--ink)}
.m p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;font-size:15px;line-height:1.68;color:#2c2924}
.m .gone{margin:8px 0 0;font-family:var(--font-mono);font-size:11.5px;color:var(--faint)}
.m.mine{border-left:1px solid var(--rule);margin-left:-13px;padding-left:12px}
.m .who .artist{color:var(--ink);letter-spacing:.18em}
/* A tag inside a sentence. It sits in the prose, so it takes the prose's rule
   rather than the small-caps line's: visible at rest, because a name in the
   middle of a paragraph has to be findable without hovering over it. */
.m p a.tag,.m p span.tag{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.m p a.tag:hover{border-color:var(--ink)}
.m p span.tag{border-bottom-color:var(--rule);color:var(--muted)}
/* A link in the prose, and the small markdown the room allows.
   The house treatment for a link is the one a name already has: no colour, a
   hairline at rest, and the ink arriving under the pointer. A URL is set to
   break where it must, because a pasted address is the one thing in a message
   that has no spaces in it and would otherwise push the measure out. */
.m p a.lnk{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.m p a.lnk:hover{border-color:var(--ink)}
.m p strong{font-weight:600}
.m p em{font-style:italic}

/* What a link turns out to be.
   The register's own voice, and the same block the marks on a work page are
   drawn in: a hairline, the domain in mono above, the title in the sans. No
   picture unless it is one of ours ... a preview that hotlinks somebody's
   banner puts it in a log kept forever, and the room is for words anyway. */
.cards{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.card{display:flex;gap:12px;align-items:flex-start;max-width:34em;padding:11px 13px;
  border:1px solid var(--rule);text-decoration:none;transition:border-color .18s ease}
.card:hover,.card:focus-visible{border-color:var(--ink)}
.cthumb{width:44px;height:44px;flex:none;object-fit:cover;background:#f2efe9}
.cbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.cdom{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle{font-family:var(--font-sans);font-weight:500;font-size:13px;line-height:1.42;color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cdesc{font-size:12.5px;line-height:1.5;color:var(--muted);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cnote{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Being spoken to. The hairline, not a colour ... the single green on this
   site is for availability and nothing else, and a room that shouted in colour
   every time somebody said your name would be a room you stopped opening. */
.m.at{border-left:1px solid var(--ink);margin-left:-13px;padding-left:12px}
.m .mod{margin-top:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  display:flex;gap:16px;color:var(--faint)}
.m .mod button{background:none;border:0;padding:0 2px;font-family:var(--font-mono);font-size:13px;line-height:1;
  color:var(--faint);cursor:pointer}
.m .mod button:hover{color:var(--ink)}

/* Who you are in here, and what waited for you. One line under the masthead,
   in the measuring voice, because both halves of it are facts about a wallet.
   It is only ever drawn for somebody signed in ... a room cannot tell a reader
   they were mentioned without knowing who is reading. */
.you{margin-top:16px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.you a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.you a:hover{border-color:var(--ink)}
.you .said{color:var(--ink)}
.you .said::before{content:'\00b7';color:var(--rule);margin-right:10px}

.speak{max-width:720px;margin:0 auto;padding:0 28px 110px}
/* The @ list. It sits under the box it is filling in, in the same measured
   voice as the rest of the furniture, and it is a list of people rather than a
   menu of options ... so each row carries what the register knows about them. */
.at-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--paper);
  border:1px solid var(--rule);max-height:246px;overflow-y:auto;margin-top:-1px}
.at-list button{display:flex;width:100%;gap:12px;align-items:baseline;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 12px;cursor:pointer;
  font-family:var(--font-sans);font-size:14px;color:var(--ink)}
.at-list button:last-child{border-bottom:0}
.at-list button[aria-selected="true"]{background:#f2efe9}
.at-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-list .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.at-none{padding:10px 12px;font-family:var(--font-mono);font-size:11px;color:var(--faint)}
.speak .box{border-top:1px solid var(--rule);padding-top:18px}
/* The list hangs off the box it is filling in, not off the composer: anchored
   to the whole composer it opened below the buttons, half a screen from the
   caret that summoned it. */
.speak .field{position:relative}
.speak textarea{width:100%;min-height:84px;resize:vertical;background:transparent;border:1px solid var(--rule);
  color:var(--ink);padding:11px 12px;font-family:var(--font-sans);font-size:15px;line-height:1.6}
.speak textarea:focus{outline:none;border-color:var(--mark)}
.speak .row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.speak .count{font-variant-numeric:tabular-nums}
.speak .count.over{color:#a33}
.speak .go{background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;padding:8px 15px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.speak .go:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.speak .go:disabled{opacity:.45;cursor:default}
.say{font-family:var(--font-mono);font-size:11px;line-height:1.7;color:var(--muted);margin-top:10px}
.say.bad{color:#a33}
.empty{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:34px 0}

@media(max-width:640px){
  .mast{padding:34px 20px 0}
  .room{padding:18px 20px 30px}
  .speak{padding:0 20px 80px}
  .m .who .at{margin-left:0;width:100%}
}
</style>
</head>
<body>

<header class="bar">
  <a class="wordmark" href="/" aria-label="MintFace"><img src="/assets/MintFace-Logo-Black.png" alt="MintFace" width="1450" height="380"></a>
  <a class="smallcaps" href="/collections">Collections</a>
</header>

<main id="main"><div class="loading">Loading</div></main>

<footer class="foot">
  <a class="smallcaps" href="/notes">Notes</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="https://collectors.mintface.art/">Collectors</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
  <div class="sig">MintFace &middot; 39.64&deg;S 176.85&deg;E</div>
</footer>

<script src="/mintface.js"></script>
<script>
/* Studio.
 *
 * A guestbook that happens to be live. It reads downward like a page rather
 * than upward like a feed, it loads earlier when asked rather than infinitely,
 * and it polls every few seconds because a salon is not a trading floor.
 *
 * Reading takes nothing. The composer only appears once a wallet is connected
 * and Studio has said it may speak, so nobody is invited to sign something
 * that will be refused.
 */
const e = MF.escape;
const ROOM = {
  wallet: null, rows: [], total: 0, start: 0, more: false, me: null,
  max: 500, maxTags: 5, days: 7, busy: false, say: null, draft: '', timer: null, pick: null, asking: false,
  /* The @ list, and where in the box it is filling in. `from` is the index of
     the @ itself, so accepting a name replaces exactly what was typed after it
     and nothing either side. */
  tag: { open: false, from: -1, q: '', rows: [], pick: 0, seq: 0 },
  caret: null, autoSpace: null,
  /* What waited for you, kept for the visit rather than for the request. The
     room marks your mentions read the moment it has drawn them, so the number
     would otherwise vanish out from under the line reporting it. */
  waiting: null, marked: false,
  /* What the links turn out to be, url -> card, or false for a link that has
     nothing to show. Held for the visit: a card is fetched once by the room and
     kept in the store forever, so this is only about not asking twice on one
     page. */
  cards: {},
};

// ours across two deploys, and so opened in this tab like any other page of it
const HOME = ['mintface.art', 'collectors.mintface.art'];

const short = (a) => `${String(a).slice(0, 6)}…${String(a).slice(-4)}`;
const stamp = (s) => {
  const d = new Date(s);
  if (isNaN(d)) return '';
  const day = d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('en-NZ', { hour: '2-digit', minute: '2-digit', hour12: false });
  return `${day} ${time}`;
};

// the same sentence api/_lib/chat.js builds, to the character
const sentence = ({ action, text, target, address, issued, until }) => [
  'MintFace ... Studio',
  '',
  `Action: ${action}`,
  ...(text != null ? [`Message: ${text}`] : []),
  ...(target ? [`Subject: ${target}`] : []),
  `Wallet: ${address}`,
  ...(until ? [`Until: ${until}`] : []),
  `Issued: ${issued}`,
  '',
  ...(action === 'sign in'
    ? ['Signing opens Studio until the date above. It moves nothing and spends nothing.',
      'Until then this browser can speak here without asking again.']
    : ['Signing speaks in Studio. It moves nothing and spends nothing.']),
].join('\n');

/* One signature, then a month of it.
 *
 * A wallet tap per sentence is right for something you do twice a year and
 * wrong for a room: it turns a conversation into a series of approvals, and on
 * a hardware wallet it turns it into a series of walks to the drawer. So the
 * signature moves up a level. You sign that this browser may speak as you until
 * a stated date, and the sentence you approve says exactly that ... the date,
 * not a length in words, so the config can change without the wallet lying.
 *
 * The token means nothing on its own ... the store holds what it stands for,
 * and the server reads the address from there and never from the request. A
 * stolen one buys a week of talking in one room and nothing else, and closing
 * the session or waiting out the week ends it.
 */
const KEEP = 'mintface.room.session';
const held = () => {
  try { return JSON.parse(localStorage.getItem(KEEP) || 'null'); } catch (err) { return null; }
};
const keep = (v) => {
  try { v ? localStorage.setItem(KEEP, JSON.stringify(v)) : localStorage.removeItem(KEEP); }
  catch (err) { /* a browser with storage switched off signs per message, which still works */ }
};
const mySession = () => {
  const v = held();
  if (!v || !v.token || !ROOM.wallet || v.address !== ROOM.wallet) return null;
  if (v.until && Date.parse(v.until) < Date.now()) { keep(null); return null; }
  return v;
};

const api = async (qs) => {
  const q = new URLSearchParams(qs || {});
  if (ROOM.wallet) q.set('viewer', ROOM.wallet);
  const r = await fetch(`/api/chat${q.toString() ? `?${q}` : ''}`, { headers: { accept: 'application/json' } });
  return r.ok ? r.json() : null;
};

async function load() {
  const d = await api();
  if (!d) { ROOM.rows = []; draw(); return; }
  ROOM.rows = d.messages || [];
  ROOM.total = d.total || 0;
  ROOM.start = d.start || 0;
  ROOM.more = Boolean(d.more);
  ROOM.me = d.me || null;
  ROOM.max = d.max_chars || 500;
  ROOM.maxTags = d.max_tags || 5;
  ROOM.days = d.session_days || 7;
  ROOM.open = d.store !== false;
  /* Held once. A reload is a new visit and asks the question again; a redraw
     inside this one keeps the answer it was given. */
  if (ROOM.waiting === null && ROOM.me && ROOM.me.mentions) ROOM.waiting = ROOM.me.mentions.unseen || 0;
  draw();
  markSeen();
  askCards();
}

/* Read. Sent once the count has been drawn, so the visit that showed it is the
   visit that clears it. It needs a sign-in and nothing else. */
async function markSeen() {
  if (ROOM.marked || !ROOM.me || !mySession()) return;
  ROOM.marked = true;
  const s = mySession();
  try { await post({ action: 'seen', token: s.token }); } catch (err) { /* it will be marked next visit */ }
}

async function earlier() {
  if (!ROOM.more || ROOM.busy) return;
  ROOM.busy = true;
  const d = await api({ before: String(ROOM.start) });
  ROOM.busy = false;
  if (!d) return;
  ROOM.rows = (d.messages || []).concat(ROOM.rows);
  ROOM.start = d.start || 0;
  ROOM.more = Boolean(d.more);
  draw({ keep: true });
  askCards();
}

/* Polling, not sockets. A quiet room costs one small answer every few seconds,
   which is the right price for a room where somebody speaks twice a day. */
async function poll() {
  // never under an open @ list, or under somebody's hands: a redraw would take
  // the list, the caret and the half-written sentence with it
  if (ROOM.busy || document.hidden || ROOM.tag.open) return;
  const d = await api({ since: String(ROOM.total) });
  if (!d || !d.messages || !d.messages.length) return;
  ROOM.rows = ROOM.rows.concat(d.messages);
  ROOM.total = d.total || ROOM.total + d.messages.length;
  draw({ toEnd: true });
  askCards();
}

/* The sentence, as the room draws it now.
 *
 * The splicing used to happen here: the server sent the text as it was typed
 * and the tags as ranges over it, and the page cut one into the other. It is
 * done on the server now, because there is more to do than tags ... links, and
 * the little markdown the room allows ... and a log that is public and kept
 * forever is not a place to keep two escapers and hope they agree. There is one
 * renderer, in api/_lib/text.js, and it is the one the acceptance cases run.
 *
 * What arrives is markup that file wrote, character by character, around text
 * it escaped first. Nothing a collector types ever reaches the page as markup.
 * The escaped text stands in where an older payload has no html on it. */
function words(m) {
  if (m.text == null) return '<p class="gone">Taken down.</p>';
  return `<p>${m.html == null ? e(m.text) : m.html}</p>`;
}

/* What a link turns out to be, drawn under the message that carried it.
   Only the ones the room has an answer for: a fetch that failed, or a site with
   nothing to say about itself, leaves the bare link and says nothing about it. */
function cardsFor(links) {
  return (links || []).map((u) => ROOM.cards[u])
    .filter((c) => c && typeof c === 'object')
    .map((c) => {
      const away = !HOME.includes(c.domain);
      const thumb = c.thumb ? `<img class="cthumb" src="${e(c.thumb)}" alt="" loading="lazy" decoding="async">` : '';
      const under = c.description ? `<span class="cdesc">${e(c.description)}</span>`
        : (c.note ? `<span class="cnote">${e(c.note)}</span>` : '');
      return `<a class="card" href="${e(c.url)}"${away ? ' target="_blank" rel="nofollow ugc noopener noreferrer"' : ''}>`
        + `${thumb}<span class="cbody"><span class="cdom">${e(c.domain)}</span>`
        + `<span class="ctitle">${e(c.title)}</span>${under}</span></a>`;
    }).join('');
}

/* Asked for after the page is on screen, and painted into the messages that
   were waiting for them. Not through draw(): a card arriving is no reason to
   rebuild the composer under somebody's half-written sentence. */
async function askCards() {
  const want = ROOM.rows.filter((m) => !m.deleted && (m.links || []).length
    && m.links.some((u) => ROOM.cards[u] === undefined)).map((m) => m.n);
  if (!want.length) return;
  const d = await api({ cards: want.slice(-60).join(',') }).catch(() => null);
  if (!d || !d.cards) return;
  Object.assign(ROOM.cards, d.cards);
  for (const m of ROOM.rows) {
    const box = document.getElementById(`cards-${m.n}`);
    if (box) box.innerHTML = cardsFor(m.links);
  }
}

const namesMe = (m) => Boolean(ROOM.wallet && (m.mentions || []).some((t) => t.address === ROOM.wallet));

function card(m) {
  const mine = ROOM.wallet && m.address === ROOM.wallet;
  /* The artist is named and unnumbered. A TAO figure beside him would read as
     nought, which says the opposite of the truth ... the wallets are excluded
     from accrual because he is the one being patronised, not the patron. */
  const isArtist = m.role === 'artist';
  /* One character each. The artist is the only person who ever sees these and
     he knows what they are; spelling them out put moderation furniture under
     every message in Studio. */
  const mod = ROOM.me && ROOM.me.artist ? `<div class="mod">
      <button data-act="${m.deleted ? 'restore' : 'delete'}" data-n="${m.n}"
        title="${m.deleted ? 'Put this message back' : 'Take this message down'}"
        aria-label="${m.deleted ? 'Restore this message' : 'Delete this message'}">${m.deleted ? '&#8635;' : '&times;'}</button>
      <button data-act="mute" data-who="${e(m.address)}"
        title="Mute this wallet" aria-label="Mute this wallet">&minus;</button>
    </div>` : '';
  /* The name goes where the person is. A collector to their page on the
     register, the artist to the front door ... it is one register across two
     deploys, so it opens in this tab like any other page of it. Anybody with
     no page renders as they always did, unlinked. */
  const label = e(isArtist ? 'MintFace' : (m.name || short(m.address)));
  const who = m.url ? `<a href="${e(m.url)}">${label}</a>` : label;
  /* The place the cards go, drawn empty and filled a moment later. Reserved
     here rather than inserted later so a redraw keeps whatever has arrived. */
  const links = m.deleted ? [] : (m.links || []);
  const cards = links.length ? `<div class="cards" id="cards-${m.n}">${cardsFor(links)}</div>` : '';
  return `<article class="m${mine ? ' mine' : ''}${namesMe(m) ? ' at' : ''}${isArtist ? ' by-artist' : ''}">
    <div class="who">
      <span${isArtist ? ' class="artist"' : ''}>${who}</span>
      ${isArtist ? '<span class="tao">&middot; the artist</span>' : `<span class="tao">&middot; ${e(m.worn)} TAO</span>`}
      <span class="at">${e(stamp(m.at))}</span>
    </div>
    ${words(m)}
    ${cards}
    ${mod}
  </article>`;
}

function composer() {
  const me = ROOM.me;
  if (!ROOM.open) return '';
  if (ROOM.pick) {
    return `<div class="box"><div class="row" style="justify-content:flex-start;flex-wrap:wrap">
      ${ROOM.pick.map((w) => `<button class="go" data-act="pick" data-uuid="${e(w.uuid)}">${e(w.name)}</button>`).join('')}
    </div></div>`;
  }
  /* Three states out of the payload, and every one of them an affordance.
     The middle one used to be a dead end: a wallet connected, `me` absent
     because the request that would have fetched it never completed, and a
     sentence with nothing to press. */
  if (!ROOM.wallet) {
    return `<div class="box"><div class="row" style="justify-content:flex-start;gap:20px">
      <button class="go" data-act="connect">${ROOM.asking ? 'Asking your wallet ...' : 'Connect a wallet to speak'}</button>
      <button class="go" data-act="which" style="border-color:transparent">Nothing happening?</button>
    </div></div>`;
  }
  if (!me) {
    // connected, and Studio could not say who this is. Always a way back.
    return `<div class="box">
      <div class="say bad">Connected as ${e(short(ROOM.wallet))}, but Studio could not read this wallet's standing. It may be a moment's trouble reaching the register.</div>
      <div class="row" style="justify-content:flex-start;gap:20px">
        <button class="go" data-act="again">Try again</button>
        <button class="go" data-act="which" style="border-color:transparent">Nothing happening?</button>
      </div></div>`;
  }
  if (!me.can_speak) {
    return `<div class="box">
      <div class="say">${e(me.why || 'This wallet cannot speak in Studio.')}</div>
      <div class="row" style="justify-content:flex-start;gap:20px">
        <button class="go" data-act="again">Check again</button>
      </div></div>`;
  }
  if (!mySession()) {
    return `<div class="box">
      <div class="say">Connected as ${e(me.name || short(ROOM.wallet))}${me.role === 'artist' ? ', the artist' : ''}. One signature opens Studio for ${ROOM.days} days.</div>
      <div class="row" style="justify-content:flex-start;gap:20px">
        <button class="go" data-act="signin">Sign in for ${ROOM.days} days</button>
      </div></div>`;
  }
  const len = ROOM.draft.length;
  return `<div class="box">
    <div class="field">
      <textarea id="text" placeholder="Say something. Type @ to name somebody." spellcheck="true"
        aria-autocomplete="list" aria-expanded="${ROOM.tag.open}" aria-controls="atList"
        maxlength="${ROOM.max + 40}">${e(ROOM.draft)}</textarea>
      ${tagList()}
    </div>
    <div class="row">
      <span>${e(me.name || short(ROOM.wallet))}${me.role === 'artist' ? ' &middot; the artist' : ` &middot; ${e(Number(me.tao || 0).toLocaleString('en-NZ'))} TAO`}</span>
      <span class="count${len > ROOM.max ? ' over' : ''}" id="count">${len}/${ROOM.max}</span>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="go" data-act="signout" style="border-color:transparent">Sign out</button>
      <button class="go" id="go" data-act="say"${ROOM.busy || !(len && len <= ROOM.max) ? ' disabled' : ''}>${ROOM.busy ? 'Sending' : 'Say it'}</button>
    </div>
  </div>`;
}

/* You, in the room's own header.
 *
 * Your name where everybody else's is, linked to the same page theirs are, and
 * beside it what was waiting. No email and no push: the room tells you inside
 * the room, which is the only place the telling belongs. Nothing is drawn for
 * a reader who has not said who they are ... there is nobody to have mentioned.
 */
function youLine() {
  const me = ROOM.me;
  if (!me || !ROOM.wallet) return '';
  const label = e(me.name || short(ROOM.wallet));
  const who = me.url ? `<a href="${e(me.url)}">${label}</a>` : label;
  const n = ROOM.waiting || 0;
  /* A first visit counts everything, because none of it has been read ... but
     there is no last visit to say "since" about, so the line does not claim
     there was one. */
  const first = Boolean(me.mentions && me.mentions.first_visit);
  const said = n
    ? `<span class="said">${n} mention${n === 1 ? '' : 's'}${first ? '' : ' since your last visit'}</span>`
    : '';
  return `<div class="you">${who}${said}</div>`;
}

/* Naming somebody.
 *
 * An @ opens the register, not a contact list: everybody who holds a MintFace
 * work is in it, whether or not they have ever been in this room. The rows
 * carry a name and what stands behind it ... the ENS the chain answers with,
 * or the address ... because two collectors can read alike and the wallet is
 * the thing that cannot.
 *
 * What is stored is the wallet. This list is only how a person finds it.
 */
function tagList() {
  const t = ROOM.tag;
  if (!t.open) return '';
  if (!t.rows.length) {
    return `<div class="at-list" id="atList" role="listbox">
      <div class="at-none">${t.q ? 'Nobody on the register reads like that.' : 'Keep typing a name.'}</div>
    </div>`;
  }
  return `<div class="at-list" id="atList" role="listbox">${t.rows.map((c, i) => {
    // what a name rests on, said once: the ENS where there is one, the wallet where there is not
    const under = c.ens && c.ens !== c.name ? c.ens : short(c.address);
    return `<button type="button" role="option" data-act="attag" data-i="${i}"
      aria-selected="${i === t.pick}"><span class="nm">${e(c.name)}</span><span class="sub">${e(under)}</span></button>`;
  }).join('')}</div>`;
}

const shutTag = () => { ROOM.tag = { ...ROOM.tag, open: false, from: -1, q: '', rows: [], pick: 0 }; };

/* The @ under the caret, or nothing.
 *
 * It walks back from the caret to an @ that begins a word, and gives up at a
 * space too many or a line break: a name is thirty-two characters and at most
 * a few words, and everything past that is prose that happens to contain an
 * email address. */
function tagUnderCaret(text, caret) {
  const upto = text.slice(0, caret);
  const at = upto.lastIndexOf('@');
  if (at < 0) return null;
  if (at > 0 && !/[\s([{<"']/.test(upto[at - 1])) return null;
  const q = upto.slice(at + 1);
  if (q.includes('\n') || q.length > 40 || q.split(' ').length > 4) return null;
  return { from: at, q };
}

/* Asked of the register, and only ever answered into the box it was asked from.
   A sequence number rather than a debounce alone: two keystrokes in flight can
   land out of order, and the older answer overwriting the newer one is how a
   list ends up showing the results for half a word. */
async function askTags(q, from) {
  const seq = ++ROOM.tag.seq;
  let rows = [];
  try {
    const r = await fetch(`/api/names?q=${encodeURIComponent(q)}&limit=8`,
      { headers: { accept: 'application/json' } });
    rows = r.ok ? ((await r.json()).collectors || []) : [];
  } catch (err) { rows = []; }
  if (seq !== ROOM.tag.seq) return;
  ROOM.tag = { ...ROOM.tag, open: true, from, q, rows, pick: 0 };
  paintTags();
}

// the list redraws on its own, because redrawing the composer would take the
// caret and the half-written sentence with it
function paintTags() {
  const field = document.querySelector('.speak .field');
  if (!field) return;
  const old = document.getElementById('atList');
  const html = tagList();
  if (old) old.outerHTML = html || '';
  else if (html) document.getElementById('text').insertAdjacentHTML('afterend', html);
  const t = document.getElementById('text');
  if (t) t.setAttribute('aria-expanded', String(ROOM.tag.open));
}

/* Accepting a name writes the name, and the name alone. The wallet behind it
   is worked out again on the server when the message is said, from these very
   characters ... so there is one answer to who was tagged rather than the
   page's answer and the register's. */
function takeTag(i) {
  const t = ROOM.tag;
  const c = t.rows[i == null ? t.pick : i];
  const box = document.getElementById('text');
  if (!c || !box || t.from < 0) return;
  const caret = box.selectionStart;
  const before = box.value.slice(0, t.from);
  const after = box.value.slice(caret);
  const written = `@${c.name}`;
  const spaced = !after.startsWith(' ');
  box.value = `${before}${written}${spaced ? ' ' : ''}${after}`;
  ROOM.draft = box.value;
  const pos = before.length + written.length + 1;
  box.setSelectionRange(pos, pos);
  ROOM.caret = pos;
  /* The space is right nine times in ten and wrong the tenth, which is when the
     next thing typed is a question mark. So it is offered rather than imposed:
     where it sits is remembered, and the next keystroke may take it back. */
  ROOM.autoSpace = spaced ? pos - 1 : null;
  shutTag();
  paintTags();
  countUp();
  box.focus();
}

function countUp() {
  const c = document.getElementById('count');
  if (c) { c.textContent = `${ROOM.draft.length}/${ROOM.max}`; c.classList.toggle('over', ROOM.draft.length > ROOM.max); }
  const go = document.getElementById('go');
  if (go) go.disabled = !ROOM.draft.trim() || ROOM.draft.length > ROOM.max;
}

/* The status line is written straight into the DOM rather than through draw(),
   because the thing it most needs to report ... a signature request sitting in
   a wallet ... happens while somebody's half-written message is in the box, and
   re-rendering the box under them to say so would be a poor trade. */
function status(text, bad) {
  ROOM.say = text ? { text, bad: Boolean(bad) } : null;
  const el = document.getElementById('say');
  if (!el) { draw(); return; }
  el.textContent = text || '';
  el.classList.toggle('bad', Boolean(bad));
  el.hidden = !text;
}

function draw({ keep = false, toEnd = false } = {}) {
  const before = keep ? document.documentElement.scrollHeight : 0;
  const say = `<div class="say${ROOM.say && ROOM.say.bad ? ' bad' : ''}" id="say"${ROOM.say ? '' : ' hidden'}>${e(ROOM.say ? ROOM.say.text : '')}</div>`;

  document.getElementById('main').innerHTML = `
    <section class="mast">
      <h1>Studio</h1>
      <div class="sub">chillin' in the studio talking art with each other. TAO gets you in. All can read. Own 1x MintFace artwork, chat in Studio.</div>
      ${youLine()}
    </section>
    <section class="room" id="log">
      ${ROOM.more ? '<button class="earlier" data-act="earlier">Read earlier</button>' : ''}
      ${ROOM.rows.length ? ROOM.rows.map(card).join('') : '<div class="empty">Nobody has said anything yet.</div>'}
    </section>
    <section class="speak">${composer()}${say}</section>`;

  if (keep) window.scrollBy(0, document.documentElement.scrollHeight - before);
  if (toEnd) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  const t = document.getElementById('text');
  /* A redraw rebuilds the box, and rebuilding the box puts the caret at the
     start of somebody's half-written sentence. Where it was is remembered and
     put back; where it was never noted, the end is the right guess. */
  if (t && ROOM.focus) {
    t.focus();
    const at = ROOM.caret == null ? t.value.length : Math.min(ROOM.caret, t.value.length);
    t.setSelectionRange(at, at);
  }
}

/* Connecting connects, and nothing else. No signature is asked for here, and
   none should be: there is no session to open, so there is nothing to sign
   until there are words to sign. That is worth saying out loud on the page,
   because a wallet that connects and then goes quiet reads as a failure. */
async function connect(choice) {
  /* Connecting never asks for a signature ... there is no session here, so
     there is nothing to sign until there are words. But it does put a request
     in the wallet, and that request can sit unanswered behind a window exactly
     the way a signature can, so it gets the same treatment. */
  ROOM.asking = true;
  status('Asking your wallet for an account ... check your wallet.');
  draw();
  const slow = setTimeout(() => status('Still waiting on the wallet. Its prompt may have opened behind this window.'), 8000);
  try {
    ROOM.wallet = await MF.connect(choice);
    ROOM.pick = null;
  } catch (err) {
    ROOM.asking = false;
    clearTimeout(slow);
    /* Two wallets answering, neither already authorised here. The page cannot
       guess which one this person means, and guessing wrong sends the request
       somewhere it will never be answered ... which is the failure that looks
       like nothing happening at all. So it asks. */
    if (err.code === 'many-providers') {
      ROOM.pick = err.wallets;
      status('More than one wallet is answering. Which one?', false);
      draw();
      return false;
    }
    status(String(err.message || err), true);
    // no wallet answering at all is worth saying precisely, because the reason
    // is nearly always outside the page
    if (err.code === 'no-provider') await sayWhatWeSee();
    draw();
    return false;
  }
  clearTimeout(slow);
  ROOM.asking = false;
  ROOM.focus = true;
  await load();
  status(ROOM.me && ROOM.me.can_speak
    ? 'Connected. Your wallet is asked to sign once, when you say something.'
    : null);
  return true;
}

/* What this browser looks like from inside the page, in one line somebody can
   read back over a message. Every wallet problem that is not the page is
   visible here: nothing installed, an extension switched off for this site,
   two extensions fighting over one slot, or a page served insecurely. */
async function sayWhatWeSee() {
  let r;
  try { r = await MF.walletReport(); } catch (err) { status(`Could not look: ${err.message}`, true); return; }
  const bits = [];
  bits.push(r.announced.length ? `Wallets answering: ${r.announced.join(', ')}` : 'No wallet announced itself');
  bits.push(r.injected ? `window.ethereum: ${r.injectedName}${r.stacked ? `, with ${r.stacked} stacked behind it` : ''}` : 'window.ethereum: absent');
  if (!r.secure) bits.push('This page is not on a secure origin, which stops extensions injecting');
  if (!r.count) bits.push('Nothing to connect to. Check the extension is enabled for mintface.art, then reload.');
  status(bits.join(' · '), !r.count);
}

const askWallet = (message) => MF.sign(message, ROOM.wallet, (state, why) => {
  if (state === 'requested') status('Signature requested ... check your wallet.');
  if (state === 'slow') status('Still waiting on the wallet. A hardware wallet may need waking, or its prompt may have opened behind this window.');
  if (state === 'signed') status('Signed.');
  if (state === 'failed') status(why, true);
});

const post = async (body) => {
  const r = await fetch('/api/chat', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'that did not go through'); e.expired = Boolean(j.expired); throw e; }
  return j;
};

/** The one signature. */
async function signIn() {
  const issued = new Date().toISOString();
  const days = ROOM.days || 7;
  const until = new Date(Date.parse(issued) + days * 86400000).toISOString();
  const signature = await askWallet(sentence({ action: 'sign in', address: ROOM.wallet, issued, until }));
  const j = await post({ action: 'sign in', address: ROOM.wallet, issued, until, signature });
  keep({ address: ROOM.wallet, token: j.token, until: j.until });
  status(`Signed in until ${new Date(j.until).toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' })}. No more wallet prompts here until then.`);
  return j;
}

async function send(payload) {
  const s = mySession();
  if (s) {
    try {
      return await post({ ...payload, token: s.token });
    } catch (err) {
      if (!err.expired) throw err;
      keep(null);                                  // the week is up; ask for another
      status('That sign-in has run out.', true);
      draw();
      throw err;
    }
  }
  const issued = new Date().toISOString();
  const signature = await askWallet(sentence({ ...payload, address: ROOM.wallet, issued }));
  return post({ ...payload, address: ROOM.wallet, issued, signature });
}

let tagTimer = null;
document.addEventListener('input', (ev) => {
  if (!ev.target.matches('#text')) return;
  ROOM.draft = ev.target.value;
  ROOM.caret = ev.target.selectionStart;
  countUp();

  /* Is there an @ under the caret? Asked on every keystroke and answered off
     the register a beat later, because a register of three and a half thousand
     is a question for the server and a question worth not asking four times a
     word. */
  const found = tagUnderCaret(ROOM.draft, ROOM.caret);
  clearTimeout(tagTimer);
  if (!found) {
    if (ROOM.tag.open) { shutTag(); paintTags(); }
    return;
  }
  if (!ROOM.tag.open) { ROOM.tag = { ...ROOM.tag, open: true, from: found.from, q: found.q, rows: [], pick: 0 }; paintTags(); }
  tagTimer = setTimeout(() => askTags(found.q, found.from), 120);
});

/* The list is keyboard first. A name is chosen with the keys already on the
   name ... up, down, enter ... and escape leaves the @ where it was typed
   rather than undoing it, because a person who means to write an email address
   should not have the page argue with them about it. */
/* Taking the space back.
 *
 * Accepting a name writes a space after it, because the next thing somebody
 * types is nearly always another word. When it is a question mark instead, the
 * space is a typographic error the page committed on their behalf ... "@Ariki
 * of Ahuriri ? It is the best of them" ... and they would have to notice it and
 * reach back for it. So the one keystroke that follows may undo it, and any
 * other keystroke ends the offer. */
document.addEventListener('keydown', (ev) => {
  if (!ev.target.matches('#text')) return;
  if (ROOM.autoSpace != null) {
    const at = ROOM.autoSpace;
    ROOM.autoSpace = null;
    if (ev.key.length === 1 && /[?!,.;:)\]}]/.test(ev.key)
      && ev.target.selectionStart === at + 1 && ev.target.selectionEnd === at + 1
      && ev.target.value[at] === ' ') {
      const v = ev.target.value;
      ev.target.value = v.slice(0, at) + v.slice(at + 1);
      ev.target.setSelectionRange(at, at);
      ROOM.draft = ev.target.value;
      ROOM.caret = at;
    }
  }
  if (!ROOM.tag.open) return;
  const rows = ROOM.tag.rows;
  if (ev.key === 'Escape') { ev.preventDefault(); shutTag(); paintTags(); return; }
  if (!rows.length) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const step = ev.key === 'ArrowDown' ? 1 : -1;
    ROOM.tag.pick = (ROOM.tag.pick + step + rows.length) % rows.length;
    paintTags();
    return;
  }
  if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); takeTag(); }
});

// clicking anywhere that is not the list closes it, the way a menu closes
document.addEventListener('click', (ev) => {
  if (!ROOM.tag.open) return;
  if (ev.target.closest('#atList') || ev.target.matches('#text')) return;
  shutTag();
  paintTags();
});

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b || ROOM.busy) return;
  const act = b.dataset.act;

  if (act === 'attag') return takeTag(Number(b.dataset.i));
  if (act === 'earlier') return earlier();
  if (act === 'connect') return void connect();
  if (act === 'pick') return void connect(b.dataset.uuid);
  if (act === 'which') return void sayWhatWeSee();
  if (act === 'again') return void (await load(), status(null));
  if (act === 'signout') {
    const s0 = mySession();
    keep(null);
    if (s0) post({ action: 'sign out', token: s0.token }).catch(() => {});
    status('Signed out.');
    draw();
    return;
  }

  /* Busy, and then not busy.
   *
   * Two things went wrong here and both were invisible until somebody watched
   * the screen. The button was relabelled 'Sign and say' whatever it had been
   * ... so muting a wallet renamed the mute button ... and, worse, an action
   * that redraws the composer under itself left the room drawn while it was
   * still busy: signing in rendered the send button from `ROOM.busy === true`
   * and it read 'Sending' from then until somebody else spoke.
   *
   * So the label is put back rather than invented, and where the button this
   * ran from is no longer on the page, the room is drawn again now that it is
   * idle. Nothing else knows to do it: the redraw happened inside the work. */
  const run = async (fn) => {
    ROOM.busy = true;
    b.disabled = true;
    const was = b.textContent;
    if (b.dataset.act === 'say') b.textContent = 'Sending';
    try {
      await fn();
    } catch (err) {
      /* MF.sign has already put its own reason on the line, and it is a better
         one than the rethrow carries. Anything else that fails ... the network,
         Studio refusing the message ... says so here. */
      status(String((err && err.message) || err), true);
    } finally {
      ROOM.busy = false;
      if (document.body.contains(b)) { b.disabled = false; b.textContent = was; }
      else draw();
    }
  };

  if (act === 'signin') {
    // signing in is when the room first knows who you are, so it is the first
    // moment it can say what was waiting for you
    return run(async () => { await signIn(); ROOM.waiting = null; ROOM.marked = false; await load(); });
  }

  if (act === 'say') {
    const text = (document.getElementById('text') || {}).value || '';
    return run(async () => {
      await send({ action: 'say', text });
      ROOM.draft = '';
      ROOM.caret = null;
      shutTag();
      ROOM.focus = true;
      await load();
      status(null);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });
  }

  if (act === 'delete' || act === 'restore') {
    return run(async () => {
      await send({ action: act, target: String(b.dataset.n) });
      await load();
      status(null);
    });
  }

  if (act === 'mute') {
    const who = b.dataset.who;
    if (!window.confirm(`Mute ${who}? They can still read, and nothing in Studio will say so.`)) return;
    return run(async () => {
      await send({ action: 'mute', target: who });
      await load();
      status(`${who} is muted.`);
    });
  }
});

load().then(() => {
  ROOM.timer = setInterval(poll, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
});
</script>
</body>
</html>
