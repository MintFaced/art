<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio ... MintFace</title>
<meta name="description" content="chillin' in the studio talking art with each other. TAO gets you in. All can read. Own 1x MintFace artwork, chat in Studio.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MintFace">
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mintface.css">
<style>
.mast{max-width:720px;margin:0 auto;padding:60px 28px 0}
h1{font-family:var(--font-sans);font-weight:400;font-size:clamp(40px,8vw,84px);line-height:.96;margin:0;letter-spacing:-.035em}
.sub{font-size:13px;color:var(--muted);margin-top:20px;max-width:44em;line-height:1.7}
.room{max-width:720px;margin:0 auto;padding:24px 28px 40px}

.earlier{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);background:none;border:0;padding:14px 0;cursor:pointer;display:block;width:100%;text-align:left;
  border-bottom:1px solid var(--rule)}
.earlier:hover{color:var(--ink)}

.m{padding:16px 0;border-bottom:1px solid var(--rule)}
.m:last-child{border-bottom:0}
.m .who{font-family:var(--font-mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.m .who .tao{color:var(--faint);font-variant-numeric:tabular-nums}
.m .who .at{color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.m p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;font-size:15px;line-height:1.68;color:#2c2924}
.m .gone{margin:8px 0 0;font-family:var(--font-mono);font-size:11.5px;color:var(--faint)}
.m.mine{border-left:1px solid var(--rule);margin-left:-13px;padding-left:12px}
.m .who .artist{color:var(--ink);letter-spacing:.18em}
.m .mod{margin-top:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  display:flex;gap:16px;color:var(--faint)}
.m .mod button{background:none;border:0;padding:0 2px;font-family:var(--font-mono);font-size:13px;line-height:1;
  color:var(--faint);cursor:pointer}
.m .mod button:hover{color:var(--ink)}

.speak{max-width:720px;margin:0 auto;padding:0 28px 110px}
.speak .box{border-top:1px solid var(--rule);padding-top:18px}
.speak textarea{width:100%;min-height:84px;resize:vertical;background:transparent;border:1px solid var(--rule);
  color:var(--ink);padding:11px 12px;font-family:var(--font-sans);font-size:15px;line-height:1.6}
.speak textarea:focus{outline:none;border-color:var(--mark)}
.speak .row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.speak .count{font-variant-numeric:tabular-nums}
.speak .count.over{color:#a33}
.speak .go{background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;padding:8px 15px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.speak .go:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.speak .go:disabled{opacity:.45;cursor:default}
.say{font-family:var(--font-mono);font-size:11px;line-height:1.7;color:var(--muted);margin-top:10px}
.say.bad{color:#a33}
.empty{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:34px 0}

@media(max-width:640px){
  .mast{padding:34px 20px 0}
  .room{padding:18px 20px 30px}
  .speak{padding:0 20px 80px}
  .m .who .at{margin-left:0;width:100%}
}
</style>
</head>
<body>

<header class="bar">
  <a class="wordmark" href="/" aria-label="MintFace"><img src="/assets/MintFace-Logo-Black.png" alt="MintFace" width="1450" height="380"></a>
  <a class="smallcaps" href="/collections">Collections</a>
</header>

<main id="main"><div class="loading">Loading</div></main>

<footer class="foot">
  <a class="smallcaps" href="/notes">Notes</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="https://collectors.mintface.art/">Collectors</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
  <div class="sig">MintFace &middot; 39.64&deg;S 176.85&deg;E</div>
</footer>

<script src="/mintface.js"></script>
<script>
/* Studio.
 *
 * A guestbook that happens to be live. It reads downward like a page rather
 * than upward like a feed, it loads earlier when asked rather than infinitely,
 * and it polls every few seconds because a salon is not a trading floor.
 *
 * Reading takes nothing. The composer only appears once a wallet is connected
 * and Studio has said it may speak, so nobody is invited to sign something
 * that will be refused.
 */
const e = MF.escape;
const ROOM = {
  wallet: null, rows: [], total: 0, start: 0, more: false, me: null,
  max: 500, days: 7, busy: false, say: null, draft: '', timer: null, pick: null, asking: false,
};

const short = (a) => `${String(a).slice(0, 6)}…${String(a).slice(-4)}`;
const stamp = (s) => {
  const d = new Date(s);
  if (isNaN(d)) return '';
  const day = d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('en-NZ', { hour: '2-digit', minute: '2-digit', hour12: false });
  return `${day} ${time}`;
};

// the same sentence api/_lib/chat.js builds, to the character
const sentence = ({ action, text, target, address, issued, until }) => [
  'MintFace ... Studio',
  '',
  `Action: ${action}`,
  ...(text != null ? [`Message: ${text}`] : []),
  ...(target ? [`Subject: ${target}`] : []),
  `Wallet: ${address}`,
  ...(until ? [`Until: ${until}`] : []),
  `Issued: ${issued}`,
  '',
  ...(action === 'sign in'
    ? ['Signing opens Studio until the date above. It moves nothing and spends nothing.',
      'Until then this browser can speak here without asking again.']
    : ['Signing speaks in Studio. It moves nothing and spends nothing.']),
].join('\n');

/* One signature, then a month of it.
 *
 * A wallet tap per sentence is right for something you do twice a year and
 * wrong for a room: it turns a conversation into a series of approvals, and on
 * a hardware wallet it turns it into a series of walks to the drawer. So the
 * signature moves up a level. You sign that this browser may speak as you until
 * a stated date, and the sentence you approve says exactly that ... the date,
 * not a length in words, so the config can change without the wallet lying.
 *
 * The token means nothing on its own ... the store holds what it stands for,
 * and the server reads the address from there and never from the request. A
 * stolen one buys a week of talking in one room and nothing else, and closing
 * the session or waiting out the week ends it.
 */
const KEEP = 'mintface.room.session';
const held = () => {
  try { return JSON.parse(localStorage.getItem(KEEP) || 'null'); } catch (err) { return null; }
};
const keep = (v) => {
  try { v ? localStorage.setItem(KEEP, JSON.stringify(v)) : localStorage.removeItem(KEEP); }
  catch (err) { /* a browser with storage switched off signs per message, which still works */ }
};
const mySession = () => {
  const v = held();
  if (!v || !v.token || !ROOM.wallet || v.address !== ROOM.wallet) return null;
  if (v.until && Date.parse(v.until) < Date.now()) { keep(null); return null; }
  return v;
};

const api = async (qs) => {
  const q = new URLSearchParams(qs || {});
  if (ROOM.wallet) q.set('viewer', ROOM.wallet);
  const r = await fetch(`/api/chat${q.toString() ? `?${q}` : ''}`, { headers: { accept: 'application/json' } });
  return r.ok ? r.json() : null;
};

async function load() {
  const d = await api();
  if (!d) { ROOM.rows = []; draw(); return; }
  ROOM.rows = d.messages || [];
  ROOM.total = d.total || 0;
  ROOM.start = d.start || 0;
  ROOM.more = Boolean(d.more);
  ROOM.me = d.me || null;
  ROOM.max = d.max_chars || 500;
  ROOM.days = d.session_days || 7;
  ROOM.open = d.store !== false;
  draw();
}

async function earlier() {
  if (!ROOM.more || ROOM.busy) return;
  ROOM.busy = true;
  const d = await api({ before: String(ROOM.start) });
  ROOM.busy = false;
  if (!d) return;
  ROOM.rows = (d.messages || []).concat(ROOM.rows);
  ROOM.start = d.start || 0;
  ROOM.more = Boolean(d.more);
  draw({ keep: true });
}

/* Polling, not sockets. A quiet room costs one small answer every few seconds,
   which is the right price for a room where somebody speaks twice a day. */
async function poll() {
  if (ROOM.busy || document.hidden) return;
  const d = await api({ since: String(ROOM.total) });
  if (!d || !d.messages || !d.messages.length) return;
  ROOM.rows = ROOM.rows.concat(d.messages);
  ROOM.total = d.total || ROOM.total + d.messages.length;
  draw({ toEnd: true });
}

function card(m) {
  const mine = ROOM.wallet && m.address === ROOM.wallet;
  /* The artist is named and unnumbered. A TAO figure beside him would read as
     nought, which says the opposite of the truth ... the wallets are excluded
     from accrual because he is the one being patronised, not the patron. */
  const isArtist = m.role === 'artist';
  /* One character each. The artist is the only person who ever sees these and
     he knows what they are; spelling them out put moderation furniture under
     every message in Studio. */
  const mod = ROOM.me && ROOM.me.artist ? `<div class="mod">
      <button data-act="${m.deleted ? 'restore' : 'delete'}" data-n="${m.n}"
        title="${m.deleted ? 'Put this message back' : 'Take this message down'}"
        aria-label="${m.deleted ? 'Restore this message' : 'Delete this message'}">${m.deleted ? '&#8635;' : '&times;'}</button>
      <button data-act="mute" data-who="${e(m.address)}"
        title="Mute this wallet" aria-label="Mute this wallet">&minus;</button>
    </div>` : '';
  const words = m.text == null
    ? '<p class="gone">Taken down.</p>'
    : `<p>${e(m.text)}${m.deleted ? '' : ''}</p>`;
  return `<article class="m${mine ? ' mine' : ''}${isArtist ? ' by-artist' : ''}">
    <div class="who">
      <span${isArtist ? ' class="artist"' : ''}>${e(isArtist ? 'MintFace' : (m.name || short(m.address)))}</span>
      ${isArtist ? '<span class="tao">&middot; the artist</span>' : `<span class="tao">&middot; ${e(m.worn)} TAO</span>`}
      <span class="at">${e(stamp(m.at))}</span>
    </div>
    ${words}
    ${mod}
  </article>`;
}

function composer() {
  const me = ROOM.me;
  if (!ROOM.open) return '';
  if (ROOM.pick) {
    return `<div class="box"><div class="row" style="justify-content:flex-start;flex-wrap:wrap">
      ${ROOM.pick.map((w) => `<button class="go" data-act="pick" data-uuid="${e(w.uuid)}">${e(w.name)}</button>`).join('')}
    </div></div>`;
  }
  /* Three states out of the payload, and every one of them an affordance.
     The middle one used to be a dead end: a wallet connected, `me` absent
     because the request that would have fetched it never completed, and a
     sentence with nothing to press. */
  if (!ROOM.wallet) {
    return `<div class="box"><div class="row" style="justify-content:flex-start;gap:20px">
      <button class="go" data-act="connect">${ROOM.asking ? 'Asking your wallet ...' : 'Connect a wallet to speak'}</button>
      <button class="go" data-act="which" style="border-color:transparent">Nothing happening?</button>
    </div></div>`;
  }
  if (!me) {
    // connected, and Studio could not say who this is. Always a way back.
    return `<div class="box">
      <div class="say bad">Connected as ${e(short(ROOM.wallet))}, but Studio could not read this wallet's standing. It may be a moment's trouble reaching the register.</div>
      <div class="row" style="justify-content:flex-start;gap:20px">
        <button class="go" data-act="again">Try again</button>
        <button class="go" data-act="which" style="border-color:transparent">Nothing happening?</button>
      </div></div>`;
  }
  if (!me.can_speak) {
    return `<div class="box">
      <div class="say">${e(me.why || 'This wallet cannot speak in Studio.')}</div>
      <div class="row" style="justify-content:flex-start;gap:20px">
        <button class="go" data-act="again">Check again</button>
      </div></div>`;
  }
  if (!mySession()) {
    return `<div class="box">
      <div class="say">Connected as ${e(me.name || short(ROOM.wallet))}${me.role === 'artist' ? ', the artist' : ''}. One signature opens Studio for ${ROOM.days} days.</div>
      <div class="row" style="justify-content:flex-start;gap:20px">
        <button class="go" data-act="signin">Sign in for ${ROOM.days} days</button>
      </div></div>`;
  }
  const len = ROOM.draft.length;
  return `<div class="box">
    <textarea id="text" placeholder="Say something." spellcheck="true" maxlength="${ROOM.max + 40}">${e(ROOM.draft)}</textarea>
    <div class="row">
      <span>${e(me.name || short(ROOM.wallet))}${me.role === 'artist' ? ' &middot; the artist' : ` &middot; ${e(Number(me.tao || 0).toLocaleString('en-NZ'))} TAO`}</span>
      <span class="count${len > ROOM.max ? ' over' : ''}" id="count">${len}/${ROOM.max}</span>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="go" data-act="signout" style="border-color:transparent">Sign out</button>
      <button class="go" id="go" data-act="say"${ROOM.busy || !(len && len <= ROOM.max) ? ' disabled' : ''}>${ROOM.busy ? 'Sending' : 'Say it'}</button>
    </div>
  </div>`;
}

/* The status line is written straight into the DOM rather than through draw(),
   because the thing it most needs to report ... a signature request sitting in
   a wallet ... happens while somebody's half-written message is in the box, and
   re-rendering the box under them to say so would be a poor trade. */
function status(text, bad) {
  ROOM.say = text ? { text, bad: Boolean(bad) } : null;
  const el = document.getElementById('say');
  if (!el) { draw(); return; }
  el.textContent = text || '';
  el.classList.toggle('bad', Boolean(bad));
  el.hidden = !text;
}

function draw({ keep = false, toEnd = false } = {}) {
  const before = keep ? document.documentElement.scrollHeight : 0;
  const say = `<div class="say${ROOM.say && ROOM.say.bad ? ' bad' : ''}" id="say"${ROOM.say ? '' : ' hidden'}>${e(ROOM.say ? ROOM.say.text : '')}</div>`;

  document.getElementById('main').innerHTML = `
    <section class="mast">
      <h1>Studio</h1>
      <div class="sub">chillin' in the studio talking art with each other. TAO gets you in. All can read. Own 1x MintFace artwork, chat in Studio.</div>
    </section>
    <section class="room" id="log">
      ${ROOM.more ? '<button class="earlier" data-act="earlier">Read earlier</button>' : ''}
      ${ROOM.rows.length ? ROOM.rows.map(card).join('') : '<div class="empty">Nobody has said anything yet.</div>'}
    </section>
    <section class="speak">${composer()}${say}</section>`;

  if (keep) window.scrollBy(0, document.documentElement.scrollHeight - before);
  if (toEnd) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  const t = document.getElementById('text');
  if (t && ROOM.focus) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
}

/* Connecting connects, and nothing else. No signature is asked for here, and
   none should be: there is no session to open, so there is nothing to sign
   until there are words to sign. That is worth saying out loud on the page,
   because a wallet that connects and then goes quiet reads as a failure. */
async function connect(choice) {
  /* Connecting never asks for a signature ... there is no session here, so
     there is nothing to sign until there are words. But it does put a request
     in the wallet, and that request can sit unanswered behind a window exactly
     the way a signature can, so it gets the same treatment. */
  ROOM.asking = true;
  status('Asking your wallet for an account ... check your wallet.');
  draw();
  const slow = setTimeout(() => status('Still waiting on the wallet. Its prompt may have opened behind this window.'), 8000);
  try {
    ROOM.wallet = await MF.connect(choice);
    ROOM.pick = null;
  } catch (err) {
    ROOM.asking = false;
    clearTimeout(slow);
    /* Two wallets answering, neither already authorised here. The page cannot
       guess which one this person means, and guessing wrong sends the request
       somewhere it will never be answered ... which is the failure that looks
       like nothing happening at all. So it asks. */
    if (err.code === 'many-providers') {
      ROOM.pick = err.wallets;
      status('More than one wallet is answering. Which one?', false);
      draw();
      return false;
    }
    status(String(err.message || err), true);
    // no wallet answering at all is worth saying precisely, because the reason
    // is nearly always outside the page
    if (err.code === 'no-provider') await sayWhatWeSee();
    draw();
    return false;
  }
  clearTimeout(slow);
  ROOM.asking = false;
  ROOM.focus = true;
  await load();
  status(ROOM.me && ROOM.me.can_speak
    ? 'Connected. Your wallet is asked to sign once, when you say something.'
    : null);
  return true;
}

/* What this browser looks like from inside the page, in one line somebody can
   read back over a message. Every wallet problem that is not the page is
   visible here: nothing installed, an extension switched off for this site,
   two extensions fighting over one slot, or a page served insecurely. */
async function sayWhatWeSee() {
  let r;
  try { r = await MF.walletReport(); } catch (err) { status(`Could not look: ${err.message}`, true); return; }
  const bits = [];
  bits.push(r.announced.length ? `Wallets answering: ${r.announced.join(', ')}` : 'No wallet announced itself');
  bits.push(r.injected ? `window.ethereum: ${r.injectedName}${r.stacked ? `, with ${r.stacked} stacked behind it` : ''}` : 'window.ethereum: absent');
  if (!r.secure) bits.push('This page is not on a secure origin, which stops extensions injecting');
  if (!r.count) bits.push('Nothing to connect to. Check the extension is enabled for mintface.art, then reload.');
  status(bits.join(' · '), !r.count);
}

const askWallet = (message) => MF.sign(message, ROOM.wallet, (state, why) => {
  if (state === 'requested') status('Signature requested ... check your wallet.');
  if (state === 'slow') status('Still waiting on the wallet. A hardware wallet may need waking, or its prompt may have opened behind this window.');
  if (state === 'signed') status('Signed.');
  if (state === 'failed') status(why, true);
});

const post = async (body) => {
  const r = await fetch('/api/chat', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'that did not go through'); e.expired = Boolean(j.expired); throw e; }
  return j;
};

/** The one signature. */
async function signIn() {
  const issued = new Date().toISOString();
  const days = ROOM.days || 7;
  const until = new Date(Date.parse(issued) + days * 86400000).toISOString();
  const signature = await askWallet(sentence({ action: 'sign in', address: ROOM.wallet, issued, until }));
  const j = await post({ action: 'sign in', address: ROOM.wallet, issued, until, signature });
  keep({ address: ROOM.wallet, token: j.token, until: j.until });
  status(`Signed in until ${new Date(j.until).toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' })}. No more wallet prompts here until then.`);
  return j;
}

async function send(payload) {
  const s = mySession();
  if (s) {
    try {
      return await post({ ...payload, token: s.token });
    } catch (err) {
      if (!err.expired) throw err;
      keep(null);                                  // the week is up; ask for another
      status('That sign-in has run out.', true);
      draw();
      throw err;
    }
  }
  const issued = new Date().toISOString();
  const signature = await askWallet(sentence({ ...payload, address: ROOM.wallet, issued }));
  return post({ ...payload, address: ROOM.wallet, issued, signature });
}

document.addEventListener('input', (ev) => {
  if (!ev.target.matches('#text')) return;
  ROOM.draft = ev.target.value;
  const c = document.getElementById('count');
  if (c) { c.textContent = `${ROOM.draft.length}/${ROOM.max}`; c.classList.toggle('over', ROOM.draft.length > ROOM.max); }
  const go = document.getElementById('go');
  if (go) go.disabled = !ROOM.draft.trim() || ROOM.draft.length > ROOM.max;
});

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b || ROOM.busy) return;
  const act = b.dataset.act;

  if (act === 'earlier') return earlier();
  if (act === 'connect') return void connect();
  if (act === 'pick') return void connect(b.dataset.uuid);
  if (act === 'which') return void sayWhatWeSee();
  if (act === 'again') return void (await load(), status(null));
  if (act === 'signout') {
    const s0 = mySession();
    keep(null);
    if (s0) post({ action: 'sign out', token: s0.token }).catch(() => {});
    status('Signed out.');
    draw();
    return;
  }

  const run = async (fn) => {
    ROOM.busy = true;
    b.disabled = true;
    if (b.dataset.act === 'say') b.textContent = 'Sending';
    try {
      await fn();
    } catch (err) {
      /* MF.sign has already put its own reason on the line, and it is a better
         one than the rethrow carries. Anything else that fails ... the network,
         Studio refusing the message ... says so here. */
      status(String((err && err.message) || err), true);
    } finally {
      ROOM.busy = false;
      if (document.body.contains(b)) { b.disabled = false; b.textContent = 'Sign and say'; }
    }
  };

  if (act === 'signin') {
    return run(async () => { await signIn(); await load(); });
  }

  if (act === 'say') {
    const text = (document.getElementById('text') || {}).value || '';
    return run(async () => {
      await send({ action: 'say', text });
      ROOM.draft = '';
      ROOM.focus = true;
      await load();
      status(null);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });
  }

  if (act === 'delete' || act === 'restore') {
    return run(async () => {
      await send({ action: act, target: String(b.dataset.n) });
      await load();
      status(null);
    });
  }

  if (act === 'mute') {
    const who = b.dataset.who;
    if (!window.confirm(`Mute ${who}? They can still read, and nothing in Studio will say so.`)) return;
    return run(async () => {
      await send({ action: 'mute', target: who });
      await load();
      status(`${who} is muted.`);
    });
  }
});

load().then(() => {
  ROOM.timer = setInterval(poll, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
});
</script>
</body>
</html>
