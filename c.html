<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MintFace</title>
<meta name="description" content="A collection by MintFace.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MintFace">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mintface.css">
<style>
/* ---------- head ---------- */
.head{max-width:1500px;margin:0 auto;padding:34px 28px 30px}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,6vw,68px);line-height:1;margin:0 0 12px;letter-spacing:-.01em}
.meta{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.badge{border:1px solid var(--rule);padding:4px 10px;color:var(--muted)}
.statement{font-family:var(--serif);font-size:clamp(20px,2.4vw,26px);line-height:1.45;color:#2c2924;margin:22px 0 0;max-width:620px}
.minting{font-size:13px;color:var(--muted);margin:14px 0 0;max-width:560px}

/* ---------- filters ---------- */
.filters{max-width:1500px;margin:0 auto;padding:26px 28px 0;border-top:1px solid var(--rule)}
.filter-row{display:flex;flex-wrap:wrap;gap:26px;align-items:baseline}
.filter-row button{
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.filter-row button:hover,.filter-row button[aria-expanded="true"]{color:var(--ink)}
.filter-row button .n{color:var(--faint);margin-left:6px}
.filter-row .clear{margin-left:auto;color:var(--faint)}
.options{display:none;flex-wrap:wrap;gap:10px 12px;padding:16px 0 2px}
.options.open{display:flex}
.opt{
  background:none;border:1px solid var(--rule);cursor:pointer;padding:7px 14px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.opt:hover{border-color:var(--ink);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt .n{opacity:.6;margin-left:7px}
.count{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:18px 0 0}

/* ---------- grid ---------- */
.grid{max-width:1500px;margin:0 auto;padding:14px 28px 40px;column-count:4;column-gap:34px}
.tile{break-inside:avoid;margin:0 0 34px;display:block;text-decoration:none}
.tile .shot{background:#f2efe9;overflow:hidden}
.tile img{width:100%;height:auto;transition:opacity .5s ease;opacity:0}
.tile img.in{opacity:1}
.tile .cap{padding:11px 2px 0}
.tile .t{font-family:var(--serif);font-size:19px;line-height:1.25}
.tile .sub{display:flex;gap:9px;align-items:baseline;margin-top:3px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .price{font-family:var(--serif);font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink)}
.tile:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.sentinel{height:10px}
.more{text-align:center;padding:0 28px 70px}

@media(max-width:1200px){.grid{column-count:3}}
@media(max-width:820px){.grid{column-count:2;column-gap:22px}.tile{margin-bottom:22px}}
@media(max-width:520px){
  .grid{column-count:1;padding:14px 20px 30px}
  .head{padding:26px 20px 24px}
  .filters{padding:22px 20px 0}
}
</style>
</head>
<body>

<header class="bar">
  <a class="wordmark" href="/">MintFace</a>
  <a class="smallcaps" href="/collections">All collections</a>
</header>

<main id="main"><div class="loading">Loading</div></main>

<footer class="foot">
  <a class="smallcaps" href="/exhibitions">Exhibitions</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
</footer>

<script src="/mintface.js"></script>
<script>
const e = MF.escape;
const BATCH = 48;

const FACET_LABELS = { availability: 'Availability', orientation: 'Orientation', edition: 'Edition', price: 'Price' };
const VALUE_LABELS = {
  available: 'Available', acquired: 'Collected', vaulted: 'Vaulted', sold_out: 'Sold out',
  uninscribed: 'Not yet inscribed', burned: 'Burned', reserved: 'Reserved',
  portrait: 'Portrait', landscape: 'Landscape', square: 'Square',
  unique: 'Unique 1/1', edition: 'Edition', priced: 'Priced', unpriced: 'On application',
};

function slug() {
  const m = location.pathname.match(/^\/c\/(.+?)\/?$/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('slug') || '';
}

const valueOf = {
  availability: (w) => w.status,
  orientation: (w) => w.orientation || null,
  edition: (w) => (w.edition && w.edition.type === 'edition' ? 'edition' : 'unique'),
  price: (w) => (w.pricing_nzd && w.pricing_nzd.digital != null ? 'priced' : 'unpriced'),
};

const active = {}; // facet -> Set of values

function matches(w) {
  for (const [facet, set] of Object.entries(active)) {
    if (!set.size) continue;
    if (!set.has(valueOf[facet](w))) return false;
  }
  return true;
}

function tile(w, collection) {
  const href = w.id ? `/w/${encodeURIComponent(w.id)}` : null;
  const st = MF.STATUS[w.status] || { label: w.status || 'On record', dot: '' };
  const o = w.offers;
  const p = w.pricing_nzd || {};
  const onOffer = o
    ? (o.digital ? p.digital : o.painting ? p.painting : o.both ? p.both : null)
    : (w.status === 'available' ? p.digital : null);
  const price = onOffer != null ? '$' + Math.round(onOffer).toLocaleString('en-NZ') : null;
  const title = /^#?\d+$/.test((w.title || '').trim())
    ? `${collection.title} ${w.title.startsWith('#') ? w.title : '#' + w.title}`
    : (w.title || 'Untitled');
  const open = href ? `<a class="tile" href="${href}">` : '<div class="tile">';
  const close = href ? '</a>' : '</div>';
  return `${open}
    <div class="shot">${MF.img(w, 700, { alt: title })}</div>
    <div class="cap">
      <div class="t">${e(title)}</div>
      <div class="sub">
        <span><span class="dot ${st.dot}"></span> ${e(st.label)}</span>
        ${w.derivative_of ? `<span>After ${e(w.derivative_of)}</span>` : ''}
        ${price ? `<span class="price">${e(price)}</span>` : ''}
      </div>
    </div>
  ${close}`;
}

let shown = 0;
let filtered = [];
let COLLECTION = null;

function paint(reset) {
  const grid = document.getElementById('grid');
  if (reset) { grid.innerHTML = ''; shown = 0; }
  const next = filtered.slice(shown, shown + BATCH);
  grid.insertAdjacentHTML('beforeend', next.map((w) => tile(w, COLLECTION)).join(''));
  shown += next.length;
  const count = document.getElementById('count');
  if (count) count.textContent =
    `${filtered.length} ${filtered.length === 1 ? 'work' : 'works'}${filtered.length !== COLLECTION.works.length ? ' of ' + COLLECTION.works.length : ''}`;
  document.getElementById('sentinel').hidden = shown >= filtered.length;
}

function applyFilters() {
  filtered = COLLECTION.works.filter(matches);
  paint(true);
  const clear = document.querySelector('.clear');
  if (clear) clear.hidden = Object.values(active).every((s) => !s.size);
}

function filterBar(collection) {
  const declared = collection.facets || {};
  const keys = Object.keys(declared).filter((k) => valueOf[k]);
  if (!keys.length || collection.works.length <= 12) return '';

  // recount against live state, so a work sold this morning is not still
  // sitting in the Available tally
  const facets = {};
  for (const k of keys) {
    const counts = {};
    for (const w of collection.works) {
      const v = valueOf[k](w);
      if (v == null) continue;
      counts[v] = (counts[v] || 0) + 1;
    }
    if (Object.keys(counts).length > 1) facets[k] = counts;
  }
  const live = Object.keys(facets);
  if (!live.length) return '';
  return `<div class="filters">
    <div class="filter-row">
      ${live.map((k) => `<button data-facet="${k}" aria-expanded="false">${e(FACET_LABELS[k] || k)}</button>`).join('')}
      <button class="clear" hidden>Clear</button>
    </div>
    ${live.map((k) => `<div class="options" data-for="${k}">
      ${Object.entries(facets[k]).sort((a, b) => b[1] - a[1]).map(([v, n]) =>
        `<button class="opt" data-facet="${k}" data-value="${e(v)}" aria-pressed="false">${e(VALUE_LABELS[v] || v)}<span class="n">${n}</span></button>`).join('')}
    </div>`).join('')}
    <div class="count" id="count"></div>
  </div>`;
}

function wireFilters() {
  document.querySelectorAll('.filter-row button[data-facet]').forEach((b) => {
    b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') === 'true';
      document.querySelectorAll('.filter-row button[data-facet]').forEach((x) => x.setAttribute('aria-expanded', 'false'));
      document.querySelectorAll('.options').forEach((o) => o.classList.remove('open'));
      if (!open) {
        b.setAttribute('aria-expanded', 'true');
        document.querySelector(`.options[data-for="${b.dataset.facet}"]`).classList.add('open');
      }
    });
  });
  document.querySelectorAll('.opt').forEach((b) => {
    b.addEventListener('click', () => {
      const { facet, value } = b.dataset;
      active[facet] = active[facet] || new Set();
      if (active[facet].has(value)) { active[facet].delete(value); b.setAttribute('aria-pressed', 'false'); }
      else { active[facet].add(value); b.setAttribute('aria-pressed', 'true'); }
      applyFilters();
    });
  });
  const clear = document.querySelector('.clear');
  if (clear) clear.addEventListener('click', () => {
    for (const k of Object.keys(active)) active[k].clear();
    document.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    applyFilters();
  });
}

function render(collection) {
  COLLECTION = collection;
  document.title = `${collection.title} ... MintFace`;
  if (collection.statement) {
    document.querySelector('meta[name="description"]').setAttribute('content', collection.statement);
  }
  const bits = [collection.year, collection.medium, `${collection.works.length} ${collection.works.length === 1 ? 'work' : 'works'}`].filter(Boolean);
  const counts = {};
  for (const w of collection.works) counts[w.status] = (counts[w.status] || 0) + 1;
  const avail = MF.availability({ counts, sold_out: collection.sold_out });

  document.getElementById('main').innerHTML = `
    <div class="head">
      <h1>${e(collection.title)}</h1>
      <div class="meta">
        ${bits.map((b) => `<span>${e(b)}</span>`).join('')}
        ${avail.badge ? `<span class="badge">${e(avail.badge)}</span>` : ''}
        ${avail.available ? `<span><span class="dot available"></span> ${avail.available} available</span>` : ''}
      </div>
      ${collection.statement ? `<p class="statement">${e(collection.statement)}</p>` : ''}
      ${collection.tokenize_on_purchase && collection.notes ? `<p class="minting">${e(collection.notes)}</p>` : ''}
    </div>
    ${filterBar(collection)}
    <div class="grid" id="grid"></div>
    ${collection.works.length ? '' : '<div class="loading">Nothing here yet</div>'}
    <div class="sentinel" id="sentinel"></div>`;

  if (!document.getElementById('count')) {
    document.getElementById('grid').insertAdjacentHTML('beforebegin', '<div class="count" style="max-width:1500px;margin:0 auto;padding:0 28px" id="count"></div>');
  }
  wireFilters();
  applyFilters();

  const io = new IntersectionObserver((entries) => {
    if (entries.some((x) => x.isIntersecting) && shown < filtered.length) paint(false);
  }, { rootMargin: '900px' });
  io.observe(document.getElementById('sentinel'));
}

(async function () {
  const s = slug();
  try {
    const collection = await MF.collection(s);
    if (!collection || !collection.works) {
      document.getElementById('main').innerHTML = '<div class="loading">Collection not found</div>';
      return;
    }
    render(collection);
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="loading">Could not load this collection</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
