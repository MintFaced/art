<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MintFace</title>
<meta name="description" content="A collection by MintFace.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MintFace">
<!-- The mark, at every size a browser asks for. The white cut serves on a
     dark scheme, which is also the tab icon once night is on. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-white-16.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-white-32.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-white-512.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- The reading choice, before the first pixel. The stylesheet defaults to
     prefers-color-scheme on its own, so this is only the override: the cookie
     both deploys share, or this browser's own note of it. Four lines, inline,
     because anything else paints the wrong theme first and corrects it. -->
<meta name="theme-color" content="#faf9f6">
<script>(function(){try{
var c=document.cookie.match(/(?:^|;\s*)mf_theme=(day|night)/),
    t=c?c[1]:localStorage.getItem('mf_theme');
if(t!=='day'&&t!=='night')t=null;
if(t)document.documentElement.setAttribute('data-theme',t);
var n=(t||(matchMedia('(prefers-color-scheme:dark)').matches?'night':'day'))==='night';
document.querySelector('meta[name="theme-color"]').setAttribute('content',n?'#1a1814':'#faf9f6');
}catch(e){}})();</script>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mintface.css">
<style>
/* ---------- head ---------- */
.head{max-width:1500px;margin:0 auto;padding:34px 28px 30px}
h1{font-family:var(--font-sans);font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.02;margin:0 0 12px;letter-spacing:-.03em}
.meta{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.badge{border:1px solid var(--rule);padding:4px 10px;color:var(--muted)}
.statement{font-family:var(--font-sans);font-weight:400;font-size:clamp(17px,1.9vw,20px);line-height:1.55;color:var(--ink-3);margin:22px 0 0;max-width:620px}
/* one line, and nothing louder */
.set-strip{
  display:inline-flex;gap:14px;align-items:baseline;margin-top:22px;text-decoration:none;
  font-family:var(--font-mono);font-weight:400;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--rule);padding-bottom:4px;font-variant-numeric:tabular-nums;
}
.set-strip:hover{color:var(--ink);border-color:var(--ink)}
.set-strip span{color:var(--faint)}
.minting{font-size:13px;color:var(--muted);margin:14px 0 0;max-width:560px}

/* ---------- filters ---------- */
.filters{max-width:1500px;margin:0 auto;padding:26px 28px 0;border-top:1px solid var(--rule)}
.filter-row{display:flex;flex-wrap:wrap;gap:26px;align-items:baseline}
.filter-row .cur{margin-left:auto}
.filter-row button{
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-sans);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.filter-row button:hover,.filter-row button[aria-expanded="true"]{color:var(--ink)}
.filter-row button .n{color:var(--faint);margin-left:6px}
.filter-row .clear{margin-left:auto;color:var(--faint)}
.options{display:none;flex-wrap:wrap;gap:10px 12px;padding:16px 0 2px}
.options.open{display:flex}
.opt{
  background:none;border:1px solid var(--rule);cursor:pointer;padding:7px 14px;
  font-family:var(--font-sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.opt:hover{border-color:var(--ink);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt .n{opacity:.6;margin-left:7px}
.count{font-family:var(--font-mono);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:18px 0 0;font-variant-numeric:tabular-nums}
.states{
  max-width:1500px;margin:0 auto;padding:24px 28px 0;display:flex;gap:0;flex-wrap:wrap;
  border-top:1px solid var(--rule);
}
.states button{
  background:none;border:1px solid var(--rule);border-right-width:0;cursor:pointer;
  padding:9px 16px;font-family:var(--font-sans);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);
}
.states button:last-child{border-right-width:1px}
.states button:hover{color:var(--ink)}
.states button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.states button .n{margin-left:9px;opacity:.55}
.states + .filters{border-top:0;padding-top:18px}

/* ---------- grid ---------- */
.grid{max-width:1500px;margin:0 auto;padding:14px 28px 40px;column-count:4;column-gap:34px}
.tile{break-inside:avoid;margin:0 0 34px;display:block;text-decoration:none}
.tile .shot{background:var(--sunk);overflow:hidden}
.tile img,.tile video{width:100%;height:auto;transition:opacity .5s ease;opacity:0}
.tile img,.tile video.in{opacity:1}
.tile .cap{padding:11px 2px 0}
.tile .t{font-family:var(--font-sans);font-weight:400;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.tile .sub{display:flex;gap:9px;align-items:baseline;margin-top:3px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .price{font-family:var(--font-mono);font-weight:400;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.tile:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.sentinel{height:10px}
.more{text-align:center;padding:0 28px 70px}

@media(max-width:1200px){.grid{column-count:3}}
@media(max-width:820px){.grid{column-count:2;column-gap:22px}.tile{margin-bottom:22px}}
@media(max-width:520px){
  .grid{column-count:1;padding:14px 20px 30px}
  .head{padding:26px 20px 24px}
  .filters{padding:22px 20px 0}
}

/* ---------- justified rows ---------- */
.rows{max-width:1500px;margin:0 auto;padding:0 28px}
.jrow{display:flex;margin-bottom:10px}
.jitem{display:block;text-decoration:none;flex:0 0 auto}
.jshot{background:var(--sunk);overflow:hidden}
.jitem img,.jitem video{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease}
.jitem img.in,.jitem video.in{opacity:1}
.jcap{
  font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.jitem:hover .jcap{color:var(--ink)}
.recent-set{margin:0 0 54px}
.wrap-head{max-width:1500px;margin:0 auto;padding:0 28px}
.wrap-head h2{
  font-family:var(--font-sans);font-weight:500;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline;
}
.wrap-head h2 .n{font-family:var(--font-mono);font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- gallery mode ----------
   On record rather than on offer. There are no prices here and nothing to buy,
   so the only thing added to the head is the one line that leads to the tool a
   commission starts in. */
.maker{margin-top:22px}
.maker a{border-bottom:1px solid var(--rule);padding-bottom:4px}
.maker a:hover{border-color:var(--ink)}
/* a spec runs longer than a title, so it wraps rather than being cut */
.recent-set .rows .jcap{white-space:normal;overflow:visible;text-overflow:clip}

/* ---------- the nudge, read only ----------
   The board lives at /studio and this is not it. This is the reason the
   question was asked, sitting beside the work it decides: what is being
   chosen, what stands, how far the lock is, and the way through to weigh. */
.nudge-embed{max-width:1500px;margin:0 auto;padding:14px 0 70px}
.nudge-body{max-width:1500px;margin:0 auto;padding:0 28px}
.nudge-body .q{font-family:var(--font-sans);font-weight:400;font-size:clamp(19px,2.2vw,24px);line-height:1.28;letter-spacing:-.02em;margin:0;max-width:34em}
.nudge-body .when{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:10px;font-variant-numeric:tabular-nums}
.nudge-body .note{font-size:15px;line-height:1.65;color:var(--ink-4);margin:16px 0 0;max-width:34em}
.nudge-body .promise{font-size:15px;line-height:1.65;color:var(--ink);margin:12px 0 0;max-width:34em}
.nudge-body .board{margin:22px 0 0;max-width:560px;display:flex;flex-direction:column;gap:1px}
.nudge-body .swatch{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule)}
.nudge-body .swatch:last-child{border-bottom:0}
.nudge-body .swatch .chip{width:46px;height:46px;flex:none;border:1px solid var(--rule);display:block}
.nudge-body .swatch .on{display:flex;flex-direction:column;gap:3px;min-width:0}
.nudge-body .swatch .hex{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:var(--ink)}
.nudge-body .swatch .weight{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.nudge-body .swatch .weight b{font-weight:400;color:var(--ink)}
/* the chosen one is marked by the ink rule, never by a second colour */
.nudge-body .swatch.chosen{margin-left:-14px;padding-left:12px;border-left:2px solid var(--ink)}
.nudge-body .swatch.chosen .hex{text-transform:uppercase;letter-spacing:.14em}
.nudge-body .lock,.nudge-body .none{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:18px 0 0;font-variant-numeric:tabular-nums}
.nudge-body .smallcaps{display:inline-block;margin-top:20px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.nudge-body .smallcaps:hover{border-color:var(--ink)}
@media(max-width:520px){.nudge-body{padding:0 20px}}
</style>
</head>
<body>

<header class="nav" id="nav"></header>

<main id="main"><div class="loading">Loading</div></main>

<footer class="foot">
  <a class="smallcaps" href="/exhibitions">Exhibitions</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="/claim">Receive your artwork</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
  <a class="smallcaps" href="/studio">Studio</a>
  <div class="sig">MintFace &middot; 39.64&deg;S 176.85&deg;E</div>
</footer>

<script src="/mintface.js"></script>
<script>
const e = MF.escape;
const BATCH = 48;

const FACET_LABELS = { orientation: 'Orientation', edition: 'Edition', price: 'Price', year: 'Year', medium: 'Medium' };
const VALUE_LABELS = {
  available: 'Available', acquired: 'Collected', collected: 'Collected', vaulted: 'Vaulted', sold_out: 'Sold out',
  uninscribed: 'Not yet inscribed', burned: 'Burned', reserved: 'Reserved',
  portrait: 'Portrait', landscape: 'Landscape', square: 'Square',
  unique: 'Unique 1/1', edition: 'Edition',
};

// the bands are NZD thresholds; their labels are written in the read currency
const PRICE_BANDS = {
  'under-500': [null, 500], '500-1500': [500, 1500], '1500-5000': [1500, 5000], 'over-5000': [5000, null],
};
let FX = {};
function bandLabel(key) {
  const band = PRICE_BANDS[key];
  if (!band) return key;
  const c = MF.currency();
  const [lo, hi] = band.map((n) => (n == null ? null : MF.money(n, c, FX)));
  if (lo && hi) return `${lo} to ${hi}`;
  if (hi) return `Under ${hi}`;
  if (lo) return `Over ${lo}`;
  return key;
}

// the order a buyer thinks in, not alphabetical
const PRICE_ORDER = ['under-500', '500-1500', '1500-5000', 'over-5000'];
const STATE_ORDER = ['available', 'collected', 'vaulted'];
const STATE_MATCH = {
  available: (w) => w.status === 'available' || w.status === 'uninscribed',
  collected: (w) => w.status === 'acquired' || w.status === 'sold_out',
  vaulted: (w) => w.status === 'vaulted',
};

function slug() {
  // the studio door has its own address
  if (/^\/recent\/?$/.test(location.pathname)) return 'recent-work';
  const m = location.pathname.match(/^\/c\/(.+?)\/?$/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('slug') || '';
}

const valueOf = {
  availability: (w) => w.status,
  year: (w) => {
    const m = w.minted_onchain || w.minted || w.digital?.genesis_timestamp;
    const y = w.year || (m ? new Date(m).getFullYear() : null);
    return y ? String(y) : null;
  },
  medium: (w) => w.medium || null,
  orientation: (w) => w.orientation || null,
  edition: (w) => (w.edition && w.edition.type === 'edition' ? 'edition' : 'unique'),
  price: (w) => {
    const p = w.pricing_nzd || {};
    const v = [p.both, p.painting, p.digital].find((x) => typeof x === 'number' && x > 0);
    if (v == null) return null;
    if (v < 500) return 'under-500';
    if (v < 1500) return '500-1500';
    if (v < 5000) return '1500-5000';
    return 'over-5000';
  },
};

// the state control is its own thing, not one of the folded facets
let STATE = 'all';

const active = {}; // facet -> Set of values

function matches(w) {
  if (STATE !== 'all' && !STATE_MATCH[STATE](w)) return false;
  for (const [facet, set] of Object.entries(active)) {
    if (!set.size) continue;
    if (!set.has(valueOf[facet](w))) return false;
  }
  return true;
}

function tile(w, collection) {
  const href = w.id ? `/w/${encodeURIComponent(w.id)}` : null;
  const st = MF.STATUS[w.status] || { label: w.status || 'On record', dot: '' };
  const o = w.offers;
  const p = w.pricing_nzd || {};
  let price = null;
  let nzd = null;
  if (w.priced_in === 'ETH' && w.pricing_eth && w.pricing_eth.digital != null && o && o.digital) {
    price = `${w.pricing_eth.digital} ETH`;
  } else {
    const onOffer = o
      ? (o.digital ? p.digital : o.painting ? p.painting : o.both ? p.both : null)
      : (w.status === 'available' ? p.digital : null);
    if (onOffer != null) nzd = onOffer;
  }
  const title = /^#?\d+$/.test((w.title || '').trim())
    ? `${collection.title} ${w.title.startsWith('#') ? w.title : '#' + w.title}`
    : (w.title || 'Untitled');
  const open = href ? `<a class="tile" href="${href}">` : '<div class="tile">';
  const close = href ? '</a>' : '</div>';
  return `${open}
    <div class="shot">${MF.img(w, 700, { alt: title })}</div>
    <div class="cap">
      <div class="t">${e(title)}</div>
      <div class="sub">
        <span><span class="dot ${st.dot}"></span> ${e(st.label)}</span>
        ${w.derivative_of ? `<span>After ${e(w.derivative_of)}</span>` : ''}
        ${nzd != null
          ? `<span class="price" data-nzd="${nzd}">${e(MF.money(nzd, MF.currency(), FX) || '')}</span>`
          : price ? `<span class="price">${e(price)}</span>` : ''}
      </div>
    </div>
  ${close}`;
}

let shown = 0;
let filtered = [];
let COLLECTION = null;

function paint(reset) {
  const grid = document.getElementById('grid');
  if (reset) { grid.innerHTML = ''; shown = 0; }
  const next = filtered.slice(shown, shown + BATCH);
  grid.insertAdjacentHTML('beforeend', next.map((w) => tile(w, COLLECTION)).join(''));
  shown += next.length;
  const count = document.getElementById('count');
  if (count) count.textContent =
    `${filtered.length} ${filtered.length === 1 ? 'work' : 'works'}${filtered.length !== COLLECTION.works.length ? ' of ' + COLLECTION.works.length : ''}`;
  document.getElementById('sentinel').hidden = shown >= filtered.length;
  MF.progress.watch(grid);
}

function applyFilters() {
  filtered = COLLECTION.works.filter(matches);
  paint(true);
  const clear = document.querySelector('.clear');
  if (clear) clear.hidden = Object.values(active).every((s) => !s.size);
}

function stateControl(works) {
  const counts = {};
  for (const k of STATE_ORDER) counts[k] = works.filter(STATE_MATCH[k]).length;
  const live = STATE_ORDER.filter((k) => counts[k]);
  if (live.length < 2) return '';
  return `<div class="states" id="states">
    <button data-state="all" aria-pressed="true">All<span class="n">${works.length}</span></button>
    ${live.map((k) => `<button data-state="${k}" aria-pressed="false">${e(VALUE_LABELS[k] || k)}<span class="n">${counts[k]}</span></button>`).join('')}
  </div>`;
}

function filterBar(collection) {
  const declared = collection.facets || {};
  const enough = collection.works.length > 12;
  const keys = enough ? Object.keys(declared).filter((k) => valueOf[k] && k !== 'availability') : [];

  // recount against live state, so a work sold this morning is not still
  // sitting in the Available tally
  const facets = {};
  for (const k of keys) {
    const counts = {};
    for (const w of collection.works) {
      const v = valueOf[k](w);
      if (v == null) continue;
      counts[v] = (counts[v] || 0) + 1;
    }
    if (Object.keys(counts).length > 1) facets[k] = counts;
  }
  const live = Object.keys(facets);
  // the currency control shows even where there is nothing to filter on, so a
  // price is always readable in the viewer's own money
  return `<div class="filters">
    <div class="filter-row">
      ${live.map((k) => `<button data-facet="${k}" aria-expanded="false">${e(FACET_LABELS[k] || k)}</button>`).join('')}
      ${live.length ? '<button class="clear" hidden>Clear</button>' : ''}
      ${MF.currencyBar('cur')}
    </div>
    ${live.map((k) => `<div class="options" data-for="${k}">
      ${Object.entries(facets[k]).sort((a, b) => {
        if (k === 'price') return PRICE_ORDER.indexOf(a[0]) - PRICE_ORDER.indexOf(b[0]);
        if (k === 'year') return Number(b[0]) - Number(a[0]);
        return b[1] - a[1];
      }).map(([v, n]) =>
        `<button class="opt" data-facet="${k}" data-value="${e(v)}" aria-pressed="false">${e(k === 'price' ? bandLabel(v) : (VALUE_LABELS[v] || v))}<span class="n">${n}</span></button>`).join('')}
    </div>`).join('')}
    <div class="count" id="count"></div>
  </div>`;
}

function wireStates() {
  const bar = document.getElementById('states');
  if (!bar) return;
  bar.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    STATE = b.dataset.state;
    [...bar.querySelectorAll('button')].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    applyFilters();
  });
}

function wireFilters() {
  document.querySelectorAll('.filter-row button[data-facet]').forEach((b) => {
    b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') === 'true';
      document.querySelectorAll('.filter-row button[data-facet]').forEach((x) => x.setAttribute('aria-expanded', 'false'));
      document.querySelectorAll('.options').forEach((o) => o.classList.remove('open'));
      if (!open) {
        b.setAttribute('aria-expanded', 'true');
        document.querySelector(`.options[data-for="${b.dataset.facet}"]`).classList.add('open');
      }
    });
  });
  document.querySelectorAll('.opt').forEach((b) => {
    b.addEventListener('click', () => {
      const { facet, value } = b.dataset;
      active[facet] = active[facet] || new Set();
      if (active[facet].has(value)) { active[facet].delete(value); b.setAttribute('aria-pressed', 'false'); }
      else { active[facet].add(value); b.setAttribute('aria-pressed', 'true'); }
      applyFilters();
    });
  });
  const clear = document.querySelector('.clear');
  if (clear) clear.addEventListener('click', () => {
    for (const k of Object.keys(active)) active[k].clear();
    document.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    applyFilters();
  });
}

// Recent Work is shown as rows rather than a grid, because these are
// photographs of paintings at whatever shape the painting is, and the set reads
// better whole than cropped square.
// the five variants that make up the geodetic set
const SET_MEMBERS = ['geodetic-world', 'geodetic-moments', 'geodetic-memory', 'geodetic-onchain', 'geodetica'];

// one quiet line, and only while a set can actually be completed
async function setStrip(collection) {
  const el = document.getElementById('setStrip');
  if (!el || !SET_MEMBERS.includes(collection.slug)) return;
  try {
    const set = await fetch('/api/set').then((r) => r.json());
    if (!set.complete || !set.remaining) return;
    el.innerHTML = `<a class="set-strip" href="/set/${e(set.slug)}">Complete the set`
      + `<span>${set.remaining} ${set.remaining === 1 ? 'remains' : 'remain'}</span></a>`;
  } catch { /* the strip is an offer, not a requirement */ }
}

const RECENT_GROUPS = [
  { id: 'painting', title: 'Paintings' },
  { id: 'pixel', title: 'Pixel paintings' },
];

function recentGroups(collection) {
  const by = {};
  for (const w of collection.works || []) (by[w.group || 'painting'] ||= []).push(w);
  const known = RECENT_GROUPS.filter((g) => (by[g.id] || []).length);
  // anything the manifest calls something else still gets shown
  const other = Object.keys(by).filter((k) => !RECENT_GROUPS.some((g) => g.id === k));
  return [...known, ...other.map((k) => ({ id: k, title: k }))]
    .map((g) => `<section class="recent-set">
      <div class="wrap-head"><h2>${e(g.title)}<span class="n">${(by[g.id] || []).length}</span></h2></div>
      <div class="rows" data-group="${e(g.id)}"></div>
    </section>`).join('');
}

function paintRecent(collection) {
  const by = {};
  for (const w of collection.works || []) (by[w.group || 'painting'] ||= []).push(w);
  for (const el of document.querySelectorAll('.rows[data-group]')) {
    MF.paintRows(el, by[el.dataset.group] || [], { target: 360, targetSmall: 200, gutter: 10 });
  }
}

/* ---------- gallery mode ----------
 *
 * A collection that is on record rather than on offer. Nothing here is
 * tokenized, so nothing here has a price, an acquire path or an availability
 * dot ... the honest pre-chain state, said once by the collection and read by
 * every part of the page rather than inferred from a missing figure.
 *
 * The site designs are bands: full measure, stacked, captioned with their spec.
 * The photographs are justified rows, because a room is a picture and a strip
 * painting at four to one is not.
 */
const GALLERY_GROUPS = [
  { id: 'site-design', title: 'The site designs', bands: true },
  { id: 'install', title: 'Installed' },
];

const byGroup = (collection, fallback) => {
  const by = {};
  for (const w of collection.works || []) (by[w.group || fallback] ||= []).push(w);
  return by;
};

function galleryGroups(collection) {
  const by = byGroup(collection, 'install');
  const known = GALLERY_GROUPS.filter((g) => (by[g.id] || []).length);
  const other = Object.keys(by).filter((k) => !GALLERY_GROUPS.some((g) => g.id === k));
  return [...known, ...other.map((k) => ({ id: k, title: k }))]
    .map((g) => `<section class="recent-set">
      <div class="wrap-head"><h2>${e(g.title)}<span class="n">${(by[g.id] || []).length}</span></h2></div>
      ${g.bands
        ? `<div class="bands" data-bands="${e(g.id)}"></div>`
        : `<div class="rows" data-group="${e(g.id)}"></div>`}
    </section>`).join('');
}

function paintGallery(collection) {
  const by = byGroup(collection, 'install');
  for (const el of document.querySelectorAll('.bands[data-bands]')) {
    MF.stripBands(el, by[el.dataset.bands] || []);
  }
  for (const el of document.querySelectorAll('.rows[data-group]')) {
    // the caption is the work's own spec where it has one, in the same mono
    const works = (by[el.dataset.group] || []).map((w) => ({ ...w, title: w.caption || w.title }));
    MF.paintRows(el, works, { target: 380, targetSmall: 220, gutter: 10 });
  }
}

/* The nudge this collection is the context for, read only.
 *
 * The board is where the weighing happens and this is not the board ... it is
 * the reason the question was asked, sitting beside the work it decides. So it
 * says what is being chosen, what stands, and how far the lock is, and then it
 * leads to the room where a wallet can put TAO behind a colour. */
const worn = (n) => {
  const v = Math.floor(Number(n) || 0);
  if (v >= 1000000) return `${(v / 1000000).toFixed(2).replace(/\.?0+$/, '')}M`;
  if (v >= 1000) return `${(v / 1000).toFixed(1).replace(/\.0$/, '')}K`;
  return String(v);
};
const nudgeDate = (d) => (d ? new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' }) : '');

function nudgeMarkup(x) {
  const cands = (x.candidates || []).filter((c) => c.hex);
  const board = cands.length
    ? `<div class="board">${cands.map((c) => `<div class="swatch${x.locked && x.locked.hex === c.hex ? ' chosen' : ''}">
        <span class="chip" style="background:${e(c.hex)}"></span>
        <span class="on">
          <span class="hex">${e(c.hex)}</span>
          <span class="weight"><b>${worn(c.total)}</b> TAO &middot; ${c.voters} collector${c.voters === 1 ? '' : 's'}</span>
        </span>
      </div>`).join('')}</div>`
    : '<p class="none">No colour on the board yet.</p>';
  const p = x.open && x.progress;
  const lock = p
    ? `<p class="lock">Lock &middot; ${p.voters.at} of ${p.voters.of} collectors
       &middot; ${worn(p.tao.at)} of ${worn(p.tao.of)} TAO on the leader</p>`
    : '';
  const banked = x.open ? '' : `<p class="lock">${x.locked
    ? `Locked &middot; ${e(x.locked.hex)} &middot; ${worn(x.total)} TAO &middot; ${x.collectors} collector${x.collectors === 1 ? '' : 's'}`
    : `No colour locked &middot; ${worn(x.total)} TAO across ${x.collectors} collector${x.collectors === 1 ? '' : 's'}`}</p>`;
  return `<div class="wrap-head"><h2>The colour vote</h2></div>
    <div class="nudge-body">
      <p class="q">${e(x.question)}</p>
      <div class="when">Nudge #${x.number} &middot; ${x.open ? 'closes' : 'closed'} ${e(nudgeDate(x.closes))}</div>
      ${x.note ? `<p class="note">${e(x.note)}</p>` : ''}
      ${x.promise ? `<p class="promise">${e(x.promise)}</p>` : ''}
      ${board}
      ${lock}${banked}
      <a class="smallcaps" href="/studio#nudge-${e(x.id)}">${x.open ? 'Weigh TAO on the board' : 'The board'}</a>
    </div>`;
}

async function paintNudge(collection) {
  const el = document.getElementById('nudge');
  if (!el || !collection.nudge) return;
  try {
    const state = await fetch('/api/nudge').then((r) => (r.ok ? r.json() : null));
    const list = (state && state.nudges) || (Array.isArray(state) ? state : null);
    const x = (list || []).find((n) => n.id === collection.nudge);
    if (!x) { el.remove(); return; }
    el.innerHTML = nudgeMarkup(x);
  } catch {
    // the board is context, not a requirement: without it the link still stands
    el.innerHTML = `<div class="wrap-head"><h2>The colour vote</h2></div>
      <div class="nudge-body"><a class="smallcaps" href="/studio">The board</a></div>`;
  }
}

function render(collection) {
  COLLECTION = collection;
  document.title = `${collection.title} ... MintFace`;
  if (collection.statement) {
    document.querySelector('meta[name="description"]').setAttribute('content', collection.statement);
  }
  const gallery = collection.gallery === true;
  const bits = [collection.year, collection.medium, `${collection.works.length} ${collection.works.length === 1 ? 'work' : 'works'}`].filter(Boolean);
  const counts = {};
  for (const w of collection.works) counts[w.status] = (counts[w.status] || 0) + 1;
  const avail = MF.availability({ counts, sold_out: collection.sold_out });
  // The pre-chain state, said where availability would otherwise be. Same words
  // a work carries in its own details table, so the two never disagree.
  const state = gallery
    ? '<span class="badge">Not yet tokenized</span>'
    : `${avail.badge ? `<span class="badge">${e(avail.badge)}</span>` : ''}
       ${avail.available ? `<span><span class="dot available"></span> ${avail.available} available</span>` : ''}`;
  // the commissioning door, one line, where a reader has just seen four of them
  const maker = gallery && collection.links && collection.links.maker
    ? `<div class="maker"><a class="smallcaps" href="${e(collection.links.maker)}">Design a strip painting</a></div>`
    : '';

  document.getElementById('main').innerHTML = `
    <div class="head">
      <h1>${e(collection.title)}</h1>
      <div class="meta">
        ${bits.map((b) => `<span>${e(b)}</span>`).join('')}
        ${state}
      </div>
      ${collection.statement ? `<p class="statement">${e(collection.statement)}</p>` : ''}
      ${(collection.tokenize_on_purchase || gallery) && collection.notes ? `<p class="minting">${e(collection.notes)}</p>` : ''}
      ${maker}
      <div id="setStrip"></div>
    </div>
    ${collection.slug === 'recent-work' || gallery ? '' : stateControl(collection.works)}
    ${collection.slug === 'recent-work' || gallery ? '' : filterBar(collection)}
    ${gallery ? galleryGroups(collection)
      : collection.slug === 'recent-work' ? recentGroups(collection)
      : '<div class="grid" id="grid"></div>'}
    ${collection.works.length ? '' : '<div class="loading">Nothing here yet</div>'}
    ${gallery && collection.nudge ? '<section class="nudge-embed" id="nudge"></section>' : ''}
    <div class="sentinel" id="sentinel"></div>`;

  // A gallery has no grid, no filters, no prices and nothing to buy, so none of
  // the furniture below applies to it either
  if (gallery) {
    paintGallery(collection);
    paintNudge(collection);
    return;
  }

  // Recent Work has rows rather than a grid, so none of the grid furniture
  // below applies to it
  if (collection.slug === 'recent-work') {
    paintRecent(collection);
    return;
  }
  if (!document.getElementById('count')) {
    document.getElementById('grid').insertAdjacentHTML('beforebegin', '<div class="count" style="max-width:1500px;margin:0 auto;padding:0 28px" id="count"></div>');
  }
  setStrip(collection);
  wireStates();
  wireFilters();
  // changing currency rewrites the band labels as well as the prices
  MF.wireCurrencyBar(document.getElementById('cur'), () => {
    for (const btn of document.querySelectorAll('.opt[data-facet="price"]')) {
      const n = btn.querySelector('.n');
      btn.textContent = bandLabel(btn.dataset.value);
      if (n) btn.appendChild(n);
    }
  });
  applyFilters();

  const io = new IntersectionObserver((entries) => {
    if (entries.some((x) => x.isIntersecting) && shown < filtered.length) paint(false);
  }, { rootMargin: '900px' });
  io.observe(document.getElementById('sentinel'));
}

(async function () {
  const s = slug();
  try {
    // rates first, so prices and bands are written in the read currency rather
    // than flashing New Zealand dollars and correcting themselves
    const [collection] = await Promise.all([
      MF.collection(s),
      MF.fx().then((fx) => { FX = fx; }).catch(() => {}),
    ]);
    // a token sent to the zero address is not part of the collection any more
    if (collection && collection.works) {
      collection.works = collection.works.filter((w) => w.status !== 'burned');
    }
    if (!collection || !collection.works) {
      document.getElementById('main').innerHTML = '<div class="loading">Collection not found</div>';
      return;
    }
    render(collection);
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="loading">Could not load this collection</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
