<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The studio's commissions (STRIP-CHECKOUT): /mintwork/commissions and
     /mintwork/commissions/{id}. Behind the console password; the buyer's
     details are drawn here as plain text and never leave this page. -->
<title>Commissions ... MintFace studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/mintface.css">
<style>
body{background:var(--paper)}
.ck{max-width:1200px;margin:0 auto;padding:36px 24px 80px;font-family:var(--font-sans);color:var(--ink)}
.ck h1{font-weight:400;font-size:32px;letter-spacing:-.02em;margin:0 0 18px}
.ck .mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ck .grey{color:var(--muted)}
.ck a{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 18px}
.tabs button,.ck .quiet{background:none;border:0;padding:8px 0;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:top}
th{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.m{font-family:var(--font-mono);font-size:12px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px;align-items:start}
.detail canvas{display:block;max-width:100%;background:var(--sunk)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0}
.kv dt{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.box{border-top:1px solid var(--rule);padding-top:16px;margin-top:20px;display:flex;flex-direction:column;gap:10px}
.box label{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box input,.box select,.box textarea{font-family:var(--font-sans);font-size:14px;padding:8px;border:1px solid var(--rule);background:none;color:var(--ink);text-transform:none;letter-spacing:0}
.btn{align-self:flex-start;min-height:40px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--font-sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.say{min-height:18px;font-size:13px;color:var(--muted)}
.photos img{max-width:160px;max-height:160px;margin:0 8px 8px 0}
.ck [hidden]{display:none!important}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--ink);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.ck h2{font-weight:400;font-size:20px;letter-spacing:-.01em;margin:0}
.codes{margin-top:48px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.codes form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
@media(max-width:820px){.detail{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main class="ck" id="main"><p class="mono grey">Loading</p></main>
<script>
/* Plain text in, plain text out: every value from an order goes through esc
   before it touches the page, the buyer's address and notes above all. */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = document.getElementById('main');
const ID = location.pathname.split('/')[3] || null;
const FILTERS = [['', 'All'], ['pending_payment', 'Pending'], ['paid', 'Paid'], ['in_studio', 'In studio'], ['painted', 'Painted'], ['shipped', 'Shipped'], ['collected', 'Collected'], ['complete', 'Complete'], ['expired', 'Expired'], ['refunded', 'Refunded']];
let filter = '';

async function api(q, body) {
  const r = await fetch(`/api/commission-admin${q || ''}`, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { login(); throw new Error('sign in first'); }
  if (!r.ok) throw new Error(j.error || `error ${r.status}`);
  return j;
}

function login() {
  main.innerHTML = `<h1>Commissions</h1><form id="in" class="box" style="max-width:320px"><label>Studio password<input type="password" name="p" autocomplete="current-password"></label><button class="btn">Sign in</button><p class="say" id="say"></p></form>`;
  document.getElementById('in').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const r = await fetch('/api/studio-api?do=login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: ev.target.p.value }) });
    if (r.ok) start(); else document.getElementById('say').textContent = r.status === 429 ? 'Too many tries. Wait a few minutes.' : 'No.';
  });
}

async function list() {
  const j = await api(filter ? `?status=${encodeURIComponent(filter)}` : '');
  main.innerHTML = `<h1>Commissions</h1>
    <p style="margin:-8px 0 14px"><a class="quiet" href="/mintwork/commissions/new">+ New custom commission</a></p>
    <div class="tabs">${FILTERS.map(([k, label]) => `<button type="button" data-f="${k}" aria-pressed="${k === filter}">${label}</button>`).join('')}</div>
    ${j.orders.length ? `<table><thead><tr><th>Reference</th><th>Date</th><th>Spec</th><th>Method</th><th>Status</th><th>Amount</th></tr></thead><tbody>
    ${j.orders.map((o) => `<tr><td class="m"><a href="/mintwork/commissions/${esc(o.id)}">${esc(o.id)}</a></td><td class="m">${esc(new Date(o.created).toLocaleDateString('en-NZ'))}</td>
      <td>${esc(o.spec_line)}${o.name ? `<br><span class="grey">${esc(o.name)}</span>` : ''}</td><td class="m">${esc(o.method || '')}</td><td class="m">${esc(o.status.replace('_', ' '))}</td>
      <td class="m">${esc(o.paid_amount || `NZD ${Number(o.nzd).toLocaleString('en-NZ')} · ${o.eth} ETH`)}${o.discount ? `<span class="tag">${esc(o.discount.label)}</span>` : ''}</td></tr>`).join('')}
    </tbody></table>` : '<p class="grey">None.</p>'}
    <section class="codes box" id="codes"><h2>Codes</h2><p class="grey" style="margin:0">Loading</p></section>`;
  main.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; list(); }));
  codes().catch((err) => { document.getElementById('codes').innerHTML = `<h2>Codes</h2><p>${esc(err.message)}</p>`; });
}

/* The WestSide rate's codes. Their text is drawn here from the store, as the
   page runs; it is never written into this file or anywhere in the repo. */
async function codes() {
  const { codes: all } = await api('?codes=1');
  const box = document.getElementById('codes');
  if (!box) return;
  const nz = (n) => `NZD ${Number(n).toLocaleString('en-NZ')}`;
  box.innerHTML = `<h2>Codes</h2>
    ${all.length ? `<table><thead><tr><th>Code</th><th>Rate</th><th>Uses</th><th>Paid</th><th>Ends</th><th>On</th></tr></thead><tbody>
    ${all.map((c) => `<tr><td class="m">${esc(c.code)}</td><td class="m">${esc(c.label)} ${esc(c.pct)}%</td>
      <td class="m">${c.uses.length}${c.max_uses ? ` of ${esc(c.max_uses)}` : ''}${c.uses.length ? `<br>${c.uses.map((id) => `<a href="/mintwork/commissions/${esc(id)}">${esc(id)}</a>`).join('<br>')}` : ''}</td>
      <td class="m">${c.paid_nzd ? esc(nz(c.paid_nzd)) : ''}</td><td class="m">${c.ends ? esc(new Date(c.ends).toLocaleDateString('en-NZ')) : 'no end'}</td>
      <td><button type="button" class="quiet" data-code="${esc(c.code)}" data-active="${c.active ? '0' : '1'}">${c.active ? 'On · switch off' : 'Off · switch on'}</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="grey" style="margin:0">No codes yet.</p>'}
    <form id="cc"><label>Code<input name="code" required minlength="4" maxlength="24" autocomplete="off" spellcheck="false"></label>
      <label>% off<input name="pct" type="number" min="1" max="90" value="40"></label>
      <label>Max uses<input name="max_uses" type="number" min="1" placeholder="no limit"></label>
      <label>Ends<input name="ends" type="date"></label>
      <button class="btn">Create code</button></form>
    <p class="grey" style="margin:0;font-size:13px">A to Z, 0 to 9 or -, 4 to 24 characters. Every code is the WestSide rule: a Hastings CBD building, collected, the box ticked.</p>
    <p class="say" id="csay"></p>`;
  const csay = (m) => { document.getElementById('csay').textContent = m; };
  box.querySelectorAll('[data-code]').forEach((b) => b.addEventListener('click', async () => {
    try { await api('', { action: 'code-active', code: b.dataset.code, active: b.dataset.active === '1' }); codes(); } catch (err) { csay(err.message); }
  }));
  document.getElementById('cc').addEventListener('submit', async (ev) => {
    ev.preventDefault(); const f = ev.target;
    try {
      await api('', { action: 'code-create', code: f.code.value, pct: Number(f.pct.value || 40), max_uses: f.max_uses.value || null, ends: f.ends.value || null });
      codes();
    } catch (err) { csay(err.message); }
  });
}

/* Strips into a canvas the way stripPNG lays them: portrait left to right,
   landscape from the bottom up. */
function paintStrips(canvas, strips, portrait, w, h) {
  canvas.width = Math.max(1, Math.round(w)); canvas.height = Math.max(1, Math.round(h));
  const ctx = canvas.getContext('2d');
  const total = strips.reduce((n, s) => n + s.mm, 0) || 1;
  const across = portrait ? canvas.width : canvas.height;
  let mm = 0;
  for (const s of strips) {
    const a = Math.round((mm / total) * across); const b = Math.round(((mm + s.mm) / total) * across);
    ctx.fillStyle = s.hex;
    if (portrait) ctx.fillRect(a, 0, b - a, canvas.height); else ctx.fillRect(0, canvas.height - b, canvas.width, b - a);
    mm += s.mm;
  }
}

function draw(canvas, o) {
  const portrait = o.spec.orientation === 'portrait';
  const pw = portrait ? o.spec.width_cm : o.spec.length_cm;
  const ph = portrait ? o.spec.length_cm : o.spec.width_cm;
  const k = Math.min(440 / pw, 440 / ph);
  paintStrips(canvas, o.strip_data, portrait, pw * k, ph * k);
}

/* payUrl is a new pay link, drawn once straight after it is made and never
   kept: the page forgets it on the next render. */
async function detail(id, payUrl = null) {
  const { order: o, statuses } = await api(`?id=${encodeURIComponent(id)}`);
  const eth = o.eth ? `${o.eth.received_wei !== '0' ? `received ${(Number(BigInt(o.eth.received_wei) / 10n ** 12n) / 1e6)} of ${o.price.eth} ETH` : `${o.price.eth} ETH, nothing yet`}${o.eth.surplus_wei ? ` · SURPLUS to refund by hand` : ''}${(o.eth.txs || []).map((t) => `\n${t.hash} (${t.how})`).join('')}` : '';
  const row = (k, v) => (v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : '');
  main.innerHTML = `<p><a class="quiet" href="/mintwork/commissions">← All commissions</a></p>
    <h1>${esc(o.id)}</h1>
    <div class="detail">
      <div><canvas id="art"></canvas>
        <p class="mono" style="margin-top:12px">${esc(o.spec_line)}</p>
        <p><a class="btn ghost" style="display:inline-flex;align-items:center;text-decoration:none" href="/api/commission-admin?id=${encodeURIComponent(o.id)}&strips=1">Download strip data</a></p>
        ${o.photos && o.photos.length ? `<div class="photos">${o.photos.map((p) => `<a href="https://assets.mintface.art/${esc(p.key)}" target="_blank" rel="noopener"><img src="https://assets.mintface.art/${esc(p.key)}" alt="Photograph of ${esc(o.id)}"></a>`).join('')}</div>` : ''}
      </div>
      <div>
        <dl class="kv">
          ${row('Status', o.status.replace('_', ' '))}${row('Created', new Date(o.created).toLocaleString('en-NZ'))}${row('Expires', o.status === 'pending_payment' ? new Date(o.expires_at).toLocaleString('en-NZ') : '')}
          ${row('Price', `NZD ${Number(o.price.nzd).toLocaleString('en-NZ')} · ${o.price.eth} ETH at ${o.price.eth_rate} · ${o.price.usd ? `USD ${o.price.usd}` : ''}${o.priced_as ? `\npriced as ${o.priced_as.length_cm} × ${o.priced_as.width_cm} cm` : ''}`)}
          ${row('Rate', o.discount ? `${o.discount.label} ${o.discount.pct}% · list NZD ${Number(o.price.list_nzd).toLocaleString('en-NZ')} · building ${o.discount.building || '-'} · by ${o.discount.by}` : '')}
          ${row('Paid', o.paid_at ? `${o.paid_amount || ''} by ${o.method} · ${new Date(o.paid_at).toLocaleString('en-NZ')}` : '')}${row('Payment ref', o.payment_ref)}${row('ETH', eth)}
          ${row('Palette', `${o.spec.palette_id} · ${o.spec.colours.map((c) => c.hex).join(' ')}`)}
          ${row('Name', o.name)}${row('Email', o.email)}${row('Ship to', o.spec.delivery === 'shipped' ? o.ship_to : o.spec.delivery === 'installed' ? 'Installed by Sign Central, mounting system included' : 'Collect from The Line')}
          ${row('X', o.mention && o.x_handle ? `@${o.x_handle} (mention)` : '')}${row('Tracking', o.tracking)}
          ${row('Notes', (o.notes || []).map((n) => `${new Date(n.at).toLocaleString('en-NZ')} · ${n.note}`).join('\n'))}
          ${row('History', (o.history || []).map((h) => `${new Date(h.at).toLocaleString('en-NZ')} · ${h.what}${h.note ? ` · ${h.note}` : ''}`).join('\n'))}
        </dl>
        <form class="box" id="st"><label>Status<select name="status">${statuses.map((s) => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s.replace('_', ' ')}</option>`).join('')}</select></label>
          <label>Tracking<input name="tracking" value="${esc(o.tracking || '')}"></label><label>Note<textarea name="note" rows="2"></textarea></label>
          <button class="btn">Save</button><p class="grey" style="font-size:13px;margin:0">Painted emails the buyer the latest photograph; shipped emails the tracking.</p></form>
        <form class="box" id="ph"><label>Photograph of the painting<input type="file" name="f" accept="image/*"></label><button class="btn ghost">Upload</button></form>
        ${o.status === 'pending_payment' ? `<div class="box"><button type="button" class="btn ghost" id="paylink">New pay link</button>
          ${payUrl ? `<label>Send this to the buyer<input id="payurl" readonly value="${esc(payUrl)}"></label><button type="button" class="btn" id="paycopy">Copy link</button>
          <p class="grey" style="font-size:13px;margin:0">It opens the order in any browser. The buyer's old link no longer does. This page won't show it again: if it's lost, make another.</p>`
    : `<p class="grey" style="font-size:13px;margin:0">For a buyer who can't open the order in the browser that made it, or an order made for them. The link they have now stops working.</p>`}</div>` : ''}
        ${['pending_payment', 'expired'].includes(o.status) ? (o.discount
    ? `<div class="box"><button type="button" class="btn ghost" id="undisc">Remove rate</button></div>`
    : `<div class="box"><button type="button" class="btn ghost" id="disc-open">WestSide rate</button>
          <form id="disc" class="box" hidden style="margin-top:0;border:0;padding-top:0"><label>Building address<input name="building" required minlength="8" maxlength="200" autocomplete="off"></label>
          <label>Note (why)<textarea name="note" rows="2" required placeholder="WestSide, fixed to …"></textarea></label>
          <button class="btn">Apply 40% off</button>
          <p class="grey" style="font-size:13px;margin:0">Collected, not shipped.${o.status === 'expired' ? ' Reopens the order for 7 days.' : ''} The buyer sees the new price when they reload.</p></form></div>`) : ''}
        ${['pending_payment', 'expired'].includes(o.status) ? `<form class="box" id="mp"><label>Mark paid by hand<select name="method"><option>bank</option><option>eth</option><option>card</option><option>cash</option><option>other</option></select></label>
          <label>Reference<input name="ref"></label><label>Note (why)<textarea name="note" rows="2" required></textarea></label><button class="btn ghost">Mark paid</button></form>` : ''}
        <p class="say" id="say"></p>
      </div>
    </div>`;
  draw(document.getElementById('art'), o);
  const say = (m) => { document.getElementById('say').textContent = m; };
  document.getElementById('st').addEventListener('submit', async (ev) => {
    ev.preventDefault(); const f = ev.target;
    try { await api('', { id: o.id, action: 'status', status: f.status.value, tracking: f.tracking.value || undefined, note: f.note.value || undefined }); detail(o.id); } catch (err) { say(err.message); }
  });
  document.getElementById('ph').addEventListener('submit', async (ev) => {
    ev.preventDefault(); const file = ev.target.f.files[0]; if (!file) return;
    say('Sizing and sending');
    try {
      const img = await createImageBitmap(file);
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.86).split(',')[1];
      await api('', { id: o.id, action: 'photo', type: 'image/jpeg', data });
      detail(o.id);
    } catch (err) { say(err.message); }
  });
  const payLink = document.getElementById('paylink');
  if (payLink) payLink.addEventListener('click', async () => {
    if (!confirm(`Make a new pay link for ${o.id}? The link the buyer has now stops opening the order.`)) return;
    try { const j = await api('', { id: o.id, action: 'handover' }); await detail(o.id, j.link); } catch (err) { say(err.message); }
  });
  const payCopy = document.getElementById('paycopy');
  if (payCopy) payCopy.addEventListener('click', async () => {
    const input = document.getElementById('payurl');
    input.select();
    try { await navigator.clipboard.writeText(input.value); say('Link copied'); } catch { say('Select the link and copy it'); }
  });
  const discOpen = document.getElementById('disc-open');
  if (discOpen) discOpen.addEventListener('click', () => { const f = document.getElementById('disc'); f.hidden = !f.hidden; if (!f.hidden) f.building.focus(); });
  const disc = document.getElementById('disc');
  if (disc) disc.addEventListener('submit', async (ev) => {
    ev.preventDefault(); const f = ev.target;
    try { await api('', { id: o.id, action: 'discount', building: f.building.value, note: f.note.value }); detail(o.id); } catch (err) { say(err.message); }
  });
  const undisc = document.getElementById('undisc');
  if (undisc) undisc.addEventListener('click', async () => {
    const note = prompt(`Remove the WestSide rate from ${o.id}? It goes back to the list price. Why?`);
    if (note == null) return;
    try { await api('', { id: o.id, action: 'undiscount', note }); detail(o.id); } catch (err) { say(err.message); }
  });
  const mp = document.getElementById('mp');
  if (mp) mp.addEventListener('submit', async (ev) => {
    ev.preventDefault(); const f = ev.target;
    if (!confirm(`Mark ${o.id} paid by ${f.method.value}? The buyer and you are emailed.`)) return;
    try { await api('', { id: o.id, action: 'mark-paid', method: f.method.value, ref: f.ref.value || undefined, note: f.note.value }); detail(o.id); } catch (err) { say(err.message); }
  });
}


/* New custom commission (COMMISSION-CUSTOM). The design image is read here, in
   this browser, and goes nowhere: only the strips read off it are sent, and
   only when the order is made. The price comes from the server, dry-run. */
async function custom() {
  const bands = await import('/strip-bands.js');
  const nz = (n) => `NZD ${Number(n).toLocaleString('en-NZ')}`;
  main.innerHTML = `<p><a class="quiet" href="/mintwork/commissions">← All commissions</a></p>
    <h1>New custom commission</h1>
    <div class="detail">
      <div>
        <div class="box" style="margin-top:0;border:0;padding-top:0"><label>Design image<input type="file" id="img" accept="image/*"></label>
          <p class="grey" style="font-size:13px;margin:0">Read in this browser. The image itself goes nowhere.</p></div>
        <div id="cmp" class="box" hidden><p class="mono grey" style="margin:0">The image</p><canvas id="orig" style="max-width:100%"></canvas>
          <p class="mono grey" style="margin:0">The strips read off it</p><canvas id="back" style="max-width:100%"></canvas><p class="mono" id="match" style="margin:0"></p></div>
      </div>
      <form class="box" id="cu" style="margin-top:0" novalidate>
        <div class="two"><label>Length cm<input name="length_cm" type="number" min="80" max="600" step="10"></label><label>Width cm<input name="width_cm" type="number" min="10" max="120" step="10"></label></div>
        <div class="two"><label>Orientation<select name="orientation"><option>landscape</option><option>portrait</option></select></label>
          <label>Frame<select name="frame"><option value="none">none</option><option value="black">black</option><option value="white">white</option></select></label></div>
        <label>Delivery<select name="delivery"><option value="installed">installed by Sign Central</option><option value="collect">collect from The Line</option><option value="shipped">shipped worldwide</option></select></label>
        <p class="mono grey" style="margin:6px 0 0">Price as (empty: its real size)</p>
        <div class="two"><label>Length cm<input name="pa_length" type="number" min="80" max="600" step="10"></label><label>Width cm<input name="pa_width" type="number" min="10" max="120" step="10"></label></div>
        <label class="check" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-family:var(--font-sans);font-size:14px;color:var(--ink)"><input type="checkbox" name="rate"> A rate</label>
        <div id="ratebox" class="box" hidden style="margin-top:0;border:0;padding-top:0">
          <div class="two"><label>% off<input name="pct" type="number" min="1" max="90" value="40"></label><label>Name of the rate<input name="label" placeholder="Walk The Line"></label></div>
          <label>Building address<input name="building" autocomplete="off"></label></div>
        <div class="two"><label>Buyer name<input name="name" autocomplete="off"></label><label>Buyer email<input name="email" type="email" autocomplete="off"></label></div>
        <div class="two"><label>Hold days<input name="hold_days" type="number" min="1" max="60" value="14"></label><span></span></div>
        <label>Note (why)<textarea name="note" rows="2"></textarea></label>
        <p class="mono" id="price" style="margin:4px 0 0;color:var(--ink)"></p>
        <button class="btn" id="create" disabled>Create</button>
        <p class="say" id="cusay"></p>
        <div id="made" class="box" hidden></div>
      </form>
    </div>`;
  const f = document.getElementById('cu');
  const cusay = (m) => { document.getElementById('cusay').textContent = m; };
  let img = null; let strips = null; let match = 0; let priced = false; let timer = null;
  const num = (v) => (v === '' || v == null ? null : Number(v));
  const body = (dry) => ({
    action: 'custom', dry,
    spec: { length_cm: num(f.length_cm.value), width_cm: num(f.width_cm.value), orientation: f.orientation.value, frame: f.frame.value, delivery: f.delivery.value },
    strips: strips || undefined,
    priced_as: f.pa_length.value || f.pa_width.value ? { length_cm: num(f.pa_length.value), width_cm: num(f.pa_width.value) } : null,
    discount: f.rate.checked ? { pct: num(f.pct.value), label: f.label.value, building: f.building.value || null } : null,
    name: f.name.value || null, email: f.email.value || null, hold_days: num(f.hold_days.value), note: f.note.value,
  });
  const ready = () => { document.getElementById('create').disabled = !(priced && strips && match >= 0.98 && f.note.value.trim()); };
  /* past 240 cm a frame or shipping has no price: greyed out */
  const limits = () => {
    const long = num(f.length_cm.value) > 240;
    for (const o of f.frame.options) o.disabled = long && o.value !== 'none';
    for (const o of f.delivery.options) o.disabled = long && o.value === 'shipped';
    if (long && f.frame.value !== 'none') f.frame.value = 'none';
    if (long && f.delivery.value === 'shipped') f.delivery.value = 'installed';
  };
  async function price() {
    const out = document.getElementById('price');
    try {
      const { price: p } = await api('', body(true));
      out.textContent = `${p.list_nzd !== p.nzd ? `list ${nz(p.list_nzd)} → ` : ''}${nz(p.nzd)} · ${p.eth} ETH`;
      priced = true;
    } catch (err) { out.textContent = err.message; priced = false; }
    ready();
  }
  function extract() {
    if (!img) return;
    const widthMm = num(f.width_cm.value) * 10;
    const box = document.getElementById('cmp');
    if (!(widthMm >= 100)) { strips = null; box.hidden = true; return; }
    const r = bands.bandsOf(img, { widthMm, orientation: img.orientation });
    match = r.match;
    strips = match >= 0.98 ? r.strips : null;
    box.hidden = false;
    const w = Math.min(box.clientWidth || 520, 520);
    const h = (w * img.height) / img.width;
    const orig = document.getElementById('orig');
    orig.width = Math.round(w); orig.height = Math.round(h);
    orig.getContext('2d').drawImage(img.bitmap, 0, 0, orig.width, orig.height);
    paintStrips(document.getElementById('back'), r.strips, img.orientation === 'portrait', w, h);
    const total = r.strips.reduce((n, s) => n + s.mm, 0);
    document.getElementById('match').textContent = `${(match * 100).toFixed(1)}% of rows match · ${r.strips.length} strips · ${total} mm`
      + (match >= 0.98 ? '' : ' · under 98%: not close enough to make an order from');
  }
  document.getElementById('img').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    try {
      const bitmap = await createImageBitmap(file);
      const c = document.createElement('canvas'); c.width = bitmap.width; c.height = bitmap.height;
      const ctx = c.getContext('2d'); ctx.drawImage(bitmap, 0, 0);
      const orientation = bitmap.width >= bitmap.height ? 'landscape' : 'portrait';
      img = { data: ctx.getImageData(0, 0, c.width, c.height).data, width: c.width, height: c.height, orientation, bitmap };
      /* first guesses, at a pixel to a mm: 600 px across is 60 cm */
      const across = orientation === 'landscape' ? c.height : c.width;
      const along = orientation === 'landscape' ? c.width : c.height;
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      if (!f.width_cm.value) f.width_cm.value = clamp(Math.round(across / 100) * 10, 10, 120);
      if (!f.length_cm.value) f.length_cm.value = clamp(Math.round(along / 100) * 10, 80, 600);
      f.orientation.value = orientation;
      limits(); extract(); price();
    } catch (err) { cusay(`That image could not be read: ${err.message}`); }
  });
  f.addEventListener('input', (ev) => {
    if (ev.target.name === 'rate') document.getElementById('ratebox').hidden = !ev.target.checked;
    if (ev.target.name === 'length_cm') limits();
    if (ev.target.name === 'width_cm') extract();
    ready();
    clearTimeout(timer); timer = setTimeout(price, 300);
  });
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById('create');
    if (!confirm('Make this order? The buyer\'s link is shown once.')) return;
    btn.disabled = true;
    try {
      const j = await api('', body(false));
      btn.hidden = true;
      const made = document.getElementById('made');
      made.hidden = false;
      made.innerHTML = `<p style="margin:0"><a href="/mintwork/commissions/${esc(j.id)}">${esc(j.id)}</a> is made.</p>
        <label>Send this to the buyer<input id="madeurl" readonly value="${esc(j.link)}"></label><button type="button" class="btn" id="madecopy">Copy link</button>
        <p class="grey" style="font-size:13px;margin:0">This page won't show it again. If it's lost, use New pay link on the order.</p>`;
      document.getElementById('madecopy').addEventListener('click', async () => {
        const input = document.getElementById('madeurl'); input.select();
        try { await navigator.clipboard.writeText(input.value); cusay('Link copied'); } catch { cusay('Select the link and copy it'); }
      });
      cusay('');
    } catch (err) { cusay(err.message); btn.disabled = false; }
  });
  limits(); price();
}

function start() { (ID === 'new' ? custom() : ID ? detail(ID) : list()).catch((err) => { if (err.message !== 'sign in first') main.innerHTML = `<p>${esc(err.message)}</p>`; }); }
start();
</script>
</body>
</html>
