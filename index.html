<!-- The mark, at every size a browser asks for. The white cut serves on a
     dark scheme, which is also the tab icon once night is on. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-white-16.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-white-32.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-white-512.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- The reading choice, before the first pixel. The stylesheet defaults to
     prefers-color-scheme on its own, so this is only the override: the cookie
     both deploys share, or this browser's own note of it. Four lines, inline,
     because anything else paints the wrong theme first and corrects it. -->
<meta name="theme-color" content="#faf9f6">
<script>(function(){try{
var c=document.cookie.match(/(?:^|;\s*)mf_theme=(day|night)/),
    t=c?c[1]:localStorage.getItem('mf_theme');
if(t!=='day'&&t!=='night')t=null;
if(t)document.documentElement.setAttribute('data-theme',t);
var n=(t||(matchMedia('(prefers-color-scheme:dark)').matches?'night':'day'))==='night';
document.querySelector('meta[name="theme-color"]').setAttribute('content',n?'#1a1814':'#faf9f6');
}catch(e){}})();</script>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mintface.css">
<style>
/* ---------- hero ---------- */
.hero{padding:4px 28px 0;text-align:center;min-height:40vh;margin:12px 0 56px}
.hero a{display:block;text-decoration:none}
.hero .shot{display:inline-block;max-width:100%}
.hero img,.hero video{max-height:84vh;width:auto;margin:0 auto;opacity:0;transition:opacity .8s ease}
.hero img.in,.hero video.in{opacity:1}
/* A living SVG has no intrinsic size, only the ratio we hand it, and its
   container shrink wraps. So the width comes from the viewport rather than the
   parent, or the two wait on each other and it falls back to 300x150. */
.hero object.live{width:min(92vw,1500px);height:auto;max-height:84vh;margin:0 auto;display:block}
.hero object.live img{width:100%;height:100%;object-fit:contain}
.hero .cap{
  display:flex;gap:16px;justify-content:center;align-items:baseline;flex-wrap:wrap;
  margin-top:20px;font-family:var(--font-sans);font-weight:500;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.hero .cap .state{font-family:var(--font-mono);font-weight:400;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.hero .title{font-family:var(--font-sans);font-weight:400;font-size:21px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.hero a:hover .title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.hero .price{font-family:var(--font-mono);font-weight:400;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}

.wordmark-big{
  max-width:1500px;margin:0 auto;padding:66px 28px 0;
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
}
.wordmark-big h1{margin:0;line-height:0}
.wordmark-big h1 img{width:clamp(115px,21vw,260px);height:auto;display:block}
/* what the work has actually done, in the same register as the rest */
.figures{
  font-family:var(--font-mono);font-weight:400;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  font-variant-numeric:tabular-nums;line-height:2;margin-top:18px;max-width:420px;
}
.wordmark-big .sub{font-family:var(--font-sans);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);max-width:330px;line-height:2}

/* ---------- collections ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:44px 28px 40px}
/* the collections run is split either side of the hero, so the half above it
   closes up and the half below opens again */
.wrap-core{padding-bottom:0}
.wrap-rest{padding-top:0}
.group{margin:0 0 62px}
.group > h2{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:400;margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
}
.group > h2 a{text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
.group > h2 a:hover{color:var(--ink);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:34px}
.card{text-decoration:none;display:block}
.card .shot{background:var(--sunk);aspect-ratio:1/1;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.card img.in{opacity:1}
.card .t{font-family:var(--font-sans);font-weight:400;font-size:20px;line-height:1.25;margin-top:12px;letter-spacing:-.01em}
.card .m{font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;font-variant-numeric:tabular-nums}
.card .s{font-family:var(--font-sans);font-weight:400;font-size:14px;color:var(--ink-5);margin-top:8px;line-height:1.5}
.card:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.badge{border:1px solid var(--rule);padding:3px 8px}
.annex .cards{grid-template-columns:repeat(6,1fr);gap:24px}
/* ---------- justified rows ----------
   Nothing here is cropped: a row shares a height, each work keeps its ratio,
   and the widths are solved so the row fills the measure exactly. */
.rows{max-width:1500px;margin:0 auto;padding:0 28px}
.jrow{display:flex;margin-bottom:10px}
.jitem{display:block;text-decoration:none;flex:0 0 auto}
.jshot{background:var(--sunk);overflow:hidden}
.jitem img,.jitem video{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease}
.jitem img.in,.jitem video.in{opacity:1}
.jcap{
  font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.jitem:hover .jcap{color:var(--ink)}
.rows-more{max-width:1500px;margin:0 auto;padding:18px 28px 0}
.recent-rows,.strip-rows{margin:0 0 62px}
.strip-rows .bands{margin-bottom:0}
.recent-rows .wrap-head + .rows{margin-bottom:34px}
.recent-rows .rows + .wrap-head{margin-top:10px}
/* the hero and its three, stacked, each solved on its own */
.jcentre{justify-content:center}
/* the composed block: primary left, the stack right, one rectangle */
.cblock{display:flex;align-items:flex-start}
.ccol{display:flex;flex-direction:column}
.cprimary,.ccol{flex:0 0 auto}
/* on a phone it is simply one after another, primary first */
.block-stacked .jitem{display:block;width:100%;margin-bottom:14px}
.block-stacked .jshot{width:100%;height:auto}
.wrap-head{max-width:1500px;margin:0 auto;padding:0 28px}
.wrap-head h2{
  font-family:var(--font-sans);font-weight:500;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--rule);
}
/* Three main cards wide. Studies fit four small ones into that measure,
   Features fit two large ones, so both read as asides to the main run
   without either drifting off its own grid. */
.wrap{--gap:34px;--measure3:calc(75% - var(--gap) / 4)}
/* five studies now, still inside three column widths, so the thumbs step
   down rather than the row breaking out of the measure */
.studies .cards{grid-template-columns:repeat(5,1fr);gap:18px;max-width:var(--measure3)}
.studies .card .t{font-size:14.5px;margin-top:9px;line-height:1.3}
.studies .card .s{display:none}
.studies .card .m{font-size:9px;gap:7px}

/* ---------- folded groups ----------
   Studies, Features, the Vault and the Archive open as a line rather than a
   wall. The name is the control, in the same small-caps register the filter
   rows and the work-page tabs use, so it needs no chevron to say it is one.
   Nothing is remembered between visits: the page always opens folded. */
.fold{border-top:1px solid var(--rule);padding:0}
.fold-head{
  display:flex;align-items:baseline;gap:10px;width:100%;
  background:none;border:0;padding:20px 0;cursor:pointer;text-align:left;
  font-family:var(--font-sans);font-weight:500;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.fold-head:hover,.fold-head:focus-visible{color:var(--ink)}
.fold-head .nm{border-bottom:1px solid transparent;padding-bottom:2px}
.fold-head:hover .nm,.fold-head:focus-visible .nm{border-bottom-color:var(--ink)}
.fold-head .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--faint);font-variant-numeric:tabular-nums}
.fold-head[aria-expanded="true"]{color:var(--ink)}
.fold-body[hidden]{display:none}
.fold-body{padding-bottom:34px}

.feature .cards{grid-template-columns:repeat(2,1fr);gap:var(--gap);max-width:var(--measure3)}
/* The Geodetic set reads as two full rows of three rather than four and a
   remainder. measure3 is the width four cards already occupy, so three laid
   inside it are the same size as the main collections' ... same card, fewer
   per row. Illusions is not pulled up from Studies to fill anything. */
.geo .cards{grid-template-columns:repeat(3,1fr);gap:var(--gap);max-width:var(--measure3)}
.feature .card .t{font-size:26px;margin-top:14px}
.feature .card .s{font-size:15px}

/* the vault shows work rather than a card about work, on the same measure as
   the other two asides */
.vault .cards{grid-template-columns:repeat(4,1fr);gap:24px;max-width:var(--measure3)}
.vault .card .shot{background:var(--sunk)}
.vault .card .t{font-size:16px;margin-top:10px}
.vault .card .m{font-size:9.5px;gap:9px}

@media(max-width:1200px){
  .studies .cards,.feature .cards,.vault .cards,.geo .cards{max-width:100%}
}
@media(max-width:820px){
  .studies .cards{grid-template-columns:repeat(2,1fr)}
  .feature .cards{grid-template-columns:repeat(2,1fr)}
  .vault .cards{grid-template-columns:repeat(2,1fr)}
}
.annex .card .t{font-size:19px}
.annex .card .s{display:none}

@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.annex .cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr);gap:22px}.annex .cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){
  .hero{padding:0}
  .hero img,.hero video{max-height:none;width:100%}
  /* the viewport width still leads here; only the height cap is lifted */
  .hero object.live{max-height:none;height:auto}
  .hero .cap{padding:0 20px}
  .wordmark-big{padding:44px 20px 0}
  .wrap{padding:32px 20px 30px}
  .cards,.annex .cards{grid-template-columns:repeat(2,1fr);gap:18px}
}
</style>
</head>
<body>

<header class="nav" id="nav"></header>

<main id="main"></main>

<footer class="foot">
  <a class="smallcaps" href="/exhibitions">Exhibitions</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="/vault">The Vault</a>
  <a class="smallcaps" href="/strip-painting-maker">Strip Painting Maker</a>
  <a class="smallcaps" href="/claim">Receive your artwork</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
  <a class="smallcaps" href="/studio">Studio</a>
  <div class="sig">MintFace &middot; 39.64&deg;S 176.85&deg;E</div>
</footer>

<script src="/mintface.js"></script>
<script>
const e = MF.escape;
// rates held here so the hero can be written in the read currency first time
let HERO_FX = {};

// Two pools, taking turns. A collected work is worth showing for the collector
// as much as the art, so it gets its own caption.
const POOL_KEY = 'mf_hero_pool';

function nextPool(home) {
  const collected = home.hero_collected || [];
  const available = home.hero_available || [];
  if (!collected.length && !available.length) return null;
  if (!collected.length) return 'available';
  if (!available.length) return 'collected';
  try {
    const last = localStorage.getItem(POOL_KEY);
    const pick = last === 'available' ? 'collected' : 'available';
    localStorage.setItem(POOL_KEY, pick);
    return pick;
  } catch {
    return Math.random() < 0.5 ? 'collected' : 'available';
  }
}

const shuffled = (list) => [...list].sort(() => Math.random() - 0.5);

// a hero has to still be what the pool says it is: work sells, and the state
// overlay knows before the curated list does
const stillFits = (work, pool) => (pool === 'available'
  ? work.status === 'available'
  : work.status === 'acquired' || work.status === 'vaulted');

async function fromPool(home, pool) {
  const ids = shuffled(pool === 'available' ? (home.hero_available || []) : (home.hero_collected || []));
  for (const id of ids.slice(0, 6)) {
    const hit = await MF.work(id);
    if (hit && stillFits(hit.work, pool)) return { ...hit, pool };
  }
  return null;
}

function heroMarkup(work, collection, pool) {
  const title = /^#?\d+$/.test((work.title || '').trim())
    ? `${collection.title} ${work.title.startsWith('#') ? work.title : '#' + work.title}`
    : (work.title || 'Untitled');

  let tail;
  if (pool === 'collected') {
    if (work.status === 'vaulted') {
      // the vault is not a collector, and says so in its own words
      tail = '<span class="state"><span class="dot vaulted"></span> Vaulted</span>';
    } else {
      /* Named but not linked: the whole hero is already a link to the work,
         and a link inside a link is not a thing a browser can draw. The
         attribution under the title on the work page is where it leads. */
      const name = MF.collectorName(work.collector) || (work.physical && work.physical.collector);
      tail = name ? `<span class="state">Collected by ${e(name)}</span>` : '<span class="state">Collected</span>';
    }
  } else {
    const st = MF.STATUS[work.status] || { label: work.status, dot: '' };
    const offers = work.offers || {};
    const p = work.pricing_nzd || {};
    // a work listed in ETH shows the figure it is listed in
    let price = null;
    let priceNzd = null;
    if (work.priced_in === 'ETH' && work.pricing_eth && work.pricing_eth.digital != null && offers.digital) {
      price = `${work.pricing_eth.digital} ETH`;
    } else {
      const nzd = offers.both && p.both != null ? p.both
        : offers.painting && p.painting != null ? p.painting
        : offers.digital && p.digital != null ? p.digital
        : null;
      if (nzd != null) priceNzd = nzd;
    }
    tail = `<span class="state"><span class="dot ${st.dot}"></span> ${e(st.label)}</span>`
      + (priceNzd != null
        // the code sits with the figure, so nobody has to guess whose dollars
        ? `<span class="price" data-nzd="${priceNzd}">${e(MF.money(priceNzd, MF.currency(), HERO_FX) || '')}</span>`
        : price ? `<span class="price">${e(price)}</span>` : '');
  }

  return `<a href="/w/${encodeURIComponent(work.id)}">
    <div class="shot">${MF.heroMedia(work, { width: 1600, alt: title })}</div>
    <div class="cap">
      <span class="title">${e(title)}</span>
      <span>${e(collection.title)}</span>
      ${tail}
    </div>
  </a>`;
}

// Two runs: the paintings, then the pixel paintings. Nineteen works at the
// height they run on /recent would bury the collections, so the rows are
// shorter here.
async function fillRecent() {
  const section = document.getElementById('recentSection');
  const heads = section ? [...section.querySelectorAll('.wrap-head')] : [];
  let col = null;
  try { col = await MF.collection('recent-work'); } catch { /* nothing published yet */ }
  const works = (col && col.works) || [];
  if (!works.length) { if (section) section.remove(); return; }

  // The four that carry the set here. The rest are on /recent; this is a
  // highlight, not an index.
  const PIXEL_PICK = ['adoration-of-the-pixel-3', 'golden-axe-pixel-arcade', 'lunar-lander-and-breakout', 'wonder-boy-pixel-arcade'];
  const PIXEL_HERO = 'adoration-of-the-pixel-3';

  // Under a PixelArcade heading, repeating PixelArcade in every caption says
  // nothing. Display only: the work's own page keeps its canonical title.
  const shortTitle = (w) => ({
    ...w,
    title: (w.title || '').replace(/\s*pixel\s*arcade\s*/gi, ' ').replace(/\s{2,}/g, ' ').trim() || w.title,
  });

  const paintings = works.filter((w) => (w.group || 'painting') === 'painting');
  const pixel = PIXEL_PICK
    .map((id) => works.find((w) => w.id === id))
    .filter(Boolean)
    .map(shortTitle);

  const paintingsEl = document.getElementById('recentRows');
  if (!paintings.length) { if (paintingsEl) paintingsEl.remove(); if (heads[0]) heads[0].remove(); }
  else {
    // taller rows and fewer to a row: these are paintings, to be looked at
    MF.paintRows(paintingsEl, paintings, { target: 300, targetSmall: 190, gutter: 10, maxPerRow: 5 });
  }

  const pixelEl = document.getElementById('pixelRows');
  if (!pixel.length) { if (pixelEl) pixelEl.remove(); if (heads[1]) heads[1].remove(); return; }
  const hero = pixel.find((w) => w.id === PIXEL_HERO) || pixel[0];
  const rest = pixel.filter((w) => w !== hero);
  // the portrait carries the height on the left, the three strips stack on its
  // right, and the four make one rectangle
  MF.paintComposed(pixelEl, hero, rest, { gutter: 10, stackBelow: 760 });
}

/* The site designs, in order, as the bands they are.
 *
 * One per site, full measure, stacked ... which is how they stand on a street
 * and the only shape that reads at four to one. Ordered by site number, so a
 * design that has not been rendered yet is simply not here and the ones that
 * follow it keep their place. */
async function fillStrips() {
  const section = document.getElementById('stripSection');
  let col = null;
  try { col = await MF.collection('strip-paintings'); } catch { /* nothing published yet */ }
  const bands = ((col && col.works) || [])
    .filter((w) => w.group === 'site-design')
    .sort((a, b) => (a.site || 0) - (b.site || 0));
  if (!bands.length) { if (section) section.remove(); return; }
  MF.stripBands(document.getElementById('stripBands'), bands);
}

async function fillVault() {
  const el = document.getElementById('vaultCards');
  if (!el) return;
  const works = await MF.vaultPreview(4);
  const section = document.getElementById('vaultSection');
  if (!works.length) { if (section) section.remove(); return; }
  el.innerHTML = works.map((w) => MF.vaultTile(w)).join('');
}

async function hero(home, idx) {
  const el = document.getElementById('hero');
  /* The rate, and the names chosen since the catalogue was built. Both are
     small, both are wanted before the hero draws, and neither is worth a
     redraw ... a collector who set a name this morning should be named on the
     front page this morning, not after a flicker. */
  try { HERO_FX = await MF.fx(); } catch { /* the figure falls back to nothing */ }
  await MF.names().catch(() => ({}));

  const first = nextPool(home);
  if (first) {
    // if the available pool has sold out, the collected pool carries the page
    const order = first === 'available' ? ['available', 'collected'] : ['collected', 'available'];
    for (const pool of order) {
      const hit = await fromPool(home, pool);
      if (hit) { el.innerHTML = heroMarkup(hit.work, hit.collection, pool); return; }
    }
  }

  // nothing curated yet: a collection cover stands in, clearly provisional
  const covers = idx.collections.filter((c) => c.display !== false && c.cover && c.cover.image && c.counts.available && c.group !== 'archive');
  if (!covers.length) { el.remove(); return; }
  const c = covers[Math.floor(Math.random() * covers.length)];
  const hit = await MF.work(c.cover.id);
  if (hit) el.innerHTML = heroMarkup(hit.work, hit.collection, 'available');
  else el.remove();
}

(async function () {
  try {
    const [home, idx] = await Promise.all([
      fetch('/data/f/home.json').then((r) => r.json()).catch(() => ({ hero: [] })),
      MF.index(),
    ]);

    const groups = MF.groupsWithCollections(idx);
    const works = idx.collections.filter((c) => c.display !== false).reduce((n, c) => n + (c.counts.works || 0), 0);

    // The page reads: the newest work, then the collections, then the hero as a
    // breath in the middle, then the geodetic set and the asides.
    const section = (g) => {
      const annex = g.id === 'archive';
      const setLink = g.id === 'geodetic' ? '<a class="smallcaps" href="/geodetic">The set as one page</a>' : '';
      // the contextual groups open as a line and expand when asked. The living
      // edge and the canon keep their space; these promise their size instead.
      const FOLDS = { studies: true, feature: true, vault: true, archive: true };
      const cls = g.id === 'studies' ? 'studies' : g.id === 'feature' ? 'feature' : g.id === 'geodetic' ? 'geo' : (annex ? 'annex' : '');

      if (g.id === 'vault') {
        // the vault's own count, not the number of cards previewed inside it
        const held = (g.collections[0] && g.collections[0].counts
          && (g.collections[0].counts.works || g.collections[0].counts.unique_works)) || 0;
        const body = `<div class="cards" id="vaultCards"></div>
          <div class="rows-more"><a class="smallcaps" href="/vault">Everything held</a></div>`;
        return foldable(g, held, 'group vault', body, 'vaultSection');
      }
      const body = `<div class="cards">${g.collections.map((c) => MF.collectionCard(c)).join('')}</div>`;
      if (FOLDS[g.id]) return foldable(g, g.collections.length, `group ${cls}`, body);
      return `<section class="group ${cls}">
        <h2>${e(g.title)}${setLink}</h2>
        ${body}
      </section>`;
    };
    // the count is the point of a folded row: the name promises something
    const foldable = (g, count, cls, body, id) => `<section class="${cls} fold"${id ? ` id="${id}"` : ''}>
      <button type="button" class="fold-head" aria-expanded="false" data-fold="${e(g.id)}">
        <span class="nm">${e(g.title)}</span><span class="n">&middot; ${count}</span>
      </button>
      <div class="fold-body" id="fold-${e(g.id)}" hidden>${body}</div>
    </section>`;

    const pick = (id) => groups.find((g) => g.id === id);
    const core = pick('core');
    const geodetic = pick('geodetic');
    const rest = groups.filter((g) => !['core', 'geodetic'].includes(g.id));

    document.getElementById('main').insertAdjacentHTML('beforeend', `
      <section class="group strip-rows" id="stripSection">
        <div class="wrap-head"><h2>Strip Paintings</h2></div>
        <div class="bands" id="stripBands"></div>
        <div class="rows-more"><a class="smallcaps" href="/c/strip-paintings">The strip paintings</a></div>
      </section>

      <section class="group recent-rows" id="recentSection">
        <div class="wrap-head"><h2>Recent Paintings</h2></div>
        <div class="rows" id="recentRows"></div>
        <div class="wrap-head"><h2>PixelArcade paintings</h2></div>
        <div class="rows" id="pixelRows"></div>
        <div class="rows-more"><a class="smallcaps" href="/recent">All recent work</a></div>
      </section>

      <div class="wordmark-big">
        <h1
          ><img class="mark-day" src="/assets/MintFace-Logo-Black.png"
            alt="MintFace" width="1450" height="380"
          ><img class="mark-night" src="/assets/MintFace-Logo-White.png"
            alt="MintFace" width="1450" height="380"></h1>
        <div class="sub">
          ${works.toLocaleString('en-NZ')} works on record<br>
          Painting, photography, AI and code<br>
          New Zealand
        </div>
        <div class="figures">${MF.escape(MF.SALES_LINE)}</div>
      </div>

      ${core ? `<div class="wrap wrap-core">${section(core)}</div>` : ''}

      <div class="hero" id="hero"></div>

      <div class="wrap wrap-rest">
        ${geodetic ? section(geodetic) : ''}
        ${rest.map(section).join('')}
      </div>`);

    document.querySelectorAll('.fold-head').forEach((b) => b.addEventListener('click', () => {
      const body = document.getElementById(`fold-${b.dataset.fold}`);
      const open = b.getAttribute('aria-expanded') === 'true';
      b.setAttribute('aria-expanded', String(!open));
      body.hidden = open;
      if (!open) MF.progress.watch(body);
    }));

    await hero(home, idx);
    await fillStrips();
    await fillRecent();
    await fillVault();
    MF.progress.watch(document.getElementById('main'));
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="loading">Could not load</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
