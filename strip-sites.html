<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strip Paintings, the sites ... MintFace</title>
<meta name="robots" content="noindex">
<meta name="description" content="Strip Painting sites on Heretaunga Street West and King Street, Hastings.">
<!-- The mark, at every size a browser asks for. The white cut serves on a
     dark scheme, which is also the tab icon once night is on. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-white-16.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-white-32.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-white-512.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- The reading choice, before the first pixel. The stylesheet defaults to
     prefers-color-scheme on its own, so this is only the override: the cookie
     both deploys share, or this browser's own note of it. Four lines, inline,
     because anything else paints the wrong theme first and corrects it. -->
<meta name="theme-color" content="#faf9f6">
<script>(function(){try{
var c=document.cookie.match(/(?:^|;\s*)mf_theme=(day|night)/),
    t=c?c[1]:localStorage.getItem('mf_theme');
if(t!=='day'&&t!=='night')t=null;
if(t)document.documentElement.setAttribute('data-theme',t);
var n=(t||(matchMedia('(prefers-color-scheme:dark)').matches?'night':'day'))==='night';
document.querySelector('meta[name="theme-color"]').setAttribute('content',n?'#1a1814':'#faf9f6');
}catch(e){}})();</script>
<link rel="stylesheet" href="/mintface.css">
<style>
.sites{max-width:1440px;margin:0 auto;padding:48px 40px 96px}
.sites h1{font-family:var(--font-sans);font-weight:600;font-size:40px;letter-spacing:-.02em;margin:0 0 12px}
.sites .count{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;color:#6B6A64;margin:0 0 20px}
.sites .count .scroll{display:none}
.plan{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#F8F7F3}
.plan svg{display:block;width:100%;max-width:1360px;height:auto}
.register{width:100%;border-collapse:collapse;margin-top:48px;font-family:var(--font-mono);font-size:13px;letter-spacing:.04em}
.register th{text-align:left;font-weight:400;color:#6B6A64;padding:10px 16px 10px 0;border-bottom:1px solid var(--ink)}
.register td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.register tr.is-lit td{background:var(--sunk)}
@media (max-width:760px){
  .sites{padding:32px 0 64px}
  .sites h1,.sites .count{padding:0 20px}
  .sites .count .scroll{display:inline}
  .plan svg{width:1360px;max-width:none}
  .register{display:block;overflow-x:auto;padding:0 20px;box-sizing:border-box}
}
</style>
</head>
<body>
<main class="sites">
  <h1>WestSide Hastings.</h1>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="plan" id="plan"></div>
  <table class="register" id="register" aria-label="Every Strip Painting site">
    <thead><tr><th>NO</th><th>ADDRESS</th><th>BUILDING</th><th>SIZE</th><th>STATUS</th><th>SPECIMENS</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<script src="/mintface.js"></script>
<script type="module">
/* Slice 1 of the Strip Paintings rebuild (docs/STRIP-MAP.md): the sites, the
   counts and the plan, all from /api/strip-sites. Slice 2 folds this into
   the collection page. */
import { planSVG, wirePlan, countLine, registerRows } from '/strip-plan.js';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const data = await fetch('/api/strip-sites').then((r) => r.json());
const sites = data.sites;
document.getElementById('count').innerHTML = `${esc(countLine(sites))}<span class="scroll"> \u00b7 SCROLL \u2192</span>`;
const plan = document.getElementById('plan');
plan.innerHTML = planSVG(sites);
wirePlan(plan);
document.querySelector('#register tbody').innerHTML = registerRows(sites).map((r) => `<tr id="site-${Number(r.no)}" data-site-no="${Number(r.no)}">
  <td>${esc(r.no)}</td><td>${esc(r.address)}</td><td>${esc(r.building)}</td><td>${esc(r.size || '')}</td><td>${esc(r.status)}</td><td>${esc(r.specimens)}</td></tr>`).join('');
</script>
</body>
</html>
