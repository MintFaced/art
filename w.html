<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MintFace</title>
<meta name="description" content="Work by MintFace.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="MintFace">
<!-- The mark, at every size a browser asks for. The white cut serves on a
     dark scheme, which is also the tab icon once night is on. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-white-16.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-white-32.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-white-512.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- The reading choice, before the first pixel. The stylesheet defaults to
     prefers-color-scheme on its own, so this is only the override: the cookie
     both deploys share, or this browser's own note of it. Four lines, inline,
     because anything else paints the wrong theme first and corrects it. -->
<meta name="theme-color" content="#faf9f6">
<script>(function(){try{
var c=document.cookie.match(/(?:^|;\s*)mf_theme=(day|night)/),
    t=c?c[1]:localStorage.getItem('mf_theme');
if(t!=='day'&&t!=='night')t=null;
if(t)document.documentElement.setAttribute('data-theme',t);
var n=(t||(matchMedia('(prefers-color-scheme:dark)').matches?'night':'day'))==='night';
document.querySelector('meta[name="theme-color"]').setAttribute('content',n?'#1a1814':'#faf9f6');
}catch(e){}})();</script>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mintface.css">
<style>
/* ---------- image ---------- */
/* the art takes the same column as the words, so the page has one measure */
.stage{padding:6px 28px 0}
.stage .frame{display:block;max-width:var(--measure);margin:0 auto}
.stage img,.stage video{
  width:100%;height:auto;max-height:88vh;object-fit:contain;margin:0 auto;
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}
/* an SVG work runs live, so it needs a box to run in */
.stage object.live{
  display:block;width:100%;aspect-ratio:2/1;margin:0 auto;
}
.motion{margin-top:16px}
.ghost{
  background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;
  padding:11px 22px;font-family:var(--font-sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
.motion-frame iframe{width:min(900px,100%);height:min(70vh,640px);border:1px solid var(--rule);background:var(--sunk)}
.motion-frame video{max-height:70vh}
.motion-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}

/* ---------- column ---------- */
:root{--measure:624px}   /* 680 column less its 28px gutters, so art and text line up */
.col{max-width:680px;margin:0 auto;padding:54px 28px 120px}
h1{
  font-family:var(--font-sans);font-weight:400;
  font-size:clamp(34px,5.2vw,52px);line-height:1.08;
  margin:0 0 6px;letter-spacing:-.005em;
}
.byline{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}
.byline a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.byline a:hover{border-color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin-bottom:0}
.tab{font-family:var(--font-sans);font-weight:500;
  background:none;border:0;padding:0 0 12px;cursor:pointer;
  font-family:var(--font-sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);position:relative;
}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--ink);
}
.panel{padding:26px 0 0}
.panel[hidden]{display:none}
.statement{font-family:var(--font-sans);font-weight:400;font-size:17px;line-height:1.6;color:var(--ink-3);margin:0;white-space:pre-line}

/* ---------- detail rows ---------- */
.rows{width:100%;border-collapse:collapse}
.rows tr{border-bottom:1px solid var(--rule)}
.rows tr:last-child{border-bottom:0}
.rows th{font-family:var(--font-sans);font-weight:500;
  text-align:left;font-weight:400;padding:13px 0;width:38%;vertical-align:top;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.rows td{padding:13px 0;vertical-align:top;font-size:13px;font-family:var(--font-mono);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.75}
.rows td.mono{font-size:11.5px;word-break:break-all;line-height:1.9}

.rows.traits th{width:52%}
.rows.traits td{text-align:right;font-size:12.5px}
.swatch{
  display:inline-block;width:9px;height:9px;margin-right:8px;
  border:1px solid var(--rule);vertical-align:baseline;
}

/* ---------- fold ---------- */
details{border-top:1px solid var(--rule)}
details summary{
  list-style:none;cursor:pointer;padding:15px 0;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-family:var(--font-mono);font-size:13px;color:var(--faint)}
details[open] summary::after{content:'–'}
details summary:hover{color:var(--ink)}
.fold-body{padding:0 0 20px}
.fold-body p{margin:0 0 10px;font-size:14px;color:var(--ink-4)}
.chain-links{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
.chain-links a{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
.chain-links a:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- marketplace / verification ---------- */
/* Fine print. It sits under Acquire and never competes with it: the marks are
   the hairline grey of the table rules, and only the hover admits any ink. */
.market-row{display:flex;flex-wrap:wrap;gap:26px;margin-top:26px;padding-top:16px;border-top:1px solid var(--rule)}
.market-row a{display:inline-flex;align-items:center;gap:8px;color:var(--mark);text-decoration:none;transition:color .18s ease}
.market-row a:hover,.market-row a:focus-visible{color:var(--ink)}
.market-row svg{width:16px;height:16px;flex:none;fill:currentColor}
.onchain{display:flex;flex-direction:column;gap:3px;margin-top:14px;padding:12px 14px;border:1px solid var(--rule);text-decoration:none;transition:border-color .18s ease}
.onchain:hover,.onchain:focus-visible{border-color:var(--ink)}
/* when the listing leads it takes the emphasis the acquire button usually has,
   and the acquire button steps back to being the second way in */
.onchain.lead{margin-top:0;background:var(--ink);border-color:var(--ink)}
.onchain.lead .w{color:var(--paper)}
.onchain.lead .s{color:rgba(250,249,246,.72)}
.onchain.lead:hover{background:var(--ink-3)}
.btn.quiet{margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.quiet:hover{background:transparent;border-color:var(--ink)}
.onchain .w{font-family:var(--font-sans);font-weight:500;font-size:12.5px;letter-spacing:.02em;color:var(--ink)}
.onchain .s{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.market-row .lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:currentColor}

/* ---------- acquire ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.28);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);
  transform:translateX(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column;box-shadow:-1px 0 0 var(--rule);
}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:baseline;padding:24px 28px 0}
.sheet .close{background:none;border:0;cursor:pointer;font-family:var(--font-mono);font-size:16px;color:var(--muted);padding:0;line-height:1}
.sheet .close:hover{color:var(--ink)}
.sheet .body{padding:22px 28px 40px;overflow-y:auto;flex:1}
.sheet h2{font-family:var(--font-sans);font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 4px}
.sheet .which{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
/* the collection name, linked as it is under the title on the page behind */
.sheet .which a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.sheet .which a:hover{border-color:var(--ink)}
.step{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 12px}
.choice{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;
  background:none;border:1px solid var(--rule);cursor:pointer;padding:15px 16px;margin-bottom:9px;
  font-family:var(--font-sans);text-align:left;color:var(--ink);
}
.choice:hover{border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.choice .what{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.choice .amt{font-family:var(--font-mono);font-weight:400;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
/* what the fee is, said once, quietly, beside what it is added to */
.choice .add{
  display:block;font-family:var(--font-mono);font-weight:400;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin-top:5px;font-variant-numeric:tabular-nums;
}
.choice .sub{display:block;font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.choice[aria-pressed="true"] .sub{color:rgba(250,249,246,.7)}
.sheet .go{margin-top:8px}
.sheet .note{font-size:12px;color:var(--muted);line-height:1.7;margin:16px 0 0}
.sheet input{
  width:100%;padding:13px 14px;border:1px solid var(--rule);background:transparent;
  font-family:var(--font-sans);font-size:14px;color:var(--ink);margin-bottom:9px;border-radius:0;
}
.sheet input:focus{outline:none;border-color:var(--ink)}
.sheet .err{font-size:12px;color:var(--alert);margin-top:12px}
.sheet .ok{font-family:var(--font-mono);font-weight:400;font-size:17px;line-height:1.45;color:var(--ink-3);font-variant-numeric:tabular-nums}
.held{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-top:1px solid var(--rule);margin-top:18px;padding-top:12px;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.held.stale{color:var(--alert)}
.held button{
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-sans);font-weight:500;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--rule);
}
.held button:hover{border-color:var(--ink)}
.mono-line{font-family:var(--font-mono);font-size:11.5px;word-break:break-all;color:var(--muted);line-height:1.9}
@media(max-width:560px){.sheet{width:100%}}

/* ---------- pricing ---------- */
.pricing{margin-top:46px;border-top:1px solid var(--ink);padding-top:20px}
.pricing-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pricing-head .smallcaps{color:var(--ink)}

.price-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule)}
.price-row:last-of-type{border-bottom:0}
.price-row .what{font-family:var(--font-sans);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.price-row .amount{font-family:var(--font-mono);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.converted{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums}
.framed-note{
  font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-top:12px;font-variant-numeric:tabular-nums;
}
.poa{font-family:var(--font-sans);font-size:22px;color:var(--muted);padding:8px 0}

/* ---------- action ---------- */
.action{margin-top:34px}
.btn{
  display:block;width:100%;padding:19px 20px;background:var(--ink);color:var(--paper);
  border:0;cursor:pointer;font-family:var(--font-sans);
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:center;text-decoration:none;
}
.btn:hover{background:var(--ink-3)}
/* who holds it, directly under the byline it belongs with */
.collected{margin-top:12px;margin-bottom:26px}
.collected .who{
  font-family:var(--font-mono);font-weight:400;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
/* the attribution links out to the collector's page. Ink, underlined on hover,
   nothing louder than the line it sits in */
.collected .who a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.collected .who a:hover{border-color:var(--ink)}
.collected .when{
  font-family:var(--font-mono);font-weight:400;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-variant-numeric:tabular-nums;margin-top:4px;
}

.state{display:flex;align-items:baseline;gap:10px;padding:18px 0;border-top:1px solid var(--rule)}
.state .word{font-family:var(--font-mono);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.state .sub{font-family:var(--font-mono);font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-family:var(--font-sans);font-weight:400;font-size:16px;line-height:1.55;color:var(--ink-3);margin:12px 0 0}
.holders{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.9}
/* one row per holder, so a name can be swapped for a linked one in place */
.holders .hold{display:inline}
.holders a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.holders a:hover{color:var(--ink);border-color:var(--ink)}


/* ---------- notes ---------- */
/* A row in the Details table, so it wears the table's language: the label in
   sans on the left, the value on the right, one hairline underneath. The note
   itself is the exception ... it is prose, and prose in tabular mono is a
   receipt. Everything around it stays mono and small. */
.nt-row th{vertical-align:top}
.nt-by .nt-who{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.nt-by .nt-who:hover{border-color:var(--ink)}
.nt-row .nt-act{display:block;margin-top:6px;font-family:var(--font-mono);font-weight:400;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.nt-row .nt-act button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;
  text-transform:inherit;color:var(--faint);cursor:pointer}
.nt-row .nt-act button:hover{color:var(--ink)}
.nt-row td{font-family:var(--font-sans);font-size:13px}
.nt{padding:0 0 2px}
.nt + .nt{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
.nt p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14px;line-height:1.65;color:var(--ink-3)}
.nt-by{margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);line-height:1.8}
.nt.own{border-left:1px solid var(--rule);margin-left:-13px;padding-left:12px}
.nt-acts{margin-top:6px;display:flex;gap:14px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase}
.nt-acts button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;
  text-transform:inherit;color:var(--faint);cursor:pointer}
.nt-acts button:hover{color:var(--ink)}
.nt-all{display:block;margin-top:12px;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.nt-all:hover{color:var(--ink)}

/* the value becomes the editor, in place */
.nt-edit textarea{width:100%;min-height:88px;resize:vertical;background:transparent;
  border:1px solid var(--rule);color:var(--ink);padding:10px 11px;
  font-family:var(--font-sans);font-size:14px;line-height:1.6}
.nt-edit textarea:focus{outline:none;border-color:var(--mark)}
.nt-edit-foot{display:flex;align-items:center;gap:16px;margin-top:9px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.nt-edit-foot label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;letter-spacing:inherit}
.nt-edit-foot .nt-count{margin-left:auto;font-variant-numeric:tabular-nums}
.nt-edit-foot .nt-count.over{color:var(--alert)}
.nt-go{background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;padding:6px 12px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.nt-go:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.nt-go:disabled{opacity:.45;cursor:default}
.nt-say{margin-top:9px;font-family:var(--font-mono);font-size:10.5px;line-height:1.7;color:var(--muted)}
.nt-say.bad{color:var(--alert)}

/* former collectors, in the provenance fold where their tenure already lives */
.nt-prov{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.nt-prov-head{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-bottom:12px}

@media(max-width:640px){
  .stage{padding:2px 20px 0}
  .stage img,.stage video{max-height:none;width:100%}
  .col{padding:38px 20px 90px}
  .rows th{font-family:var(--font-sans);font-weight:500;width:44%}
}
</style>
</head>
<!-- the work is the first thing on this page and very nearly the height of
     the screen, so the nav stays in the flow rather than shaving the top off a
     painting as it goes past. See body[data-nav="flow"] in mintface.css. -->
<body data-nav="flow">

<header class="nav" id="nav"></header>

<main id="main"><div class="loading">Loading</div></main>

<footer class="foot">
  <a class="smallcaps" href="/exhibitions">Exhibitions</a>
  <a class="smallcaps" href="/provenance">Provenance</a>
  <a class="smallcaps" href="/claim">Receive your artwork</a>
  <a class="smallcaps" href="mailto:ryan@mintface.art">Contact</a>
  <a class="smallcaps" href="/studio">Studio</a>
  <div class="sig">MintFace &middot; 39.64&deg;S 176.85&deg;E</div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true" aria-label="Acquire">
  <header>
    <span class="smallcaps">Acquire</span>
    <button class="close" id="sheetClose" aria-label="Close">&times;</button>
  </header>
  <div class="body" id="sheetBody"></div>
</aside>

<script src="/mintface.js"></script>
<script>
const e = MF.escape;

function workId() {
  const m = location.pathname.match(/^\/w\/(.+?)\/?$/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('id') || '';
}

// preview aid: /w/{id}?px=2400,9800,11500 fills digital,painting,both until Ryan overlays real prices
function previewPrices() {
  const px = new URLSearchParams(location.search).get('px');
  if (!px) return null;
  const [digital, painting, both] = px.split(',').map((n) => (n === '' ? null : Number(n)));
  return { digital: digital ?? null, painting: painting ?? null, both: both ?? null };
}

function detailRows(work, collection) {
  const d = work.digital || {};
  const p = work.physical || {};
  const rows = [];
  const st = MF.STATUS[work.status] || { label: work.status, dot: '' };

  /* The pre-chain state, said where availability would be. Same copy family as
     an uninscribed work's ... what is true now, not what is missing. */
  if (isGallery(work)) rows.push(['Status', '<span class="pending">Not yet tokenized</span>']);
  else rows.push(['Availability', `<span class="dot ${st.dot}"></span> ${e(st.label)}`]);

  const year = MF.year(work, collection);
  if (year) rows.push(['Year', e(year)]);
  const medium = work.medium || collection.medium;
  if (medium) rows.push(['Medium', e(medium)]);
  if (work.derivative_of) rows.push(['After', e(work.derivative_of)]);
  if (work.meme_card) rows.push(['Meme card', e([work.meme_card, work.meme_season ? 'season ' + work.meme_season : null].filter(Boolean).join(' ... '))]);
  if (work.sequence) rows.push(['Sequence', e(work.sequence)]);
  if (work.keyword || work.age) rows.push(['Motif', e([work.keyword, work.age].filter(Boolean).join(' ... '))]);
  if (d.chain === 'bitcoin' && d.inscribed === false) rows.push(['Inscription', '<span class="pending">Not yet inscribed</span>']);
  if (d.minted === false) rows.push(['Provenance', 'Tokenized on purchase']);
  // said plainly, because a buyer who checks the chain will find the token
  // somewhere other than the artist's wallet and deserves to know why
  if (String((work.listing || {}).venue || '').toLowerCase() === 'foundation') {
    rows.push(['Token', 'Held in Foundation escrow until transfer']);
  }

  const dims = [p.width_cm, p.height_cm].filter(Boolean);
  if (dims.length === 2) {
    const depth = p.depth_cm ? ` \u00d7 ${p.depth_cm}` : '';
    rows.push(['Dimensions', `${dims.join(' \u00d7 ')}${depth} cm`]);
  } else if (dims.length === 1) {
    // half a measurement written as a pair reads as a square it is not
    rows.push(['Dimensions', `${p.width_cm ? `${p.width_cm} cm wide` : `${p.height_cm} cm high`}`]);
  } else if (collection.physical && p.exists !== false) {
    rows.push(['Dimensions', '<span class="pending">Listed on request</span>']);
  }
  // one row for the painting: where it is, and how it comes
  if (collection.physical && !isGallery(work)) {
    if (p.exists === false) {
      rows.push(['Painting', '<span class="pending">Digital only, no physical work</span>']);
    } else {
      const bits = [];
      if (p.sold && work.status !== 'vaulted') bits.push(p.collector ? `With ${p.collector}` : 'With a collector');
      if (p.ready_to_hang) bits.push('Ready to hang');
      if (p.framed) bits.push('Framed'); else if (p.framed === false) bits.push('Unframed');
      if (p.certificate) bits.push('Certificate of authenticity');
      if (bits.length) rows.push(['Painting', e(bits.join(' ... '))]);
    }
  }

  if (work.edition) {
    const size = work.edition.minted || work.edition.of || work.edition.live;
    if (work.edition.type === 'edition' && size) {
      const bits = [`Edition of ${size}`];
      if (work.wrapped) bits.push(`${work.wrapped.total} wrapped on Ethereum`);
      if (work.edition.live && work.edition.live !== work.edition.minted) bits.push(`${work.edition.live} held today`);
      rows.push(['Edition', e(bits.join(' ... '))]);
    } else if (work.edition.type !== 'edition') {
      rows.push(['Edition', 'Unique 1/1']);
    }
  }

  if (d.image_details && d.image_details.width) {
    rows.push(['Resolution', `${d.image_details.width} x ${d.image_details.height} ${e(d.image_details.format || '')}`]);
  }
  if (MF.animationUrl(work)) rows.push(['Motion', 'Yes, plays under the still']);

  /* Notes are the last row, filled in once they load. They live in the table
     rather than in a section of their own because that is what they are: one
     more thing that is true about this work, beside its year and its medium.
     The row stays out of the document entirely until there is something in it
     or somebody who may write in it. */
  return `<table class="rows">${rows.map(([k, v]) => `<tr><th>${e(k)}</th><td>${v}</td></tr>`).join('')}`
    + '<tr class="nt-row" id="ntRow" hidden><th></th><td></td></tr></table>';
}

// Traits come off chain as they were written, in their own order.
function traitsOf(work) {
  const a = work.attributes || work.digital?.attributes;
  return Array.isArray(a) ? a.filter((t) => t && (t.trait_type || t.name) && t.value != null && t.value !== '') : [];
}

function traitRows(traits) {
  return `<table class="rows traits">${traits.map((t) => {
    const name = t.trait_type || t.name;
    const isColour = /^#[0-9a-f]{3,8}$/i.test(String(t.value));
    const value = isColour
      ? `<span class="swatch" style="background:${e(String(t.value))}"></span>${e(String(t.value))}`
      : e(String(t.value));
    return `<tr><th>${e(name)}</th><td>${value}</td></tr>`;
  }).join('')}</table>`;
}

function provenanceFold(work) {
  const d = work.digital || {};
  /* Nothing on chain, and not sold into being on chain either. Said plainly,
     rather than as an empty table of chain rows with nothing in them. */
  if (isGallery(work)) {
    return `<details>
      <summary>Provenance</summary>
      <div class="fold-body">
        <p>Not yet tokenized. This work is on record here and nowhere else ... no contract, no token, nothing written to chain. When it is written, the record graduates in place and keeps this page and this address.</p>
      </div>
    </details>`;
  }
  if (d.minted === false) {
    return `<details>
      <summary>Provenance</summary>
      <div class="fold-body">
        <p>Not minted yet. This work is tokenized at the moment it sells, on ${e(d.chain === 'bitcoin' ? 'Bitcoin' : 'Ethereum')}${d.standard ? ' as ' + e(d.standard) : ''}, so the first owner written to chain is the collector rather than the artist.</p>
        <p>The token and the painting travel together. The certificate references both.</p>
      </div>
    </details>`;
  }
  /* A work that a nudge shaped carries it for good. The figure is the banked
     one, not a live reading: the nudge closed, and what it weighed then is
     what steered the work. */
  const steer = work.nudge && work.nudge.line ? `<p>${e(work.nudge.line)}</p>` : '';
  const rows = [];
  if (d.chain) rows.push(['Chain', d.chain === 'ethereum' ? 'Ethereum' : 'Bitcoin']);
  if (d.standard) rows.push(['Standard', d.standard]);
  if (d.contract) rows.push(['Contract', e(d.contract), true]);
  if (work.token_ids && work.token_ids.length > 1) {
    const ids = work.token_ids.map(Number).filter((n) => !isNaN(n)).sort((a, b) => a - b);
    rows.push(['Token IDs', ids.length ? `${ids.length} tokens, #${ids[0]} to #${ids[ids.length - 1]}` : `${work.token_ids.length} tokens`]);
  } else if (d.token_id) {
    rows.push(['Token ID', e(d.token_id)]);
  }
  if (d.inscription_id) rows.push(['Inscription', e(d.inscription_id), true]);
  else if (d.chain === 'bitcoin' && d.inscribed === false) rows.push(['Inscription', '<span class="pending">Not yet inscribed</span>']);
  if (d.inscription_number != null) rows.push(['Inscription number', e(String(d.inscription_number))]);
  if (d.asset) rows.push(['Asset', e(d.asset)]);
  if (work.wrapped) {
    rows.push(['Wrapped on Ethereum', `${work.wrapped.total} of the edition, ${work.wrapped.artist_held} still with the artist`]);
    rows.push(['Vault contract', e(work.wrapped.contract), true]);
    rows.push(['Vault token', e(work.wrapped.token_id), true]);
  }
  if (d.image_note) rows.push(['Image', `<span class="pending">${e(d.image_note)}</span>`]);
  const minted = work.minted_onchain || work.minted || d.genesis_timestamp;
  if (minted) rows.push(['Minted', e(MF.date(minted))]);
  const links = MF.links(work);
  return `
    <details>
      <summary>Provenance</summary>
      <div class="fold-body">
        ${steer}
        <table class="rows">
          ${rows.map(([k, v, mono]) => `<tr><th>${e(k)}</th><td class="${mono ? 'mono' : ''}">${v}</td></tr>`).join('')}
        </table>
        <div id="provNotes" hidden></div>
        ${links.length ? `<div class="chain-links">${links.map(([t, u]) => `<a href="${e(u)}" target="_blank" rel="noopener">${e(t)}</a>`).join('')}</div>` : ''}
      </div>
    </details>`;
}

// The two marks at the foot of the page. OpenSea only where an item page
// exists to link to, Etherscan on anything with a token. Both are fine print:
// the site's own Acquire is the way to buy, this is where to check the work.
// OpenSea's own logomark, from static.seadn.io, single path, recoloured by
// currentColor so it takes the row's grey and the hover's ink like the other.
const MARK_OS = '<svg viewBox="0 0 360 360" aria-hidden="true"><path d="M181.566 1.00604e-05C80.91 -0.82799 -0.82799 80.91 1.00604e-05 181.566C0.84601 279.306 80.694 359.172 178.416 359.982C279.072 360.846 360.846 279.072 359.982 178.416C359.172 80.712 279.306 0.84601 181.566 1.00604e-05ZM127.746 89.586C139.266 104.22 146.16 122.742 146.16 142.83C146.16 160.236 140.994 176.436 132.12 189.954H69.714L127.728 89.568L127.746 89.586ZM318.006 199.242V212.202C318.006 213.048 317.556 213.768 316.782 214.092C312.552 215.892 298.602 222.372 292.788 230.436C277.812 251.28 266.382 284.04 240.822 284.04H134.172C96.408 284.04 64.818 254.07 64.836 214.146C64.836 213.156 65.682 212.346 66.672 212.346H117.216C118.962 212.346 120.33 213.75 120.33 215.46V225.216C120.33 230.4 124.524 234.612 129.726 234.612H168.066V212.292H141.876C156.942 193.212 165.906 169.128 165.906 142.902C165.906 113.652 154.692 86.976 136.332 67.032C147.438 68.328 158.058 70.542 168.066 73.476V67.266C168.066 60.822 173.286 55.602 179.73 55.602C186.174 55.602 191.394 60.822 191.394 67.266V82.242C227.178 98.946 250.614 126.666 250.614 158.022C250.614 176.418 242.568 193.536 228.69 207.936C226.026 210.69 222.336 212.256 218.466 212.256H191.412V234.54H225.378C232.704 234.54 245.844 220.644 252.072 212.274C252.072 212.274 252.342 211.86 253.062 211.644C253.782 211.428 315.432 197.28 315.432 197.28C316.728 196.92 318.006 197.91 318.006 199.224V199.242Z"/></svg>';
const MARK_ES = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 5.4 12.1 12 15.9l6.6-3.8L12 1.5Z"/><path d="M5.4 13.5 12 17.3l6.6-3.8L12 22.5l-6.6-9Z"/></svg>';

function marketRow(work) {
  const m = MF.marks(work);
  if (!m) return '';
  const link = (url, svg, label) => url
    ? `<a href="${e(url)}" target="_blank" rel="noopener"${''}>${svg}<span class="lbl">${label}</span></a>` : '';
  const row = link(m.opensea, MARK_OS, 'Collect on OpenSea') + link(m.etherscan, MARK_ES, 'Verify on Etherscan');
  return row ? `<div class="market-row">${row}</div>` : '';
}

// once a work is collected there is nothing to quote and nothing to send, so
// the listing furniture comes off the page entirely
const isCollected = (work) => work.status === 'acquired';
// a vaulted work is held for at least a decade. Quoting it, even as "on
// application", invites an offer that is not going to be taken.
/* A gallery work is on record rather than on offer. Nothing is tokenized, so
   there is nothing to quote, nothing to send, and no acquire path ... quoting
   one even as "on application" would be offering something that does not
   exist yet. */
const isGallery = (work) => work.gallery === true || work.status === 'not_tokenized';
const isPriceless = (work) => isCollected(work) || work.status === 'vaulted' || isGallery(work);

function shippingFold(collection, meta, work) {
  if (isCollected(work) || isGallery(work)) return '';
  if (!collection.physical) return '';
  return `
    <details>
      <summary>Shipping</summary>
      <div class="fold-body"><p>${e(meta.shipping || 'Worldwide. Boxing, crating and freight included in painting price.')}</p></div>
    </details>`;
}

function pricingBlock(work, collection) {
  if (isPriceless(work)) return '';
  if (pricedInETH(work)) {
    const opts = optionsFor(work, collection);
    if (!opts.length) {
      return `<div class="pricing"><div class="pricing-head"><span class="smallcaps">Price</span></div>
        <div class="poa">On application</div></div>`;
    }
    const eth = work.pricing_eth.digital;
    return `<div class="pricing">
      <div class="pricing-head"><span class="smallcaps">Price</span></div>
      <div class="price-row">
        <span class="what">Digital</span>
        <span class="amount" data-eth="${eth}">${eth} ETH</span>
      </div>
      <div class="converted" id="converted">Listed in ETH. <span id="ethNzd">Converting...</span></div>
    </div>`;
  }
  // the same list the Acquire flow offers, so the page cannot advertise a
  // painting that has already gone
  // framing is an add-on chosen at the point of buying, not a fourth and fifth
  // price to read on the way past
  const all = optionsFor(work, collection);
  const rows = all.filter((o) => !o.framed).map((o) => [
    o.key === 'painting' ? 'Painting' : o.label,
    o.nzd,
  ]);
  const framedNote = all.some((o) => o.framed) && collection.framing_fee_quoted
    ? `Framing available, +${collection.framing_fee_quoted}`
    : null;

  if (!rows.length) {
    return `<div class="pricing">
      <div class="pricing-head"><span class="smallcaps">Price</span></div>
      <div class="poa">On application</div>
    </div>`;
  }

  return `<div class="pricing">
    <div class="pricing-head">
      <span class="smallcaps">Price</span>
      ${MF.currencyBar('cur')}
    </div>
    ${rows.map(([what, nzd]) => `
      <div class="price-row">
        <span class="what">${e(what)}</span>
        <span class="amount" data-nzd="${nzd}">$${Math.round(nzd).toLocaleString('en-NZ')}</span>
      </div>`).join('')}
    ${framedNote ? `<div class="framed-note">${e(framedNote)}</div>` : ''}
    <div class="converted" id="converted" hidden></div>
  </div>`;
}

/* Two ways to the same work: the site's own checkout, in fiat or on a reserve,
   and the listing itself, filled from the buyer's own wallet.

   Foundation is not one of them. Those tokens sit in Foundation's escrow
   rather than in Ryan's wallet, and sending a buyer there sends them away from
   the site to a venue he is withdrawing from. A Foundation listing still sets
   the price, because the price is whatever the chain says ... it just no
   longer offers a way to act on it here. When the tokens come back and the
   OpenSea listings exist, this lights up again on its own, because the rule
   below is about the venue and not about the work. */
function onchainBuy(work) {
  const l = work.listing;
  if (!l || !l.url) return '';
  if (String(l.venue || '').toLowerCase() === 'foundation') return '';
  if (l.kind === 'auction') {
    return `<a class="onchain" href="${e(l.url)}" target="_blank" rel="noopener">
      <span class="w">At auction</span><span class="s">Bid in your own wallet</span></a>`;
  }
  if (l.kind !== 'buy-now' || !(l.price_eth > 0)) return '';
  /* A live listing settles the token in the same transaction as the payment,
     so there is nothing to wait for and nobody to trust with the wait. That
     makes it the better digital route, and it leads. */
  return `<a class="onchain lead" href="${e(l.url)}" target="_blank" rel="noopener">
    <span class="w">Buy now ... ${e(String(l.price_eth))} ETH</span>
    <span class="s">Instant transfer, from your wallet</span></a>`;
}
// the on-chain route leads only when it is genuinely instant
const instant = (work) => {
  const l = work.listing;
  return Boolean(l && l.kind === 'buy-now' && l.price_eth > 0
    && String(l.venue || '').toLowerCase() !== 'foundation');
};

function actionBlock(work, collection) {
  const s = work.status;
  const hasPrice = optionsFor(work, collection).length > 0;

  if (s === 'available') {
    // a listed work leads with the listing; everything else leads with the site
    const buy = onchainBuy(work);
    const site = `<button class="${instant(work) ? 'btn quiet' : 'btn'}" id="acquire">${
      instant(work) ? 'Other ways to acquire' : (hasPrice ? 'Acquire this artwork' : 'Enquire about this artwork')}</button>`;
    return `<div class="action">${instant(work) ? buy + site : site + buy}</div>`;
  }
  // The painting has gone but editions of the digital work remain. Who has it
  // is already said under the title, so it is not said twice here.
  if (s === 'acquired' && hasPrice) {
    return `<div class="action">
      <button class="btn" id="acquire">Acquire the digital work</button>
    </div>`;
  }
  if (s === 'reserved') {
    const until = MF.date(work.reserve && work.reserve.expires);
    return `<div class="action"><div class="state"><span class="dot reserved"></span>
      <span class="word">Reserved${until ? ' until ' + e(until) : ''}</span></div></div>`;
  }
  if (s === 'pending') {
    return `<div class="action">
      <div class="state"><span class="dot reserved"></span>
        <span class="word">At the checkout</span>
        <span class="sub">Someone is paying for this one</span></div>
      <p class="note">Holds last half an hour at most. If it does not go through the work comes straight back.</p>
    </div>`;
  }
  if (s === 'acquired') {
    // the collector now reads under the title, so all that is left here is
    // anything the collector wanted said
    if (!(work.collector && work.collector.note)) return '';
    return `<div class="action"><p class="note">${e(work.collector.note)}</p></div>`;
  }
  if (s === 'vaulted') {
    return `<div class="action">
      <div class="state"><span class="dot vaulted"></span><span class="word">Vaulted ... mintestate.eth</span></div>
      <p class="note">Held for at least ten years, then passed down through the MintFace bloodline.</p>
      <div style="margin-top:14px"><a class="smallcaps" href="/vault">The vault</a></div>
    </div>`;
  }
  if (s === 'sold_out') {
    const ed = work.edition || {};
    return `<div class="action">
      <div class="state"><span class="dot acquired"></span><span class="word">Sold out</span>
        ${ed.minted ? `<span class="sub">${ed.minted} minted${ed.live && ed.live !== ed.minted ? ', ' + ed.live + ' held today' : ''}</span>` : ''}</div>
    </div>`;
  }
  if (s === 'uninscribed') {
    return `<div class="action">
      <button class="btn" id="acquire">Enquire to have inscribed</button>
      <div class="state"><span class="dot uninscribed"></span>
        <span class="word">Not yet inscribed</span>
        <span class="sub">Part of the canon, waiting on Bitcoin</span></div>
    </div>`;
  }
  if (s === 'burned') {
    return `<div class="action"><div class="state"><span class="dot burned"></span><span class="word">Burned</span>
      <span class="sub">Returned to the zero address</span></div></div>`;
  }
  return '';
}

/* Who else holds a copy.
 *
 * Named and, where the register gives them a page, linked to it ... the same
 * treatment the attribution under the title gets, because it is the same fact
 * about the same people. The names and the links are laid in afterwards by
 * nameHolders(), so the fold reads correctly whether or not either arrives. */
function holdersBlock(work) {
  if (!work.holders || work.holders.length < 2) return '';
  const named = work.holders.filter((h) => h.display_name || h.ens).slice(0, 12);
  if (!named.length) return '';
  return `<details>
    <summary>Collectors</summary>
    <div class="fold-body">
      <div class="holders" id="holders">${named.map((h) =>
        `<span class="hold" data-a="${e(String(h.address || '').toLowerCase())}">${e(h.display_name || h.ens)}</span>`).join('<br>')}${work.holders.length > named.length ? `<br><span class="pending">and ${work.holders.length - named.length} more</span>` : ''}</div>
    </div>
  </details>`;
}

function motionKind(url) {
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return 'video';
  if (/\.(gif|webp|png|jpe?g|avif)(\?|$)/i.test(url)) return 'image';
  return 'live'; // html renderers, AR scenes, generative pieces
}

function stage(work) {
  const img = MF.imageUrl(work);
  const anim = MF.animationUrl(work);
  const kind = anim ? motionKind(anim) : null;
  return `<div class="stage">
    <div class="frame">
      ${MF.img(work, 1600, { eager: true, live: true })}
      ${anim ? `<div class="motion" id="motion" data-url="${e(anim)}" data-kind="${kind}">
        <div class="motion-label">${kind === 'live' ? 'Living version' : 'Motion'}</div>
        ${kind === 'image'
          ? `<img src="${e(anim)}" alt="${e((work.title || 'Work') + ', in motion')}" loading="lazy">`
          : `<button class="ghost" id="play">${kind === 'video' ? 'Play' : 'Open the living version'}</button>`}
      </div>` : ''}
    </div>
  </div>`;
}

function wireMotion() {
  const btn = document.getElementById('play');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const box = document.getElementById('motion');
    const url = box.dataset.url;
    const holder = document.createElement('div');
    holder.className = 'motion-frame';
    holder.innerHTML = box.dataset.kind === 'video'
      ? `<video src="${e(url)}" controls autoplay playsinline loop></video>`
      : `<iframe src="${e(url)}" title="Living version" loading="lazy" allow="accelerometer; camera; gyroscope; xr-spatial-tracking; fullscreen" sandbox="allow-scripts allow-same-origin"></iframe>`;
    btn.replaceWith(holder);
  });
}

/* Two Burdens &middot; 2024.
 *
 * The collection is a place on this site and the year is a fact about the work,
 * so only one of them is a link. The year stays plain for the same reason a
 * date in the details table is plain: there is nothing at the other end of it.
 * The sequence sits between them and is likewise only a number.
 */
function collectionLine(work, collection) {
  const bits = [
    `<a href="/c/${e(collection.slug)}">${e(collection.title)}</a>`,
    work.sequence ? e(work.sequence) : null,
    MF.year(work, collection) ? e(MF.year(work, collection)) : null,
  ].filter(Boolean);
  return bits.join(' &middot; ');
}

// some contracts title a work with the mint number alone
function displayTitle(work, collection) {
  const t = (work.title || '').trim();
  if (!t) return 'Untitled';
  return /^#?\d+$/.test(t) ? `${collection.title} ${t.startsWith('#') ? t : '#' + t}` : t;
}

function collectedLine(work) {
  if (!isCollected(work)) return '';
  const name = MF.collectorName(work.collector);
  const when = work.collector && work.collector.acquired
    ? MF.date(work.collector.acquired, { month: 'long', year: 'numeric' })
    : null;
  // the name links to their page when they have one; the link is filled in
  // after the map loads, so the line reads correctly either way
  return `<div class="collected">
    <div class="who"><span class="dot acquired"></span> Collected by <span id="collectorName">${e(name || 'a private collector')}</span></div>
    ${when ? `<div class="when">${e(when)}</div>` : ''}
  </div>`;
}

function render(work, collection, meta) {
  const shown = displayTitle(work, collection);
  const traits = traitsOf(work);
  document.title = `${shown} ... MintFace`;
  /* The way back to the collection is the byline under the title, which links
     it already. The header link that used to say it too has retired into the
     one nav, where a work page has no business putting a third thing. */
  const desc = work.statement || work.subtitle || '';
  document.querySelector('meta[name="description"]').setAttribute('content', desc.slice(0, 180) || `${work.title} by MintFace.`);

  document.getElementById('main').innerHTML = `
    ${stage(work)}
    <div class="col">
      <h1>${e(shown)}</h1>
      <div class="byline">${collectionLine(work, collection)}</div>
      ${collectedLine(work)}

      <div class="tabs" role="tablist">
        ${desc ? '<button class="tab" role="tab" id="tab-desc" aria-selected="true" aria-controls="panel-desc">Description</button>' : ''}
        <button class="tab" role="tab" id="tab-det" aria-selected="${desc ? 'false' : 'true'}" aria-controls="panel-det">Details</button>
        ${traits.length ? '<button class="tab" role="tab" id="tab-traits" aria-selected="false" aria-controls="panel-traits">Traits</button>' : ''}
      </div>

      ${desc ? `<div class="panel" id="panel-desc" role="tabpanel" aria-labelledby="tab-desc">
        <p class="statement">${e(desc)}</p>
      </div>` : ''}

      <div class="panel" id="panel-det" role="tabpanel" aria-labelledby="tab-det"${desc ? ' hidden' : ''}>
        ${detailRows(work, collection)}
      </div>

      ${traits.length ? `<div class="panel" id="panel-traits" role="tabpanel" aria-labelledby="tab-traits" hidden>
        ${traitRows(traits)}
      </div>` : ''}

      <div style="margin-top:30px">
        ${provenanceFold(work)}
        ${holdersBlock(work)}
        ${shippingFold(collection, meta, work)}
      </div>

      ${pricingBlock(work, collection)}
      ${actionBlock(work, collection)}
      ${marketRow(work)}
    </div>`;

  MF.progress.watch(document.getElementById('main'));
  wireZoom(work);
  wireTabs();
  wireMotion();
  wireCurrency();
  wireSheetClose();
  wireAcquire(work, collection);
  wireNotes(work);
  thanksIfPaid();
}

/* ---------- notes ---------- */
/* A work grows a line of writing, in the Details table, as its last row.
 *
 * Not a section of its own. A note is one more thing that is true about this
 * work, beside its year and its medium, and putting it in the table says that
 * more plainly than a heading ever could. The row shows the newest note; where
 * there are more, they unfold underneath it in the same table language.
 *
 * Writing happens in the row. There is no page to go to and no dialogue to
 * open ... the value becomes an input, and saving turns it back into a note.
 *
 * And the row is silent when it has nothing to say. No public note and no
 * right to write one, and it never enters the document at all: no empty state,
 * no explanation of a thing you cannot do. Absence is silent.
 */
const NOTES = { id: null, wallet: null, data: null, open: false, writing: null, busy: false, say: null };

// the same sentence api/_lib/notes.js builds, to the character
const noteSentence = ({ action, work, text, visibility, address, issued }) => [
  'MintFace ... a note on a work',
  '',
  `Work: ${work}`,
  `Action: ${action}`,
  ...(text != null ? [`Note: ${text}`] : []),
  ...(visibility ? [`Visible: ${visibility}`] : []),
  `Wallet: ${address}`,
  `Issued: ${issued}`,
  '',
  'Signing writes this note. It moves nothing and spends nothing.',
].join('\n');

async function wireNotes(work) {
  NOTES.id = work.id;
  /* Who is here, asked of the wallet rather than of the person. A wallet
     already connected to this site answers without a prompt; one that is not
     says nothing, and nothing is what the page then offers. */
  NOTES.wallet = await MF.knownAccount();
  await loadNotes();
}

async function loadNotes() {
  const q = new URLSearchParams({ work: NOTES.id });
  if (NOTES.wallet) q.set('viewer', NOTES.wallet);
  try {
    const r = await fetch(`/api/notes?${q.toString()}`, { headers: { accept: 'application/json' } });
    NOTES.data = r.ok ? await r.json() : null;
  } catch (err) { NOTES.data = null; }
  drawNotes();
}

/* Written into the row rather than through a redraw, so saying something does
   not take a half-written note out from under the person writing it. */
const notesSay = (text, bad) => {
  NOTES.say = text ? { text, bad: Boolean(bad) } : null;
  const el = document.getElementById('ntSay');
  if (!el) { drawNotes(); return; }
  el.textContent = text || '';
  el.classList.toggle('bad', Boolean(bad));
  el.hidden = !text;
};

const noteDate = (s) => {
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' });
};
const wearTao = (n) => {
  const v = Math.floor(Number(n) || 0);
  if (v >= 1000000) return `${(v / 1000000).toFixed(2).replace(/\.?0+$/, '')}M`;
  if (v >= 1000) return `${(v / 1000).toFixed(1).replace(/\.0$/, '')}K`;
  return String(v);
};

/** NAME · ROLE · DATE, in the small mono the table uses for its labels. */
function byline(n) {
  const role = n.kind === 'artist' ? 'Artist'
    : n.kind === 'provenance' ? e(n.tenure)
      : n.tao ? `Collector &middot; ${wearTao(n.tao)} TAO`
        : 'Collector';
  /* Whoever wrote it, linked to their page. A note is signed work, and a
     signature you cannot follow is half a signature. Anyone the register will
     not name in public renders unlinked, exactly as they do everywhere else. */
  const who = n.url
    ? `<a class="nt-who" href="${e(n.url)}">${e(n.byline)}</a>`
    : e(n.byline);
  const bits = [who, role, e(noteDate(n.at))];
  if (n.visibility === 'private') bits.push('Private to you');
  if (n.edited) bits.push('edited');
  return `<div class="nt-by">${bits.join(' &middot; ')}</div>`;
}

function noteBlock(n, { own } = {}) {
  const acts = [];
  if (n.can_edit) acts.push(`<button data-act="edit" data-id="${e(n.id)}">Edit</button>`);
  if (n.can_edit) acts.push(`<button data-act="delete" data-id="${e(n.id)}">Delete</button>`);
  if (n.can_hide && !n.mine) acts.push(`<button data-act="hide" data-id="${e(n.id)}">Hide</button>`);
  return `<div class="nt${own ? ' own' : ''}">
    <p>${e(n.text)}</p>
    ${byline(n)}
    ${acts.length ? `<div class="nt-acts">${acts.join('')}</div>` : ''}
  </div>`;
}

function noteEditor() {
  const w = NOTES.writing;
  const max = (NOTES.data && NOTES.data.max_chars) || 500;
  const me = (NOTES.data && NOTES.data.me) || {};
  const canPrivate = Boolean(me.can_be_private) && !w.id;
  const len = (w.text || '').length;
  return `<div class="nt-edit">
    <textarea id="ntText" maxlength="${max + 40}" placeholder="Write about the work." spellcheck="true">${e(w.text || '')}</textarea>
    <div class="nt-edit-foot">
      ${canPrivate ? `<label><input type="checkbox" id="ntPriv"${w.visibility === 'private' ? ' checked' : ''}> Private to me</label>` : '<span></span>'}
      <span class="nt-count${len > max ? ' over' : ''}" id="ntCount">${len}/${max}</span>
      <button class="nt-go" id="ntGo" data-act="post"${len && len <= max ? '' : ' disabled'}>${w.id ? 'Save' : 'Sign and add'}</button>
    </div>
  </div>`;
}

function drawNotes() {
  const row = document.getElementById('ntRow');
  const prov = document.getElementById('provNotes');
  if (!row) return;

  const d = NOTES.data;
  const list = (d && d.notes) || [];
  const gone = (d && d.provenance) || [];
  const me = d && d.me;

  /* Provenance notes sit with the provenance, which is where a former
     collector's tenure already lives. */
  if (prov) {
    if (gone.length) {
      prov.innerHTML = `<div class="nt-prov"><div class="nt-prov-head">Notes from former collectors</div>`
        + gone.map((n) => noteBlock(n)).join('') + '</div>';
      prov.hidden = false;
    } else { prov.innerHTML = ''; prov.hidden = true; }
  }

  // no store, nothing written, nobody who may write: the row never appears
  if (!d || d.store === false || (!list.length && !(me && me.can_write) && !NOTES.writing)) {
    row.hidden = true;
    row.querySelector('th').innerHTML = '';
    row.querySelector('td').innerHTML = '';
    return;
  }

  const mine = NOTES.wallet ? list.find((n) => n.mine) : null;
  const act = NOTES.writing ? `<button data-act="cancel">Cancel</button>`
    : me && me.can_write ? `<button data-act="${mine ? 'edit' : 'write'}"${mine ? ` data-id="${e(mine.id)}"` : ''}>${mine ? 'Edit' : 'Add a note'}</button>`
      : '';

  const fold = (d.fold_after || 3);
  const shown = NOTES.writing ? [] : (NOTES.open ? list : list.slice(0, 1));
  const rest = list.length - shown.length;

  row.querySelector('th').innerHTML = `Notes${act ? `<span class="nt-act">${act}</span>` : ''}`;
  row.querySelector('td').innerHTML =
    (NOTES.writing ? noteEditor() : shown.map((n) => noteBlock(n, { own: n.mine })).join(''))
    + (!NOTES.writing && rest > 0 ? `<button class="nt-all" data-act="open">All notes &middot; ${list.length}</button>` : '')
    + (!NOTES.writing && NOTES.open && list.length > 1 ? `<button class="nt-all" data-act="close">Fewer</button>` : '')
    + `<div class="nt-say" id="ntSay"${NOTES.say ? '' : ' hidden'}>${e(NOTES.say ? NOTES.say.text : '')}</div>`;
  row.hidden = false;
  void fold;

  if (NOTES.writing) {
    const t = document.getElementById('ntText');
    if (t && document.activeElement !== t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
}

async function notesSend(payload) {
  const issued = new Date().toISOString();
  const message = noteSentence({ ...payload, address: NOTES.wallet, issued });
  const signature = await MF.sign(message, NOTES.wallet, (state, why) => {
    if (state === 'requested') notesSay('Signature requested ... check your wallet.');
    if (state === 'slow') notesSay('Still waiting on the wallet. A hardware wallet may need waking, or its prompt may have opened behind this window.');
    if (state === 'signed') notesSay('Signed. Saving.');
    if (state === 'failed') notesSay(why, true);
  });
  const r = await fetch('/api/notes', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ...payload, address: NOTES.wallet, issued, signature }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'that did not go through');
  return j;
}

document.addEventListener('input', (ev) => {
  if (!ev.target.matches('#ntText') || !NOTES.writing) return;
  NOTES.writing.text = ev.target.value;
  const max = (NOTES.data && NOTES.data.max_chars) || 500;
  const c = document.getElementById('ntCount');
  if (c) { c.textContent = `${ev.target.value.length}/${max}`; c.classList.toggle('over', ev.target.value.length > max); }
  const go = document.getElementById('ntGo');
  if (go) go.disabled = !ev.target.value.trim() || ev.target.value.length > max;
});

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('.nt-row button[data-act], #provNotes button[data-act]');
  if (!b || NOTES.busy) return;
  const act = b.dataset.act;
  const id = b.dataset.id;

  if (act === 'open') { NOTES.open = true; drawNotes(); return; }
  if (act === 'close') { NOTES.open = false; drawNotes(); return; }
  if (act === 'cancel') { NOTES.writing = null; NOTES.say = null; drawNotes(); return; }

  if (act === 'write') {
    NOTES.writing = { id: null, text: '', visibility: 'public' };
    NOTES.say = null;
    drawNotes();
    return;
  }

  if (act === 'edit') {
    const all = ((NOTES.data.notes || []).concat(NOTES.data.provenance || []));
    const n = all.find((x) => x.id === id);
    if (!n) return;
    NOTES.writing = { id, text: n.text, visibility: n.visibility };
    NOTES.say = null;
    drawNotes();
    return;
  }

  const run = async (fn) => {
    NOTES.busy = true;
    b.disabled = true;
    try { await fn(); } catch (err) { notesSay(String((err && err.message) || err), true); }
    finally { NOTES.busy = false; }
  };

  if (act === 'delete') {
    if (!window.confirm('Delete this note? It does not come back.')) return;
    return run(async () => {
      await notesSend({ action: 'delete', id, work: NOTES.id });
      NOTES.writing = null; NOTES.say = null;
      await loadNotes();
    });
  }

  if (act === 'hide') {
    return run(async () => {
      await notesSend({ action: 'hide', id, work: NOTES.id });
      await loadNotes();
    });
  }

  if (act === 'post') {
    const text = (document.getElementById('ntText') || {}).value || '';
    const box = document.getElementById('ntPriv');
    const visibility = box && box.checked ? 'private' : 'public';
    return run(async () => {
      if (NOTES.writing.id) await notesSend({ action: 'edit', id: NOTES.writing.id, work: NOTES.id, text });
      else await notesSend({ action: 'write', work: NOTES.id, text, visibility });
      NOTES.writing = null; NOTES.say = null; NOTES.open = true;
      await loadNotes();
    });
  }
});

function wireZoom(work) {
  // a film or a living SVG is already doing something; taking it over with a
  // lightbox would take that away
  if (!MF.zoomable(work)) return;
  const img = document.querySelector('.stage .frame img');
  if (!img) return;
  img.classList.add('zoomable');
  img.addEventListener('click', (ev) => {
    ev.preventDefault();
    MF.zoom.open(work, img.currentSrc || img.src);
  });
}

function wireTabs() {
  const tabs = [...document.querySelectorAll('.tab')];
  tabs.forEach((t) => t.addEventListener('click', () => {
    tabs.forEach((x) => {
      const on = x === t;
      x.setAttribute('aria-selected', String(on));
      document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
    });
  }));
}

async function wireCurrency() {
  const ethAmount = document.querySelector('.amount[data-eth]');
  if (ethAmount) {
    const fx = await MF.fx();
    const eth = Number(ethAmount.dataset.eth);
    const nzd = fx.eth ? eth / fx.eth : null;
    const usd = nzd != null && fx.usd ? nzd * fx.usd : null;
    const line = document.getElementById('ethNzd');
    if (line) {
      line.textContent = nzd != null
        ? `About $${Math.round(nzd).toLocaleString('en-NZ')} NZD${usd != null ? `, US$${Math.round(usd).toLocaleString('en-US')}` : ''} at today's rate.`
        : 'Rate unavailable just now.';
    }
  }

  const bar = document.getElementById('cur');
  if (!bar) return;
  const note = document.getElementById('converted');
  const sayRate = (c) => {
    if (!note) return;
    note.hidden = c === 'NZD';
    if (c !== 'NZD') note.textContent = 'Converted from New Zealand dollars, updated hourly.';
  };
  const { currency } = await MF.paintPrices();
  sayRate(currency);
  MF.wireCurrencyBar(bar, sayRate);
}

/* ---------------- acquire ---------------- */

const SHEET = {
  el: () => document.getElementById('sheet'),
  body: () => document.getElementById('sheetBody'),
  open() {
    this.el().classList.add('open');
    this.el().setAttribute('aria-hidden', 'false');
    document.getElementById('scrim').classList.add('open');
  },
  close() {
    this.el().classList.remove('open');
    this.el().setAttribute('aria-hidden', 'true');
    document.getElementById('scrim').classList.remove('open');
  },
};

let ACQ = { work: null, collection: null, what: null, fx: null, quote: null };
let QUOTE_TIMER = null;

// The rate is locked when the slide-over opens and honoured for its full life.
// Nothing on screen moves under the buyer while they are deciding.
async function lockQuote() {
  try {
    const r = await fetch('/api/quote', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ workId: ACQ.work.id }),
    });
    if (!r.ok) throw new Error('no quote');
    ACQ.quote = await r.json();
  } catch {
    ACQ.quote = null; // fall back to the hourly rates, and say so
  }
  return ACQ.quote;
}

const quoteLive = () => ACQ.quote && Date.now() < ACQ.quote.expires;

// crypto and USD figures come from the locked rates while a quote is live
function rateFor(currency) {
  if (quoteLive()) {
    const r = ACQ.quote.rates || {};
    if (currency === 'ETH') return r.eth;
    if (currency === 'BTC') return r.btc;
    if (currency === 'USD') return r.usd;
  }
  const fx = ACQ.fx || {};
  if (currency === 'ETH') return fx.eth;
  if (currency === 'USD') return fx.usd;
  return null;
}

function heldStrip() {
  return '<div class="held" id="held"></div>';
}

function startCountdown(onExpire) {
  clearInterval(QUOTE_TIMER);
  const el = document.getElementById('held');
  if (!el) return;
  const tick = () => {
    if (!ACQ.quote) {
      el.innerHTML = '<span>Rates refresh hourly</span>';
      return;
    }
    const left = ACQ.quote.expires - Date.now();
    if (left <= 0) {
      clearInterval(QUOTE_TIMER);
      el.classList.add('stale');
      el.innerHTML = '<span>The quote has expired</span><button id="requote">Take a fresh rate</button>';
      const b = document.getElementById('requote');
      if (b) b.addEventListener('click', async () => { await lockQuote(); if (onExpire) onExpire(); });
      return;
    }
    const m = Math.floor(left / 60000);
    const sec = Math.floor((left % 60000) / 1000);
    el.classList.remove('stale');
    el.innerHTML = `<span>Rate held</span><span>${m}:${String(sec).padStart(2, '0')}</span>`;
  };
  tick();
  QUOTE_TIMER = setInterval(tick, 1000);
}

// What is on offer is decided at import time and recorded on the work, so the
// page and the checkout cannot drift apart or reason about it differently.
// A work is priced in one currency and converted into the others. Most are NZD;
// Geodetic Moments and Geodetica are listed in ETH, so that is their price and
// the NZD figure is the one that moves.
function pricedInETH(work) {
  return work.priced_in === 'ETH' && work.pricing_eth && work.pricing_eth.digital != null;
}

function optionsFor(work, collection) {
  const preview = previewPrices();
  if (pricedInETH(work) && !preview) {
    const rate = rateFor('ETH');   // ETH per one NZD
    const nzd = rate ? work.pricing_eth.digital / rate : null;
    return (work.offers && work.offers.digital === false) ? [] : [{
      key: 'digital', label: 'Digital', eth: work.pricing_eth.digital, nzd,
      sub: 'The token, transferred to your wallet',
    }];
  }
  const p = { ...(work.pricing_nzd || {}), ...(preview || {}) };
  const ph = work.physical || {};
  const o = work.offers || null;
  const allow = (key, fallback) => (preview ? true : o ? o[key] === true : fallback);
  const paintingFallback = collection.physical && ph.exists !== false && ph.sold !== true;

  // framing is never a stored price. It is the painting price plus one fee,
  // so there is nothing to keep in step when a painting is repriced.
  const fee = collection.framing ? Number(collection.framing_fee_nzd) || 0 : 0;
  const quoted = collection.framing_fee_quoted || null;

  const out = [];
  if (p.digital != null && allow('digital', true)) out.push({ key: 'digital', label: 'Digital', nzd: p.digital, sub: 'The token, transferred to your wallet' });
  if (p.painting != null && allow('painting', paintingFallback)) {
    out.push({
      key: 'painting',
      label: fee ? 'Painting, unframed' : 'Painting',
      nzd: p.painting,
      sub: 'The physical work, shipped worldwide',
    });
    if (fee) out.push({
      key: 'painting_framed',
      label: 'Painting, framed',
      nzd: p.painting + fee,
      framed: true,
      sub: 'Framed here before it ships',
      extra: quoted ? `Framing +${quoted}` : null,
    });
  }
  if (p.both != null && allow('both', paintingFallback)) {
    out.push({
      key: 'both',
      label: work.painting_included ? 'Painting and token' : 'Both together',
      nzd: p.both,
      sub: work.painting_included
        ? 'The painting comes with the token, no extra cost'
        : 'Painting and token, one provenance',
    });
    if (fee) out.push({
      key: 'both_framed',
      label: work.painting_included ? 'Painting and token, framed' : 'Both together, framed',
      nzd: p.both + fee,
      framed: true,
      sub: 'Painting and token, framed before it ships',
      extra: quoted ? `Framing +${quoted}` : null,
    });
  }
  return out;
}

function money(nzd) {
  if (nzd == null || !isFinite(nzd)) return null;
  return 'NZ$' + Math.round(nzd).toLocaleString('en-NZ');
}

// An option knows what it is priced in. Everything else is converted from that.
function amountIn(option, currency) {
  const ethRate = rateFor('ETH');           // ETH per one NZD
  const usdRate = rateFor('USD');
  if (option.eth != null) {
    if (currency === 'ETH') return option.eth.toFixed(4) + ' ETH';
    const nzd = ethRate ? option.eth / ethRate : null;
    if (currency === 'NZD') return money(nzd);
    return nzd != null && usdRate ? 'US$' + Math.round(nzd * usdRate).toLocaleString('en-US') : null;
  }
  if (currency === 'NZD') return money(option.nzd);
  if (currency === 'USD') return usdRate ? 'US$' + Math.round(option.nzd * usdRate).toLocaleString('en-US') : null;
  return ethRate ? (option.nzd * ethRate).toFixed(4) + ' ETH' : null;
}

// what the buyer is actually asked to agree to, in the currency it is priced in
const headlinePrice = (option) =>
  amountIn(option, option.eth != null ? 'ETH' : MF.currency());

/* The same line the work page carries under its title, in the slide-over that
   sits over it. It is the same fact, so it is the same link ... a collection
   name that leads somewhere on the page and nowhere in the panel would be the
   panel quietly disagreeing with the page it opened from. */
const which = (work, collection) => collectionLine(work, collection);

function stepWhat() {
  const opts = optionsFor(ACQ.work, ACQ.collection);
  if (opts.length === 1) { ACQ.what = opts[0].key; return stepHow(); }
  SHEET.body().innerHTML = `
    <h2>${e(ACQ.work.title || 'Untitled')}</h2>
    <div class="which">${which(ACQ.work, ACQ.collection)}</div>
    <div class="step">What would you like</div>
    ${opts.map((o) => `<button class="choice" data-what="${o.key}" aria-pressed="false">
      <span class="what">${e(o.label)}<span class="sub">${e(o.sub)}</span>${o.extra ? `<span class="add">${e(o.extra)}</span>` : ''}</span>
      <span class="amt">${e(headlinePrice(o) || '...')}</span>
    </button>`).join('')}
    <p class="note">Shipping, crating and freight are included.</p>`;
  SHEET.body().querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
    ACQ.what = b.dataset.what;
    stepHow();
  }));
  // a price in the viewer's currency needs a rate, so fill the figures in as
  // soon as one arrives rather than leaving three dots on the button
  if (opts.some((o) => headlinePrice(o) == null)) {
    MF.fx().then((fx) => {
      ACQ.fx = fx;
      SHEET.body().querySelectorAll('.choice').forEach((b) => {
        const o = opts.find((x) => x.key === b.dataset.what);
        const amt = b.querySelector('.amt');
        if (o && amt) amt.textContent = headlinePrice(o) || '...';
      });
    });
  }
}

// the fortnight, said once, as a date rather than a count
function untilDate(days) {
  const d = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
  return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
}

function stepHow() {
  const opts = optionsFor(ACQ.work, ACQ.collection);
  const chosen = opts.find((o) => o.key === ACQ.what) || opts[0];
  const frog = ACQ.work.wrapped || ACQ.work.digital?.asset === 'FROGDNA';
  SHEET.body().innerHTML = `
    <h2>${e(ACQ.work.title || 'Untitled')}</h2>
    <div class="which">${e(chosen.label)} &middot; ${e(headlinePrice(chosen) || '...')}</div>
    <div class="step">How would you like to pay</div>
    <button class="choice" data-how="nzd"><span class="what">Card, New Zealand dollars<span class="sub">${chosen.eth != null ? "Converted at today's rate" : 'Stripe checkout'}</span></span><span class="amt" id="nzdAmt">...</span></button>
    <button class="choice" data-how="usd"><span class="what">Card, US dollars<span class="sub">Converted at today's rate</span></span><span class="amt" id="usdAmt">...</span></button>
    <button class="choice" data-how="eth"><span class="what">Ethereum<span class="sub">From your wallet to mintface.eth</span></span><span class="amt" id="ethAmt">...</span></button>
    ${frog ? `<button class="choice" data-how="btc"><span class="what">Bitcoin<span class="sub">Counterparty, arranged directly</span></span><span class="amt">&rarr;</span></button>` : ''}
    <button class="choice" data-how="reserve"><span class="what">Reserve<span class="sub">No payment, no obligation</span></span><span class="amt" id="resUntil">until ${e(untilDate(14))}</span></button>
    <p class="note">${ACQ.work.digital && ACQ.work.digital.minted === false
      ? 'This work is not minted yet. It is tokenized when it sells, so your wallet is the first owner written to chain.'
      : 'The token is transferred by hand after payment, usually within a day.'}</p>
    ${heldStrip()}`;

  const paintAmounts = () => {
    for (const [id, cur] of [['nzdAmt', 'NZD'], ['usdAmt', 'USD'], ['ethAmt', 'ETH']]) {
      const el = document.getElementById(id);
      if (el) el.textContent = amountIn(chosen, cur) || 'unavailable';
    }
  };
  MF.fx().then((fx) => { ACQ.fx = fx; paintAmounts(); });
  paintAmounts();
  startCountdown(() => { paintAmounts(); });

  SHEET.body().querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
    const how = b.dataset.how;
    if (how === 'nzd' || how === 'usd') return stripeCheckout(how.toUpperCase());
    if (how === 'reserve') return stepReserve();
    if (how === 'eth') return stepEth(chosen);
    if (how === 'btc') return stepBtc(chosen);
  }));
}

async function stripeCheckout(currency) {
  SHEET.body().innerHTML = '<p class="ok">Opening the checkout...</p>';
  try {
    const r = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ workId: ACQ.work.id, what: ACQ.what, currency, quote: quoteLive() ? ACQ.quote.quote : null }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'could not start the checkout');
    location.href = j.url;
  } catch (err) {
    const busy = /at the checkout|busy/i.test(err.message);
    SHEET.body().innerHTML = busy
      ? `<h2>Someone is at the checkout</h2>
         <p class="ok">This one is held while another buyer finishes paying.</p>
         <p class="note">Holds last half an hour at most. If they do not go through with it the work comes straight back, so it is worth looking again shortly.</p>
         <button class="choice go" id="retry"><span class="what">Try again</span><span class="amt">&rarr;</span></button>`
      : `<p class="ok">That did not work.</p><p class="err">${e(err.message)}</p>
         <p class="note">Email art@mintface.art and it will be sorted by hand.</p>`;
    const again = document.getElementById('retry');
    if (again) again.addEventListener('click', () => stepHow());
  }
}

function stepReserve() {
  SHEET.body().innerHTML = `
    <h2>Hold it for a fortnight</h2>
    <div class="which">${e(ACQ.work.title || 'Untitled')}</div>
    <p class="note">Nothing is charged. The work shows as reserved until ${e(untilDate(14))} and quietly returns if the fortnight passes.</p>
    <div class="step">Where to reach you</div>
    <input id="resName" type="text" placeholder="Name" autocomplete="name">
    <input id="resEmail" type="email" placeholder="Email" autocomplete="email" required>
    <button class="choice go" id="resGo"><span class="what">Hold it</span><span class="amt">until ${e(untilDate(14))}</span></button>
    <div id="resErr"></div>`;
  document.getElementById('resGo').addEventListener('click', async () => {
    const name = document.getElementById('resName').value.trim();
    const email = document.getElementById('resEmail').value.trim();
    const err = document.getElementById('resErr');
    err.innerHTML = '';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.innerHTML = '<p class="err">An email address, so the reminder can reach you.</p>'; return; }
    try {
      const r = await fetch('/api/reserve', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ workId: ACQ.work.id, name, email }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'could not hold it');
      const until = MF.date(j.expires);
      SHEET.body().innerHTML = `<p class="ok">Held for you until ${e(until)}.</p>
        <p class="note">A note is on its way to ${e(email)}. Reply to it whenever you are ready, or let the fortnight pass and it lifts on its own.</p>`;
    } catch (e2) {
      err.innerHTML = `<p class="err">${e(e2.message)}</p>`;
    }
  });
}

function stepEth(chosen) {
  const to = '0xd40B63bF04a44e43fBFE5784bCf22ACaAB34a180';
  const ethRate = rateFor('ETH');
  const eth = chosen.eth != null ? chosen.eth : (ethRate ? chosen.nzd * ethRate : null);
  SHEET.body().innerHTML = `
    <h2>Pay with Ethereum</h2>
    <div class="which">${e(chosen.label)} &middot; ${e(headlinePrice(chosen) || '')}</div>
    <p class="note">The payment goes to mintface.eth from your own wallet. Nothing here can move your funds or your tokens.</p>
    <div class="step">Amount</div>
    <p class="ok">${eth ? eth.toFixed(4) + ' ETH' : 'rate unavailable'}</p>
    <div class="step">Send to</div>
    <p class="mono-line">mintface.eth<br>${e(to)}</p>
    ${window.ethereum ? '<button class="choice go" id="ethGo"><span class="what">Connect wallet and pay</span><span class="amt">' + (eth ? eth.toFixed(4) + ' ETH' : '') + '</span></button>' : ''}
    <div class="step">Or paste the transaction</div>
    <input id="ethTx" type="text" placeholder="0x transaction hash" spellcheck="false">
    <button class="choice go" id="ethConfirm"><span class="what">I have sent it</span><span class="amt">&rarr;</span></button>
    <div id="ethErr"></div>
    <p class="note">Once the transaction confirms, the work shows as collected. Ryan transfers the token by hand, hardware signed, usually within a day.</p>
    ${heldStrip()}`;
  startCountdown(() => stepEth(chosen));

  const confirm = async (txHash) => {
    const err = document.getElementById('ethErr');
    err.innerHTML = '<p class="note">Checking the chain...</p>';
    try {
      const r = await fetch('/api/eth-payment', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ workId: ACQ.work.id, what: ACQ.what, txHash, quote: ACQ.quote ? ACQ.quote.quote : null }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'could not verify that payment');
      SHEET.body().innerHTML = `<p class="ok">Received, thank you.</p>
        <p class="note">${j.paid ? j.paid.toFixed(4) + ' ETH' : 'Payment'} confirmed on chain. Ryan will transfer the token to the wallet that paid, and will be in touch about anything physical.</p>`;
    } catch (e2) {
      err.innerHTML = `<p class="err">${e(e2.message)}</p>`;
    }
  };

  const go = document.getElementById('ethGo');
  if (go) go.addEventListener('click', async () => {
    const err = document.getElementById('ethErr');
    try {
      if (!eth) throw new Error('the rate is not available, paste a transaction hash instead');
      const [from] = await window.ethereum.request({ method: 'eth_requestAccounts' });
      const wei = '0x' + BigInt(Math.round(eth * 1e18)).toString(16);
      const txHash = await window.ethereum.request({
        method: 'eth_sendTransaction',
        params: [{ from, to, value: wei }],
      });
      document.getElementById('ethTx').value = txHash;
      await confirm(txHash);
    } catch (e2) {
      err.innerHTML = `<p class="err">${e(e2.message || 'the wallet declined')}</p>`;
    }
  });
  document.getElementById('ethConfirm').addEventListener('click', () => {
    const tx = document.getElementById('ethTx').value.trim();
    if (!/^0x[0-9a-fA-F]{64}$/.test(tx)) {
      document.getElementById('ethErr').innerHTML = '<p class="err">That does not look like a transaction hash.</p>';
      return;
    }
    confirm(tx);
  });
}

async function stepBtc(chosen) {
  const asset = ACQ.work.digital?.asset || 'FROGDNA';
  SHEET.body().innerHTML = `
    <h2>Pay with Bitcoin</h2>
    <div class="which">${e(asset)} &middot; Counterparty</div>
    <p class="note">The native asset lives on Bitcoin as a Counterparty issuance, so this one settles directly rather than through a checkout.</p>
    <div class="step">Amount</div>
    <p class="ok" id="btcAmt">${e(headlinePrice(chosen) || '...')}</p>
    <div class="step">Send to</div>
    <p class="mono-line" id="btcAddr">Loading the address...</p>
    <div class="step">Then</div>
    <p class="note">Email the transaction and the Bitcoin address you would like ${e(asset)} sent to. The asset transfers once the payment confirms, usually the same day.</p>
    <button class="choice go" id="btcMail"><span class="what">Email about ${e(asset)}</span><span class="amt">&rarr;</span></button>
    <p class="note">If you would rather pay in ETH, the wrapped edition on Ethereum is the same asset inside an EmblemVault and goes through the wallet flow instead.</p>
    ${heldStrip()}`;
  startCountdown(() => stepBtc(chosen));

  document.getElementById('btcMail').addEventListener('click', () => {
    location.href = `mailto:art@mintface.art?subject=${encodeURIComponent(asset + ' ... paying in Bitcoin')}`;
  });

  const locked = rateFor('BTC');
  const nzdFor = chosen.eth != null ? (rateFor('ETH') ? chosen.eth / rateFor('ETH') : null) : chosen.nzd;
  if (locked && nzdFor != null) {
    document.getElementById('btcAmt').textContent = `${(nzdFor * locked).toFixed(6)} BTC  ${money(nzdFor)}`;
  }
  try {
    const r = await fetch('/api/pay-details?chain=bitcoin').then((x) => x.json());
    const addr = document.getElementById('btcAddr');
    addr.textContent = r.address || 'Address on request, email below and it comes straight back.';
    if (!locked && r.rate && nzdFor != null) {
      document.getElementById('btcAmt').textContent = `${(nzdFor * r.rate).toFixed(6)} BTC  ${money(nzdFor)}`;
    }
  } catch (err) {
    document.getElementById('btcAddr').textContent = 'Address on request, email below and it comes straight back.';
  }
}

// closing the panel is wired on its own, so it works whether the panel was
// opened by the Acquire button or by coming back from Stripe
function wireSheetClose() {
  const shut = () => { clearInterval(QUOTE_TIMER); SHEET.close(); };
  document.getElementById('sheetClose').addEventListener('click', shut);
  document.getElementById('scrim').addEventListener('click', shut);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') shut(); });
}

function wireAcquire(work, collection) {
  const b = document.getElementById('acquire');
  if (!b) return;
  const priced = optionsFor(work, collection).length > 0;
  b.addEventListener('click', () => {
    if (!priced) {
      const subject = encodeURIComponent(
        work.status === 'uninscribed'
          ? `Inscription enquiry ... ${work.title} ... ${collection.title}`
          : `${work.title} ... ${collection.title}`);
      location.href = `mailto:ryan@mintface.art?subject=${subject}`;
      return;
    }
    ACQ = { work, collection, what: null, fx: ACQ.fx, quote: null };
    SHEET.open();
    stepWhat();
    lockQuote();
  });
}

// coming back from Stripe: the webhook does the fulfilling, this only says thank you
function thanksIfPaid() {
  const paid = new URLSearchParams(location.search).get('paid');
  if (!paid) return;
  SHEET.open();
  SHEET.body().innerHTML = `<h2>Thank you</h2>
    <p class="ok">Your payment went through.</p>
    <p class="note">A confirmation is on its way. The work will show as collected here shortly, and Ryan will be in touch about the token and anything physical.</p>
    <button class="choice go" id="thanksDone"><span class="what">Back to the work</span><span class="amt">&rarr;</span></button>`;
  document.getElementById('thanksDone').addEventListener('click', () => {
    SHEET.close();
    // drop the ?paid= so a refresh does not thank them twice
    history.replaceState(null, '', location.pathname);
  });
}

(async function () {
  const id = workId();
  try {
    const hit = await MF.work(id);
    if (!hit) {
      document.getElementById('main').innerHTML = `<div class="loading">Work not found</div>`;
      return;
    }
    const idx = await MF.index();
    // The listing is the price. A live on-chain listing overrides the catalogue
    // figure by filling in the ETH fields the page already understands, so
    // nothing downstream needs to know where the number came from.
    const listing = MF.listingFor(hit.work, await MF.listings());
    if (listing && listing.kind === 'buy-now' && listing.price_eth > 0) {
      hit.work.priced_in = 'ETH';
      hit.work.pricing_eth = { ...(hit.work.pricing_eth || {}), digital: listing.price_eth };
      hit.work.offers = { ...(hit.work.offers || {}), digital: true };
    }
    if (listing) hit.work.listing = listing;
    render(hit.work, hit.collection, idx._meta || {});

    /* Name and link the people on this page from the register.
     *
     * Both arrive after the render on purpose. The catalogue was built last
     * night and the register answers now, so a collector who chose a name this
     * morning is named this morning; and the slug map decides which of them
     * have pages worth pointing at. Neither is required for the page to read
     * correctly, which is why neither is awaited before it draws. */
    const [slugs, names] = await Promise.all([MF.collectorSlugs(), MF.names()]);
    const slot = document.getElementById('collectorName');
    if (slot && hit.work.collector) {
      const said = MF.collectorName(hit.work.collector, names);
      if (said) slot.textContent = said;
      const url = MF.collectorUrl(hit.work.collector, slugs);
      // one register across two deploys, so it opens in this tab like any page
      if (url) slot.innerHTML = `<a href="${e(url)}">${e(slot.textContent)}</a>`;
    }
    for (const el of document.querySelectorAll('#holders .hold')) {
      const a = el.dataset.a;
      const chosen = names[a];
      if (chosen) el.textContent = chosen;
      const url = MF.collectorUrl({ address: a }, slugs);
      if (url) el.innerHTML = `<a href="${e(url)}">${e(el.textContent)}</a>`;
    }
  } catch (err) {
    document.getElementById('main').innerHTML = `<div class="loading">Could not load this work</div>`;
    console.error(err);
  }
})();
</script>
