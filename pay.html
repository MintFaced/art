<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- A private offer (COMPOSITION-32): /pay/{id}#k={key}, made in the studio for
     one buyer. Every figure on it is the offer's, read from the server; the
     page never sends an amount. -->
<title>Private offer ... MintFace</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-white-32.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#faf9f6">
<script>(function(){try{
var c=document.cookie.match(/(?:^|;\s*)mf_theme=(day|night)/),
    t=c?c[1]:localStorage.getItem('mf_theme');
if(t!=='day'&&t!=='night')t=null;
if(t)document.documentElement.setAttribute('data-theme',t);
var n=(t||(matchMedia('(prefers-color-scheme:dark)').matches?'night':'day'))==='night';
document.querySelector('meta[name="theme-color"]').setAttribute('content',n?'#1a1814':'#faf9f6');
}catch(e){}})();</script>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mintface.css">
<style>
.po{max-width:1240px;margin:0 auto;padding:48px 28px 96px;box-sizing:border-box;color:var(--ink);font-family:var(--font-sans)}
.po .mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.po .grey{color:var(--muted)}
.po [hidden]{display:none!important}
.po-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:64px;align-items:start}
.po-art{position:sticky;top:88px}
.po-art img{display:block;max-width:100%;max-height:560px;width:auto;height:auto;margin:0 auto;background:var(--sunk)}
.po h1{font-family:var(--font-sans);font-weight:400;font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;line-height:1.05;margin:0 0 10px}
.po-spec{font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;line-height:1.6;text-transform:uppercase;color:var(--muted);margin:0 0 28px}
.po-for{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 22px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.po-amt{font-family:var(--font-mono);font-size:24px;letter-spacing:.01em;margin:0 0 6px}
.po-gst{font-size:14px;color:var(--muted);margin:0 0 22px}
.po-del{font-size:16px;line-height:1.55;margin:0 0 30px}
.po-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--font-sans);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.po-btn[disabled]{opacity:.5;cursor:default}
.po-say{min-height:20px;font-size:14px;color:var(--muted);margin:14px 0 0}
.po-until{font-size:13px;color:var(--muted);margin:18px 0 0}
.po-done{max-width:560px;margin:8vh auto 0;font-size:19px;line-height:1.6;text-align:center}
.po-done h1{margin-bottom:14px}
.po-done a{color:var(--ink)}
@media(max-width:820px){
  .po{padding:28px 20px 72px}
  .po-grid{grid-template-columns:minmax(0,1fr);gap:28px}
  .po-art{position:static}
  .po-btn{width:100%}
}
</style>
</head>
<body>
<header class="nav" id="nav"></header>
<main class="po" id="main"><p class="mono grey">Loading</p></main>
<script src="/mintface.js"></script>
<script type="module" src="/pay.js"></script>
</body>
</html>
